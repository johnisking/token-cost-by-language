<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1020; color: #e8ecff; font-family: system-ui, Segoe UI, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #hud { width: 640px; max-width: 96vw; display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  #hud span b { color: #ffd166; }
  canvas { background: linear-gradient(#141a36, #0a0d1f); border: 2px solid #2b3566; border-radius: 8px; max-width: 96vw; height: auto; cursor: none; touch-action: none; }
  #help { font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<div id="hud">
  <span>Score: <b id="score">0</b></span>
  <span>Level: <b id="level">1</b> / 2</span>
  <span>Lives: <b id="lives">3</b></span>
</div>
<canvas id="c" width="640" height="480"></canvas>
<div id="help">Move: ← → / A D or mouse &nbsp;•&nbsp; Launch / pause: Space or click &nbsp;•&nbsp; P pauses</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const $ = id => document.getElementById(id);

  const PADDLE_H = 12, PADDLE_Y = H - 30, BALL_R = 7;
  const COLS = 10, BW = 56, BH = 20, GAP = 4, TOP = 50;
  const LEFT = (W - (COLS * (BW + GAP) - GAP)) / 2;
  const COLORS = ['#ff595e', '#ff924c', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'];

  // Level layouts: digit = hit points (0 = empty)
  const LEVELS = [
    {
      speed: 300, paddle: 100,
      rows: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      speed: 360, paddle: 84,
      rows: [
        '2222222222',
        '1101111011',
        '1110110111',
        '1111001111',
        '2121111212',
        '0111111110',
        '0011221100',
      ],
    },
  ];

  let state = 'ready'; // ready | playing | paused | over | won | between
  let level = 0, score = 0, lives = 3;
  let bricks = [], paddle, ball, particles = [];
  const keys = {};

  function buildLevel(n) {
    const L = LEVELS[n];
    bricks = [];
    L.rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = +ch;
        if (hp > 0) bricks.push({
          x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP),
          hp, max: hp, color: COLORS[r % COLORS.length],
        });
      });
    });
    paddle = { w: L.paddle, x: W / 2 - L.paddle / 2 };
    resetBall();
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    state = 'ready';
  }

  function newGame() {
    level = 0; score = 0; lives = 3; particles = [];
    buildLevel(0);
    updateHud();
  }

  function updateHud() {
    $('score').textContent = score;
    $('lives').textContent = lives;
    $('level').textContent = level + 1;
  }

  function launch() {
    if (state === 'ready') {
      const speed = LEVELS[level].speed;
      const a = (Math.random() * 0.6 - 0.3);
      ball.vx = speed * Math.sin(a);
      ball.vy = -speed * Math.cos(a);
      ball.stuck = false;
      state = 'playing';
    } else if (state === 'over' || state === 'won') {
      newGame();
    } else if (state === 'between') {
      level++;
      buildLevel(level);
      updateHud();
    } else if (state === 'paused') {
      state = 'playing';
    }
  }

  function togglePause() {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }

  // ---------- input ----------
  addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', ' ', 'Spacebar'].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' && !e.repeat) launch();
    if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && !e.repeat) togglePause();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function mouseToPaddle(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (W / rect.width);
    paddle.x = x - paddle.w / 2;
    clampPaddle();
  }
  canvas.addEventListener('mousemove', e => mouseToPaddle(e.clientX));
  canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') mouseToPaddle(e.clientX); });
  canvas.addEventListener('mousedown', e => { mouseToPaddle(e.clientX); launch(); });
  addEventListener('blur', () => { if (state === 'playing') state = 'paused'; });

  function clampPaddle() {
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  // ---------- update ----------
  function burst(x, y, color) {
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
    }
  }

  function update(dt) {
    // keyboard paddle
    const pv = 520;
    if (keys['arrowleft'] || keys['a']) paddle.x -= pv * dt;
    if (keys['arrowright'] || keys['d']) paddle.x += pv * dt;
    clampPaddle();

    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);

    if (state === 'ready') {
      ball.x = paddle.x + paddle.w / 2;
      return;
    }
    if (state !== 'playing') return;

    // sub-step to avoid tunnelling
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 4) || 1;
    for (let i = 0; i < steps && state === 'playing'; i++) step(dt / steps);
  }

  function step(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // paddle
    if (ball.vy > 0 && ball.y + BALL_R >= PADDLE_Y && ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 6 &&
        ball.x >= paddle.x - BALL_R && ball.x <= paddle.x + paddle.w + BALL_R) {
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const ang = Math.max(-1, Math.min(1, rel)) * (Math.PI / 3);
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = speed * Math.sin(ang);
      ball.vy = -speed * Math.cos(ang);
      ball.y = PADDLE_Y - BALL_R;
    }

    // bricks
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BW));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // resolve on the axis of least penetration
      const overlapX = ball.x < b.x + BW / 2 ? ball.x + BALL_R - b.x : b.x + BW - (ball.x - BALL_R);
      const overlapY = ball.y < b.y + BH / 2 ? ball.y + BALL_R - b.y : b.y + BH - (ball.y - BALL_R);
      if (overlapX < overlapY) ball.vx = ball.x < b.x + BW / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      else ball.vy = ball.y < b.y + BH / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);

      b.hp--;
      score += b.hp === 0 ? 10 * b.max : 5;
      if (b.hp === 0) burst(b.x + BW / 2, b.y + BH / 2, b.color);
      // slight speed-up as bricks fall
      const sp = Math.hypot(ball.vx, ball.vy), max = LEVELS[level].speed * 1.5;
      if (sp < max) { ball.vx *= 1.01; ball.vy *= 1.01; }
      updateHud();
      break;
    }

    if (bricks.every(b => b.hp <= 0)) {
      if (level + 1 < LEVELS.length) { state = 'between'; score += 100; }
      else { state = 'won'; score += 200; }
      updateHud();
      return;
    }

    if (ball.y - BALL_R > H) {
      lives--;
      updateHud();
      if (lives <= 0) state = 'over';
      else resetBall();
    }
  }

  // ---------- render ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function banner(title, sub) {
    ctx.fillStyle = 'rgba(8, 10, 24, .72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px system-ui, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 10);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = '#c5cbf0';
    ctx.fillText(sub, W / 2, H / 2 + 28);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.globalAlpha = b.max > 1 && b.hp === 1 ? 0.55 : 1;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, BW, BH, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.fillRect(b.x + 3, b.y + 2, BW - 6, 3);
      if (b.max > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, BW - 2, BH - 2, 4); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#e8ecff';
    roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 6); ctx.fill();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (state === 'ready') {
      ctx.fillStyle = '#c5cbf0'; ctx.textAlign = 'center'; ctx.font = '16px system-ui, sans-serif';
      ctx.fillText(`Level ${level + 1} — click or press Space to launch`, W / 2, H / 2 + 60);
    } else if (state === 'paused') banner('Paused', 'Press P, Space or click to resume');
    else if (state === 'between') banner(`Level ${level + 1} cleared!`, 'Click or press Space for the next level');
    else if (state === 'over') banner('Game Over', `Final score ${score} — click or press Space to retry`);
    else if (state === 'won') banner('You Win!', `Final score ${score} — click or press Space to play again`);
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
