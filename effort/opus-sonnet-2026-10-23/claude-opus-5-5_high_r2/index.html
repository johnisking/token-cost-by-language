<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1a; color: #e6ecff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; user-select: none; }
  canvas { background: #121a2e; border: 2px solid #2b3a63; border-radius: 8px; max-width: 96vw; max-height: 86vh; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .help { font-size: 14px; color: #8f9cc4; text-align: center; }
  kbd { background: #1f2a47; border: 1px solid #34467a; border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #e6ecff; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div class="help">
  Move: <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> or the mouse &nbsp;·&nbsp;
  Launch: <kbd>Space</kbd> / click &nbsp;·&nbsp; Pause: <kbd>P</kbd> / <kbd>Esc</kbd>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const HUD = 44;                // height of the top score bar
  const MAX_LIVES = 3;

  // Level maps: '.' = empty, '1' = normal brick, '2' = tough brick (2 hits)
  const LEVELS = [
    {
      name: 'Level 1',
      speed: 380,
      map: [
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      name: 'Level 2',
      speed: 450,
      map: [
        '..222222..',
        '.21111112.',
        '2211..1122',
        '1111111111',
        '21.2112.12',
        '1111111111',
        '..1....1..',
      ],
    },
  ];

  const ROW_COLORS = ['#ff5d73', '#ff9f43', '#ffd93d', '#6bdb7a', '#4cc9f0', '#8b7bff', '#f472d0'];
  const BRICK = { cols: 10, h: 22, gap: 6, side: 30, top: HUD + 36 };
  BRICK.w = (W - BRICK.side * 2 - BRICK.gap * (BRICK.cols - 1)) / BRICK.cols;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 620 };
  const ball = { r: 8, x: W / 2, y: H / 2, vx: 0, vy: 0, speed: 380 };

  let bricks = [];
  let particles = [];
  let level = 0;
  let score = 0;
  let lives = MAX_LIVES;
  let state = 'title';           // title | serve | play | paused | levelclear | gameover | win
  let keys = {};
  let mouseX = null;
  let best = 0;
  try { best = parseInt(localStorage.getItem('brickBreakerBest') || '0', 10) || 0; } catch (e) {}

  // ---------- setup ----------
  function loadLevel(n) {
    level = n;
    bricks = [];
    const map = LEVELS[n].map;
    map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: BRICK.side + c * (BRICK.w + BRICK.gap),
          y: BRICK.top + r * (BRICK.h + BRICK.gap),
          w: BRICK.w, h: BRICK.h,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
    particles = [];
    resetBall();
  }

  function resetBall() {
    ball.speed = LEVELS[level].speed;
    ball.vx = 0; ball.vy = 0;
    state = 'serve';
  }

  function startGame() {
    score = 0;
    lives = MAX_LIVES;
    paddle.x = W / 2 - paddle.w / 2;
    loadLevel(0);
  }

  function launch() {
    const angle = (Math.random() * 50 - 25) * Math.PI / 180;
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = 'play';
  }

  // Primary action: Space / Enter / mouse click
  function action() {
    switch (state) {
      case 'title': case 'gameover': case 'win': startGame(); break;
      case 'serve': launch(); break;
      case 'paused': state = 'play'; break;
      case 'levelclear': loadLevel(level + 1); break;
    }
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }

  // ---------- input ----------
  window.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter') action();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { keys = {}; if (state === 'play') state = 'paused'; });

  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  canvas.addEventListener('mousedown', e => { if (e.button === 0) action(); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- helpers ----------
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, color });
    }
  }

  function addScore(points) {
    score += points;
    if (score > best) {
      best = score;
      try { localStorage.setItem('brickBreakerBest', String(best)); } catch (e) {}
    }
  }

  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      addScore(b.maxHp * 10 * (level + 1));
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.maxHp > 1 ? '#c9d3ee' : b.color, 14);
      ball.speed = Math.min(ball.speed + 4, LEVELS[level].speed + 180);
      const dir = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = ball.vx / dir * ball.speed;
      ball.vy = ball.vy / dir * ball.speed;
    } else {
      addScore(5);
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#c9d3ee', 5);
    }
  }

  function loseLife() {
    lives--;
    spawnParticles(ball.x, H - 4, '#ff5d73', 20);
    if (lives <= 0) state = 'gameover';
    else resetBall();
  }

  // ---------- update ----------
  function update(dt) {
    // Paddle: keyboard takes priority; mouse movement re-enables mouse control
    if (state !== 'paused') {
      const dir = ((keys.ArrowRight || keys.KeyD) ? 1 : 0) - ((keys.ArrowLeft || keys.KeyA) ? 1 : 0);
      if (dir !== 0) {
        paddle.x += dir * paddle.speed * dt;
        mouseX = null;
      } else if (mouseX !== null) {
        paddle.x = mouseX - paddle.w / 2;
      }
      paddle.x = clamp(paddle.x, 0, W - paddle.w);
    }

    // Particles
    if (state !== 'paused') {
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }

    if (state === 'serve') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }
    if (state !== 'play') return;

    // Move the ball in small sub-steps to avoid tunnelling through bricks
    const dist = ball.speed * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r / 2)));
    const sdt = dt / steps;
    const r = ball.r;

    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      // Walls
      if (ball.x - r < 0) { ball.x = r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + r > W) { ball.x = W - r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - r < HUD) { ball.y = HUD + r; ball.vy = Math.abs(ball.vy); }

      // Paddle: bounce angle depends on where the ball hits it
      if (ball.vy > 0 && circleHitsRect(ball.x, ball.y, r, paddle.x, paddle.y, paddle.w, paddle.h) && ball.y < paddle.y + paddle.h / 2) {
        const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
        const angle = hit * 60 * Math.PI / 180;
        ball.vx = ball.speed * Math.sin(angle);
        ball.vy = -ball.speed * Math.cos(angle);
        ball.y = paddle.y - r;
      }

      // Bricks (at most one per sub-step)
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        if (!circleHitsRect(ball.x, ball.y, r, b.x, b.y, b.w, b.h)) continue;
        const overlapX = Math.min(ball.x + r - b.x, b.x + b.w - (ball.x - r));
        const overlapY = Math.min(ball.y + r - b.y, b.y + b.h - (ball.y - r));
        if (overlapX < overlapY) {
          ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        hitBrick(b);
        break;
      }

      // Level cleared?
      if (bricks.every(b => b.hp <= 0)) {
        addScore(lives * 100);
        state = level < LEVELS.length - 1 ? 'levelclear' : 'win';
        return;
      }

      // Fell off the bottom
      if (ball.y - r > H) { loseLife(); return; }
    }
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = '#0e1426';
    ctx.fillRect(0, 0, W, HUD);
    ctx.fillStyle = '#2b3a63';
    ctx.fillRect(0, HUD - 2, W, 2);

    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e6ecff';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 16, HUD / 2);

    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + (level + 1) + ' / ' + LEVELS.length, W / 2, HUD / 2);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#8f9cc4';
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText('BEST ' + best, W - 130, HUD / 2);

    // Lives as little balls
    for (let i = 0; i < MAX_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 90 + i * 26, HUD / 2, 8, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ff5d73' : '#2b3a63';
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      let color = b.color;
      if (b.maxHp > 1) color = b.hp > 1 ? '#9aa6c8' : '#c9d3ee';
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
      if (b.maxHp > 1 && b.hp > 1) {
        ctx.strokeStyle = '#5b6894';
        ctx.lineWidth = 2;
        roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4);
        ctx.stroke();
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#7dd3fc');
    g.addColorStop(1, '#2563eb');
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#7dd3fc';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.9);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(8, 12, 24, 0.72)';
    ctx.fillRect(0, HUD, W, H - HUD);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px system-ui, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillStyle = '#c9d3ee';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 14 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    if (state !== 'title') drawBall();
    drawParticles();
    drawHUD();

    switch (state) {
      case 'title':
        overlay('BRICK BREAKER', ['Clear 2 levels with 3 lives', 'Click or press Space to start']);
        break;
      case 'serve':
        ctx.textAlign = 'center';
        ctx.fillStyle = '#c9d3ee';
        ctx.font = '18px system-ui, sans-serif';
        ctx.fillText(LEVELS[level].name + ' — click or press Space to launch', W / 2, H - 90);
        break;
      case 'paused':
        overlay('PAUSED', ['Press P / Esc, Space or click to resume']);
        break;
      case 'levelclear':
        overlay('LEVEL CLEAR!', ['Score: ' + score, 'Click or press Space for ' + LEVELS[level + 1].name]);
        break;
      case 'gameover':
        overlay('GAME OVER', ['Final score: ' + score, 'Click or press Space to play again']);
        break;
      case 'win':
        overlay('YOU WIN!', ['Final score: ' + score, 'Click or press Space to play again']);
        break;
    }
  }

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  loadLevel(0);
  state = 'title';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
