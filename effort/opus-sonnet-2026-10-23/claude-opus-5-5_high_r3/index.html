<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  #help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa6c0;
    text-align: center;
  }
  kbd {
    background: #2a3248;
    border: 1px solid #46516e;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Move: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd> or mouse &nbsp;|&nbsp;
  Launch: <kbd>Space</kbd> or click &nbsp;|&nbsp;
  Pause: <kbd>P</kbd>
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ---- Configuration ----
  const HUD_H = 40;
  const PADDLE_W = 110;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 40;
  const PADDLE_SPEED = 560;      // px/s for keyboard
  const BALL_R = 8;
  const START_LIVES = 3;
  const BRICK_ROWS_TOP = HUD_H + 30;
  const BRICK_GAP = 6;
  const BRICK_H = 22;

  // Level layouts: each char is a brick. '.' = empty, '1'-'3' = hits needed.
  const LEVELS = [
    {
      name: "Level 1",
      ballSpeed: 340,
      layout: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "Level 2",
      ballSpeed: 400,
      layout: [
        "3..3333..3",
        "2222222222",
        "2.2.22.2.2",
        "1111111111",
        ".11.11.11.",
        "1111111111",
        "..1....1..",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5d73", "#ff9f43", "#feca57", "#1dd1a1", "#48dbfb", "#54a0ff", "#a29bfe"];
  const HIT_COLORS = { 2: "#c8d0e0", 3: "#7f8aa3" };

  // ---- State ----
  const state = {
    mode: "title",     // title | serve | play | paused | levelClear | gameOver | win
    levelIndex: 0,
    score: 0,
    lives: START_LIVES,
    bricks: [],
    paddle: { x: W / 2 - PADDLE_W / 2, w: PADDLE_W },
    ball: { x: 0, y: 0, vx: 0, vy: 0, speed: 0 },
    particles: [],
    timer: 0,
  };

  const keys = { left: false, right: false };
  let mouseX = null;

  // ---- Level setup ----
  function buildLevel(index) {
    const level = LEVELS[index];
    const cols = level.layout[0].length;
    const brickW = (W - 40 - BRICK_GAP * (cols - 1)) / cols;
    state.bricks = [];
    level.layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hits = parseInt(ch, 10);
        state.bricks.push({
          x: 20 + c * (brickW + BRICK_GAP),
          y: BRICK_ROWS_TOP + r * (BRICK_H + BRICK_GAP),
          w: brickW,
          h: BRICK_H,
          hits,
          maxHits: hits,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true,
        });
      });
    });
  }

  function resetBall() {
    const b = state.ball;
    b.speed = LEVELS[state.levelIndex].ballSpeed;
    b.vx = 0;
    b.vy = 0;
    stickBallToPaddle();
    state.mode = "serve";
  }

  function stickBallToPaddle() {
    state.ball.x = state.paddle.x + state.paddle.w / 2;
    state.ball.y = PADDLE_Y - BALL_R - 1;
  }

  function launchBall() {
    const b = state.ball;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    b.vx = Math.cos(angle) * b.speed;
    b.vy = Math.sin(angle) * b.speed;
    state.mode = "play";
  }

  function newGame() {
    state.levelIndex = 0;
    state.score = 0;
    state.lives = START_LIVES;
    state.particles = [];
    state.paddle.x = W / 2 - PADDLE_W / 2;
    buildLevel(0);
    resetBall();
  }

  function nextLevel() {
    state.levelIndex++;
    state.particles = [];
    state.paddle.x = W / 2 - PADDLE_W / 2;
    buildLevel(state.levelIndex);
    resetBall();
  }

  // ---- Primary action (Space / click / Enter) ----
  function action() {
    switch (state.mode) {
      case "title":
      case "gameOver":
      case "win":
        newGame();
        break;
      case "serve":
        launchBall();
        break;
      case "levelClear":
        if (state.timer <= 0) nextLevel();
        break;
      case "paused":
        state.mode = "play";
        break;
    }
  }

  function togglePause() {
    if (state.mode === "play") state.mode = "paused";
    else if (state.mode === "paused") state.mode = "play";
  }

  // ---- Input ----
  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === " " || k === "Enter") { if (!e.repeat) action(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") { togglePause(); }
  });

  window.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener("mousemove", (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener("mousedown", (e) => { mouseX = canvasX(e.clientX); action(); e.preventDefault(); });
  canvas.addEventListener("touchmove", (e) => { mouseX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { mouseX = canvasX(e.touches[0].clientX); action(); e.preventDefault(); }, { passive: false });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state.mode === "play") state.mode = "paused";
  });

  // ---- Update ----
  function updatePaddle(dt) {
    const p = state.paddle;
    if (keys.left) p.x -= PADDLE_SPEED * dt;
    if (keys.right) p.x += PADDLE_SPEED * dt;
    if (mouseX !== null && !keys.left && !keys.right) p.x = mouseX - p.w / 2;
    p.x = Math.max(0, Math.min(W - p.w, p.x));
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function updateParticles(dt) {
    for (const pt of state.particles) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 400 * dt;
      pt.life -= dt;
    }
    state.particles = state.particles.filter((pt) => pt.life > 0);
  }

  function setBallDirection(angle) {
    const b = state.ball;
    b.vx = Math.cos(angle) * b.speed;
    b.vy = Math.sin(angle) * b.speed;
  }

  function stepBall(dt) {
    const b = state.ball;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Walls
    if (b.x - BALL_R < 0) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
    if (b.x + BALL_R > W) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
    if (b.y - BALL_R < HUD_H) { b.y = HUD_H + BALL_R; b.vy = Math.abs(b.vy); }

    // Paddle
    const p = state.paddle;
    if (b.vy > 0 &&
        b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + PADDLE_H &&
        b.x + BALL_R >= p.x && b.x - BALL_R <= p.x + p.w) {
      const hit = (b.x - (p.x + p.w / 2)) / (p.w / 2); // -1 .. 1
      const clamped = Math.max(-1, Math.min(1, hit));
      const maxAngle = Math.PI / 3; // 60 degrees from vertical
      b.speed = Math.min(b.speed * 1.01, LEVELS[state.levelIndex].ballSpeed * 1.5);
      setBallDirection(-Math.PI / 2 + clamped * maxAngle);
      b.y = PADDLE_Y - BALL_R - 0.5;
    }

    // Bricks (one hit per step)
    for (const br of state.bricks) {
      if (!br.alive) continue;
      const nx = Math.max(br.x, Math.min(b.x, br.x + br.w));
      const ny = Math.max(br.y, Math.min(b.y, br.y + br.h));
      const dx = b.x - nx;
      const dy = b.y - ny;
      if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

      // Determine bounce axis by smallest penetration
      const overlapLeft = b.x + BALL_R - br.x;
      const overlapRight = br.x + br.w - (b.x - BALL_R);
      const overlapTop = b.y + BALL_R - br.y;
      const overlapBottom = br.y + br.h - (b.y - BALL_R);
      const minX = Math.min(overlapLeft, overlapRight);
      const minY = Math.min(overlapTop, overlapBottom);
      if (minX < minY) {
        b.vx = overlapLeft < overlapRight ? -Math.abs(b.vx) : Math.abs(b.vx);
      } else {
        b.vy = overlapTop < overlapBottom ? -Math.abs(b.vy) : Math.abs(b.vy);
      }

      br.hits--;
      if (br.hits <= 0) {
        br.alive = false;
        state.score += 10 * br.maxHits * (state.levelIndex + 1);
        spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color);
      } else {
        state.score += 5;
      }
      break;
    }

    // Fell below
    if (b.y - BALL_R > H) {
      state.lives--;
      if (state.lives <= 0) {
        state.mode = "gameOver";
      } else {
        resetBall();
      }
      return false;
    }
    return true;
  }

  function update(dt) {
    updateParticles(dt);
    if (state.mode === "levelClear") state.timer -= dt;
    if (state.mode === "paused" || state.mode === "title") return;

    updatePaddle(dt);

    if (state.mode === "serve") {
      stickBallToPaddle();
      return;
    }
    if (state.mode !== "play") return;

    // Sub-step to avoid tunneling through bricks
    const b = state.ball;
    const dist = Math.hypot(b.vx, b.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.5)));
    for (let i = 0; i < steps; i++) {
      if (!stepBall(dt / steps)) return;
    }

    if (state.bricks.every((br) => !br.alive)) {
      if (state.levelIndex < LEVELS.length - 1) {
        state.mode = "levelClear";
        state.timer = 0.6;
      } else {
        state.mode = "win";
      }
    }
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = "#3a4560";
    ctx.beginPath();
    ctx.moveTo(0, HUD_H);
    ctx.lineTo(W, HUD_H);
    ctx.stroke();

    ctx.font = "bold 20px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf4";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + state.score, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[state.levelIndex].name + " / " + LEVELS.length, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - START_LIVES * 22, HUD_H / 2);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (START_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < state.lives ? "#ff5d73" : "#3a4560";
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const br of state.bricks) {
      if (!br.alive) continue;
      const color = br.hits > 1 ? HIT_COLORS[br.hits] || HIT_COLORS[3] : br.color;
      roundRect(br.x, br.y, br.w, br.h, 4);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(br.x + 3, br.y + 2, br.w - 6, 4);
      if (br.hits > 1) {
        ctx.fillStyle = "#1b2133";
        ctx.font = "bold 13px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(br.hits, br.x + br.w / 2, br.y + br.h / 2 + 1);
      }
    }
  }

  function drawPaddle() {
    const p = state.paddle;
    roundRect(p.x, PADDLE_Y, p.w, PADDLE_H, 7);
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    g.addColorStop(0, "#9fd8ff");
    g.addColorStop(1, "#3b82f6");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    const b = state.ball;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fd8ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / 0.6);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(8,10,16,0.72)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px Segoe UI, Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "20px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = "#b8c3dc";
    lines.forEach((line, i) => ctx.fillText(line, W / 2, H / 2 + 15 + i * 30));
  }

  function drawHint(text) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "18px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = "#b8c3dc";
    ctx.fillText(text, W / 2, PADDLE_Y - 60);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawParticles();
    drawPaddle();
    if (state.mode !== "gameOver") drawBall();
    drawHUD();

    switch (state.mode) {
      case "title":
        drawOverlay("BRICK BREAKER", [
          "Move with Arrow keys / A-D or the mouse",
          "Press Space or click to start",
        ]);
        break;
      case "serve":
        drawHint("Press Space or click to launch");
        break;
      case "paused":
        drawOverlay("PAUSED", ["Press P, Space or click to resume"]);
        break;
      case "levelClear":
        drawOverlay("LEVEL CLEAR!", [
          "Score: " + state.score,
          state.timer <= 0 ? "Press Space or click for " + LEVELS[state.levelIndex + 1].name : "",
        ]);
        break;
      case "gameOver":
        drawOverlay("GAME OVER", ["Final score: " + state.score, "Press Space or click to play again"]);
        break;
      case "win":
        drawOverlay("YOU WIN!", ["Final score: " + state.score, "Press Space or click to play again"]);
        break;
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  stickBallToPaddle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
