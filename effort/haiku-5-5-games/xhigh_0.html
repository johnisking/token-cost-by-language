<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05070d;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(96vw, calc((100vh - 16px) * 4 / 3));
    height: auto;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(72, 219, 251, 0.15);
    touch-action: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Logical playfield size; CSS scales the canvas to fit the window.
  const W = 800;
  const H = 600;
  const HUD_H = 48;

  const BALL_R = 8;
  const PADDLE_W = 110;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 44;
  const PADDLE_SPEED = 720;     // px/s with keyboard
  const MAX_BOUNCE = 1.05;      // max deflection from vertical (radians)
  const START_LIVES = 3;
  const CONFIRM_DELAY = 400;    // ms before overlays accept input (avoids accidental skips)

  const ROW_COLORS = ['#ff6b6b', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];
  const ROW_POINTS = [60, 50, 40, 30, 20, 10];
  const HIT_POINTS = 10;        // awarded for damaging (not destroying) a multi-hit brick
  const SPECIAL_BRICKS = {
    '2': { hp: 2, color: '#c8d6e5', points: 50 },
    '3': { hp: 3, color: '#ffd32a', points: 100 },
  };

  // Map characters: '.' empty, '1' one hit (row-coloured), '2' silver (2 hits), '3' gold (3 hits)
  const LEVELS = [
    {
      speed: 330,
      map: [
        '1111111111',
        '1111111111',
        '1.11111.11',
        '1111111111',
        '1111111111',
        '1111111111',
      ],
    },
    {
      speed: 430,
      map: [
        '3333333333',
        '2.2.22.2.2',
        '1111111111',
        '1.1.11.1.1',
        '3311111133',
        '2.1.22.1.2',
        '1122222211',
        '..1....1..',
      ],
    },
  ];

  // Game state
  let mode = 'title';           // title | ready | playing | paused | levelClear | gameOver | win
  let pausedFrom = 'playing';
  let levelIndex = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  let particles = [];
  let confirmAt = 0;

  const paddle = { x: 0, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R };
  const keys = { left: false, right: false };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const levelSpeed = () => LEVELS[levelIndex].speed;

  // HiDPI canvas setup
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // Tiny optional sound effects (created lazily after the first user gesture)
  let audio = null;
  function beep(freq, dur = 0.05, vol = 0.05) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur);
    } catch (e) { /* audio is optional */ }
  }

  // ---------- Level / flow ----------

  function buildBricks(map) {
    const cols = map[0].length;
    const margin = 30, gap = 6, bh = 24;
    const bw = (W - margin * 2 - gap * (cols - 1)) / cols;
    const list = [];
    map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const special = SPECIAL_BRICKS[ch];
        const hp = special ? special.hp : 1;
        list.push({
          x: margin + c * (bw + gap),
          y: HUD_H + 50 + r * (bh + gap),
          w: bw,
          h: bh,
          hp,
          maxHp: hp,
          color: special ? special.color : ROW_COLORS[r % ROW_COLORS.length],
          points: special ? special.points : ROW_POINTS[r % ROW_POINTS.length],
        });
      });
    });
    return list;
  }

  function setupLevel() {
    bricks = buildBricks(LEVELS[levelIndex].map);
    particles = [];
    paddle.x = (W - paddle.w) / 2;
    resetBallToPaddle();
  }

  function startGame() {
    levelIndex = 0;
    score = 0;
    lives = START_LIVES;
    setupLevel();
    mode = 'ready';
  }

  function nextLevel() {
    levelIndex++;
    setupLevel();
    mode = 'ready';
  }

  function finishLevel() {
    beep(660, 0.3, 0.06);
    mode = levelIndex < LEVELS.length - 1 ? 'levelClear' : 'win';
    confirmAt = performance.now() + CONFIRM_DELAY;
  }

  function loseLife() {
    lives--;
    beep(160, 0.25, 0.08);
    if (lives <= 0) {
      mode = 'gameOver';
      confirmAt = performance.now() + CONFIRM_DELAY;
    } else {
      mode = 'ready';
      resetBallToPaddle();
    }
  }

  function togglePause() {
    if (mode === 'playing' || mode === 'ready') {
      pausedFrom = mode;
      mode = 'paused';
    } else if (mode === 'paused') {
      mode = pausedFrom;
    }
  }

  // Context-sensitive primary action (click / Space / Enter)
  function primaryAction() {
    const now = performance.now();
    switch (mode) {
      case 'title': startGame(); break;
      case 'ready': launchBall(); break;
      case 'paused': mode = pausedFrom; break;
      case 'levelClear': if (now >= confirmAt) nextLevel(); break;
      case 'gameOver':
      case 'win': if (now >= confirmAt) startGame(); break;
    }
  }

  // ---------- Ball ----------

  function resetBallToPaddle() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0;
    ball.vy = 0;
  }

  function launchBall() {
    resetBallToPaddle();
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
    ball.vx = Math.cos(angle) * levelSpeed();
    ball.vy = Math.sin(angle) * levelSpeed();
    mode = 'playing';
  }

  // Keep the ball at the level speed and stop it from going almost purely horizontal
  function keepSpeed() {
    const s = levelSpeed();
    const mag = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx *= s / mag;
    ball.vy *= s / mag;
    const minVy = s * 0.3;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
      ball.vx = (ball.vx < 0 ? -1 : 1) * Math.sqrt(s * s - minVy * minVy);
    }
  }

  function collideWalls() {
    const r = ball.r;
    if (ball.x - r < 0) {
      ball.x = r;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x + r > W) {
      ball.x = W - r;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y - r < HUD_H) {
      ball.y = HUD_H + r;
      ball.vy = Math.abs(ball.vy);
    }
  }

  function collidePaddle() {
    const r = ball.r;
    if (ball.vy <= 0) return;
    const overlapsY = ball.y + r >= paddle.y && ball.y < paddle.y + paddle.h;
    const overlapsX = ball.x >= paddle.x - r && ball.x <= paddle.x + paddle.w + r;
    if (!overlapsY || !overlapsX) return;

    // Hitting near the edge sends the ball out at a sharper angle
    const t = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
    const angle = t * MAX_BOUNCE;
    const s = levelSpeed();
    ball.vx = s * Math.sin(angle);
    ball.vy = -s * Math.cos(angle);
    ball.y = paddle.y - r;
    beep(300, 0.04);
  }

  function collideBricks() {
    const r = ball.r;
    for (const b of bricks) {
      if (b.hp <= 0) continue;

      // Circle vs rectangle
      const cx = clamp(ball.x, b.x, b.x + b.w);
      const cy = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      if (dx * dx + dy * dy > r * r) continue;

      // Bounce off the face with the smallest penetration
      const toLeft = ball.x + r - b.x;
      const toRight = b.x + b.w - (ball.x - r);
      const toTop = ball.y + r - b.y;
      const toBottom = b.y + b.h - (ball.y - r);
      const m = Math.min(toLeft, toRight, toTop, toBottom);
      if (m === toLeft) {
        ball.x = b.x - r;
        ball.vx = -Math.abs(ball.vx);
      } else if (m === toRight) {
        ball.x = b.x + b.w + r;
        ball.vx = Math.abs(ball.vx);
      } else if (m === toTop) {
        ball.y = b.y - r;
        ball.vy = -Math.abs(ball.vy);
      } else {
        ball.y = b.y + b.h + r;
        ball.vy = Math.abs(ball.vy);
      }

      b.hp--;
      if (b.hp === 0) {
        score += b.points;
        burst(b.x + b.w / 2, b.y + b.h / 2, b.color);
        beep(520 + Math.random() * 200, 0.06);
      } else {
        score += HIT_POINTS;
        beep(200, 0.04);
      }

      keepSpeed();
      if (bricks.every(bk => bk.hp <= 0)) finishLevel();
      return; // one brick per sub-step
    }
  }

  // ---------- Particles ----------

  function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 400 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- Update ----------

  function update(dt) {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);

    if (mode === 'ready') {
      resetBallToPaddle();
      return;
    }
    if (mode !== 'playing') return;

    // Sub-step so a fast ball can't tunnel through bricks or the paddle
    const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 4));
    const h = dt / steps;
    for (let i = 0; i < steps && mode === 'playing'; i++) {
      ball.x += ball.vx * h;
      ball.y += ball.vy * h;
      collideWalls();
      collidePaddle();
      collideBricks();
      if (ball.y - ball.r > H) loseLife();
    }
  }

  // ---------- Drawing ----------

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = '#0a0f1d';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(0, HUD_H - 1, W, 1);

    const mid = HUD_H / 2;
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#e2e8f0';

    ctx.textAlign = 'left';
    ctx.fillText(`SCORE ${String(score).padStart(6, '0')}`, 20, mid);

    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${levelIndex + 1} / ${LEVELS.length}`, W / 2, mid);

    ctx.textAlign = 'right';
    ctx.fillText('LIVES', W - 88, mid);
    for (let i = 0; i < START_LIVES; i++) {
      const cx = W - 28 - i * 22;
      ctx.beginPath();
      ctx.arc(cx, mid, 7, 0, Math.PI * 2);
      if (i < lives) {
        ctx.fillStyle = '#ff6b6b';
        ctx.fill();
      } else {
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      // Damaged bricks look dimmer
      ctx.globalAlpha = 0.45 + 0.55 * (b.hp / b.maxHp);
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 3);
      if (b.maxHp > 1) {
        // Pips show remaining hits
        ctx.fillStyle = '#1e293b';
        for (let i = 0; i < b.hp; i++) {
          const px = b.x + b.w / 2 + (i - (b.hp - 1) / 2) * 9;
          ctx.beginPath();
          ctx.arc(px, b.y + b.h / 2 + 1, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
    g.addColorStop(0, '#48dbfb');
    g.addColorStop(1, '#a29bfe');
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function overlayText() {
    switch (mode) {
      case 'title':
        return {
          title: 'BRICK BREAKER',
          lines: [
            `${LEVELS.length} levels | ${START_LIVES} lives`,
            '',
            'Mouse: move the paddle, click to launch the ball',
            'Keyboard: Left/Right arrows or A/D to move, Space to launch',
            'P or Esc to pause',
            '',
            'Click or press Enter to start',
          ],
        };
      case 'paused':
        return { title: 'PAUSED', lines: ['Press P or Esc, or click, to resume'] };
      case 'levelClear':
        return {
          title: `LEVEL ${levelIndex + 1} CLEARED`,
          lines: [`Score: ${score}`, 'Click or press Enter for the next level'],
        };
      case 'gameOver':
        return {
          title: 'GAME OVER',
          lines: [`Final score: ${score}`, 'Click or press Enter to play again'],
        };
      case 'win':
        return {
          title: 'YOU WIN!',
          lines: [`All ${LEVELS.length} levels cleared. Score: ${score}`, 'Click or press Enter to play again'],
        };
    }
    return { title: '', lines: [] };
  }

  function drawOverlay() {
    if (mode === 'playing') return;

    if (mode === 'ready') {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '16px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(226,232,240,0.8)';
      ctx.fillText('Click or press Space to launch', W / 2, paddle.y - 40);
      return;
    }

    const info = overlayText();
    ctx.fillStyle = 'rgba(5,8,16,0.72)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(info.title, W / 2, H * 0.34);

    ctx.font = '18px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#cbd5e1';
    info.lines.forEach((line, i) => ctx.fillText(line, W / 2, H * 0.34 + 60 + i * 28));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0f1730');
    bg.addColorStop(1, '#060912');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawHUD();
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();
    drawOverlay();
  }

  // ---------- Input ----------

  window.addEventListener('keydown', e => {
    switch (e.code) {
      case 'ArrowLeft':
      case 'KeyA':
        keys.left = true;
        break;
      case 'ArrowRight':
      case 'KeyD':
        keys.right = true;
        break;
      case 'Space':
      case 'Enter':
      case 'NumpadEnter':
        if (!e.repeat) primaryAction();
        break;
      case 'KeyP':
      case 'Escape':
        if (!e.repeat) togglePause();
        break;
      default:
        return;
    }
    e.preventDefault();
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  // Pause automatically when the window loses focus
  window.addEventListener('blur', () => {
    keys.left = false;
    keys.right = false;
    if (mode === 'playing' || mode === 'ready') {
      pausedFrom = mode;
      mode = 'paused';
    }
  });

  function pointerX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  }

  function movePaddleTo(e) {
    paddle.x = clamp(pointerX(e) - paddle.w / 2, 0, W - paddle.w);
  }

  canvas.addEventListener('pointermove', movePaddleTo);
  canvas.addEventListener('pointerdown', e => {
    movePaddleTo(e);
    primaryAction();
  });

  // ---------- Main loop ----------

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (mode !== 'paused') {
      update(dt);
      updateParticles(dt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  setupLevel();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
