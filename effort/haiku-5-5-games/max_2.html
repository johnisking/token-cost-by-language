<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1d2b44 0%, #070b14 75%);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: min(96vw, 128vh);   /* keeps the 4:3 play area fully on screen */
      height: auto;
      border-radius: 10px;
      box-shadow: 0 0 0 1px #223050, 0 20px 60px rgba(0, 0, 0, 0.6);
      touch-action: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <script>
  (() => {
    'use strict';

    // ---------- Layout & tuning ----------
    const W = 800, H = 600;                  // logical canvas size
    const HUD_H = 44;                        // score bar height
    const MARGIN = 40;                       // left/right margin of the brick field
    const COLS = 10;
    const BRICK_H = 22, BRICK_GAP = 6;
    const BRICK_W = (W - 2 * MARGIN - (COLS - 1) * BRICK_GAP) / COLS;
    const BRICK_TOP = HUD_H + 56;
    const PADDLE_H = 12, PADDLE_Y = H - 36;
    const PADDLE_SPEED = 720;                // keyboard speed, px/s
    const BALL_R = 7;
    const START_LIVES = 3;
    const BEST_KEY = 'brickBreakerBest';
    const FONT = '"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';
    const ROW_COLORS = ['#ff6b6b', '#ff9f43', '#feca57', '#1dd1a1', '#54a0ff', '#a29bfe'];

    // Level maps: '1' = brick (1 hit), '2' = silver (2 hits), 'S' = steel (indestructible), '.' = empty
    const LEVELS = [
      {
        name: 'Level 1',
        speed: 340,                          // starting ball speed in px/s
        paddleW: 120,
        map: [
          '1111111111',
          '1111111111',
          '.11111111.',
          '..111111..',
          '...1111...',
          '....11....',
        ],
      },
      {
        name: 'Level 2',
        speed: 400,
        paddleW: 100,
        map: [
          'S..SSSS..S',
          '2222222222',
          '2211111122',
          '2211111122',
          '2222222222',
          '..11..11..',
        ],
      },
    ];

    // ---------- Canvas ----------
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);      // sharp on high-DPI screens
    canvas.height = Math.round(H * dpr);

    // ---------- State ----------
    const paddle = { x: 0, y: PADDLE_Y, w: LEVELS[0].paddleW, h: PADDLE_H };
    const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: LEVELS[0].speed };
    let state = 'title';                     // title | serve | play | paused | levelClear | gameOver | win
    let stateTime = performance.now();
    let level = 0;
    let score = 0;
    let lives = START_LIVES;
    let best = loadBest();
    let newRecord = false;
    let bricks = [];
    let particles = [];
    let popups = [];
    let leftHeld = false, rightHeld = false;
    let muted = false;
    let audioCtx = null;

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const ready = () => performance.now() - stateTime > 500;   // ignore accidental double-presses
    function setState(next) {
      state = next;
      stateTime = performance.now();
    }

    // ---------- Best score ----------
    function loadBest() {
      try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; }
    }
    function saveBest() {
      if (score > best) { best = score; newRecord = true; }
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* storage may be blocked */ }
    }

    // ---------- Game flow ----------
    function startGame() {
      score = 0;
      lives = START_LIVES;
      newRecord = false;
      loadLevel(0);
    }

    function loadLevel(index) {
      level = index;
      const cfg = LEVELS[level];
      bricks = buildBricks(cfg.map);
      paddle.w = cfg.paddleW;
      paddle.x = (W - paddle.w) / 2;
      particles = [];
      popups = [];
      serveBall();
      setState('serve');
    }

    function buildBricks(map) {
      const list = [];
      map.forEach((row, r) => {
        for (let c = 0; c < COLS; c++) {
          const ch = row[c];
          if (!ch || ch === '.') continue;
          const b = {
            x: MARGIN + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            alive: true,
          };
          if (ch === 'S') {
            Object.assign(b, { type: 'steel', hp: Infinity, points: 0, color: '#636e72' });
          } else if (ch === '2') {
            Object.assign(b, { type: 'silver', hp: 2, points: 25, color: '#dfe6e9' });
          } else {
            Object.assign(b, { type: 'normal', hp: 1, points: 10, color: ROW_COLORS[r % ROW_COLORS.length] });
          }
          list.push(b);
        }
      });
      return list;
    }

    function placeBallOnPaddle() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = PADDLE_Y - BALL_R;
    }

    function serveBall() {
      ball.speed = LEVELS[level].speed;
      ball.vx = 0;
      ball.vy = 0;
      placeBallOnPaddle();
    }

    function launch() {
      const angle = (Math.random() - 0.5) * 0.8;   // up to ±23° from vertical
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      setState('play');
    }

    function togglePause() {
      if (state === 'play') setState('paused');
      else if (state === 'paused') setState('play');
    }

    // Space / Enter / click: the main action for whatever screen is showing
    function primaryAction() {
      switch (state) {
        case 'title': startGame(); break;
        case 'serve': launch(); break;
        case 'paused': togglePause(); break;
        case 'levelClear': if (ready()) loadLevel(level + 1); break;
        case 'gameOver':
        case 'win': if (ready()) startGame(); break;
      }
    }

    function levelCleared() {
      saveBest();
      const last = level + 1 >= LEVELS.length;
      const tune = last ? [523, 659, 784, 1046] : [523, 659, 784];
      tune.forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.05), i * 110));
      setState(last ? 'win' : 'levelClear');
    }

    function loseLife() {
      lives--;
      beep(160, 0.4, 'sawtooth', 0.05);
      if (lives > 0) {
        serveBall();
        setState('serve');
      } else {
        saveBest();
        setState('gameOver');
      }
    }

    // ---------- Update ----------
    function update(dt) {
      if (state === 'paused') return;

      // Keyboard steering (the mouse sets the paddle position directly)
      const dir = (rightHeld ? 1 : 0) - (leftHeld ? 1 : 0);
      paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);

      if (state === 'title' || state === 'serve') {
        placeBallOnPaddle();
      } else if (state === 'play') {
        moveBall(dt);
      }
      updateEffects(dt);
    }

    function moveBall(dt) {
      // Move in small sub-steps so the ball can never tunnel through a brick
      const steps = Math.max(1, Math.ceil(ball.speed * dt / 2.5));
      const sdt = dt / steps;
      for (let i = 0; i < steps && state === 'play'; i++) {
        ball.x += ball.vx * sdt;
        ball.y += ball.vy * sdt;
        bounceWalls();
        bouncePaddle();
        bounceBricks();
        if (ball.y > H + BALL_R) loseLife();
      }
    }

    function bounceWalls() {
      let hit = false;
      if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); hit = true; }
      if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); hit = true; }
      if (ball.y - BALL_R < HUD_H) { ball.y = HUD_H + BALL_R; ball.vy = Math.abs(ball.vy); hit = true; }
      if (hit) keepMoving();
    }

    // Stop the ball from getting stuck in a nearly horizontal path
    function keepMoving() {
      const minVy = ball.speed * 0.25;
      if (Math.abs(ball.vy) < minVy) {
        const sy = ball.vy < 0 ? -1 : 1;
        const sx = ball.vx < 0 ? -1 : 1;
        ball.vy = sy * minVy;
        ball.vx = sx * Math.sqrt(ball.speed * ball.speed - minVy * minVy);
      }
    }

    function bouncePaddle() {
      if (ball.vy <= 0) return;                                         // only when coming down
      if (ball.y + BALL_R < paddle.y || ball.y - BALL_R > paddle.y + paddle.h) return;
      if (ball.x < paddle.x - BALL_R || ball.x > paddle.x + paddle.w + BALL_R) return;
      // Hitting near the edges sends the ball off at a sharper angle
      const t = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
      const angle = t * 0.9 * Math.PI / 3;                             // up to ~54° from vertical
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - BALL_R;
      beep(330 + 40 * t, 0.06);
    }

    function bounceBricks() {
      for (const b of bricks) {
        if (!b.alive) continue;
        // Closest point on this brick to the ball's centre
        const cx = clamp(ball.x, b.x, b.x + b.w);
        const cy = clamp(ball.y, b.y, b.y + b.h);
        const dx = ball.x - cx, dy = ball.y - cy;
        const d2 = dx * dx + dy * dy;
        if (d2 >= BALL_R * BALL_R) continue;

        let nx, ny;                                                     // collision normal
        if (d2 > 0) {
          const d = Math.sqrt(d2);
          nx = dx / d;
          ny = dy / d;
          ball.x = cx + nx * BALL_R;                                    // push out of the brick
          ball.y = cy + ny * BALL_R;
        } else {
          // Centre is inside the brick: leave through the nearest side
          const m = Math.min(ball.x - b.x, b.x + b.w - ball.x, ball.y - b.y, b.y + b.h - ball.y);
          if (m === ball.x - b.x)          { nx = -1; ny = 0;  ball.x = b.x - BALL_R; }
          else if (m === b.x + b.w - ball.x) { nx = 1;  ny = 0;  ball.x = b.x + b.w + BALL_R; }
          else if (m === ball.y - b.y)     { nx = 0;  ny = -1; ball.y = b.y - BALL_R; }
          else                             { nx = 0;  ny = 1;  ball.y = b.y + b.h + BALL_R; }
        }

        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {                                                  // reflect only when moving into the brick
          ball.vx -= 2 * dot * nx;
          ball.vy -= 2 * dot * ny;
        }
        keepMoving();
        hitBrick(b);
        return;                                                         // one brick per sub-step
      }
    }

    function hitBrick(b) {
      if (b.type === 'steel') { beep(180, 0.05, 'square', 0.03); return; }
      b.hp--;
      if (b.hp > 0) { beep(440, 0.05, 'square', 0.04); return; }        // silver brick cracked

      b.alive = false;
      score += b.points;
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      popups.push({ x: cx, y: cy, text: `+${b.points}`, life: 0.7, ttl: 0.7 });
      spawnBurst(cx, cy, b.color);
      beep(600 + Math.random() * 300, 0.07, 'triangle', 0.05);
      speedUp();
      if (!bricks.some(o => o.alive && o.type !== 'steel')) levelCleared();
    }

    // The ball gets a little faster with every brick, up to a cap
    function speedUp() {
      const next = Math.min(LEVELS[level].speed * 1.4, ball.speed * 1.006);
      const f = next / ball.speed;
      ball.vx *= f;
      ball.vy *= f;
      ball.speed = next;
    }

    // ---------- Effects ----------
    function spawnBurst(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 60 + Math.random() * 200;
        const ttl = 0.5 + Math.random() * 0.4;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: ttl, ttl, color, size: 3 + Math.random() * 3 });
      }
    }

    function updateEffects(dt) {
      for (const p of particles) {
        p.life -= dt;
        p.vy += 700 * dt;                                               // gravity
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      particles = particles.filter(p => p.life > 0);
      for (const q of popups) {
        q.life -= dt;
        q.y -= 40 * dt;
      }
      popups = popups.filter(q => q.life > 0);
    }

    // ---------- Input ----------
    function pointerX(e) {
      const r = canvas.getBoundingClientRect();
      return (e.clientX - r.left) * (W / r.width);
    }
    function movePaddleTo(e) {
      paddle.x = clamp(pointerX(e) - paddle.w / 2, 0, W - paddle.w);
    }

    window.addEventListener('pointermove', (e) => {
      if (state !== 'paused') movePaddleTo(e);
    });
    window.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      movePaddleTo(e);
      primaryAction();
    });

    window.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'ArrowLeft':  case 'KeyA': leftHeld = true; break;
        case 'ArrowRight': case 'KeyD': rightHeld = true; break;
        case 'Space': case 'ArrowUp': case 'Enter': case 'NumpadEnter':
          if (!e.repeat) primaryAction();
          break;
        case 'KeyP': case 'Escape':
          if (!e.repeat) togglePause();
          break;
        case 'KeyM':
          if (!e.repeat) muted = !muted;
          break;
        default:
          return;                                                       // leave every other key alone
      }
      e.preventDefault();                                               // stops arrows/space from scrolling
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftHeld = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rightHeld = false;
    });

    // Pause automatically when the player switches away from the game
    const autoPause = () => { if (state === 'play') setState('paused'); };
    window.addEventListener('blur', () => { leftHeld = rightHeld = false; autoPause(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

    // ---------- Sound (tiny synth, no audio files) ----------
    function beep(freq, dur, type = 'square', vol = 0.04) {
      if (muted) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur);
      } catch (err) {
        // Audio is optional; the game works without it
      }
    }

    // ---------- Drawing ----------
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function render() {
      ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0f1b2d');
      bg.addColorStop(1, '#1a2740');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      drawHud();
      drawBricks();
      drawParticles();
      drawPopups();
      drawPaddle();
      drawBall();
      drawOverlay();
    }

    function hudItem(x, label, value) {
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.font = `600 10px ${FONT}`;
      ctx.fillStyle = '#7f8fa6';
      ctx.fillText(label, x, 15);
      ctx.font = `bold 18px ${FONT}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(value, x, 36);
    }

    function drawHud() {
      ctx.fillStyle = '#060c18';
      ctx.fillRect(0, 0, W, HUD_H);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.fillRect(0, HUD_H - 1, W, 1);

      hudItem(20, 'SCORE', String(score).padStart(5, '0'));
      hudItem(200, 'LEVEL', `${level + 1} / ${LEVELS.length}`);
      hudItem(330, 'BEST', String(Math.max(best, score)).padStart(5, '0'));

      // Lives: one filled dot per life left
      ctx.textAlign = 'right';
      ctx.textBaseline = 'alphabetic';
      ctx.font = `600 10px ${FONT}`;
      ctx.fillStyle = '#7f8fa6';
      ctx.fillText('LIVES', W - 20, 15);
      for (let i = 0; i < START_LIVES; i++) {
        const x = W - 26 - (START_LIVES - 1 - i) * 22;
        ctx.beginPath();
        ctx.arc(x, 28, 6, 0, Math.PI * 2);
        if (i < lives) {
          ctx.fillStyle = '#ff6b6b';
          ctx.fill();
        } else {
          ctx.strokeStyle = '#3d4b63';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
    }

    function drawBricks() {
      for (const b of bricks) {
        if (!b.alive) continue;
        if (b.type === 'steel') {
          roundRect(b.x, b.y, b.w, b.h, 3);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.save();
          ctx.clip();                                                   // hatching stays inside the brick
          ctx.beginPath();
          for (let x = b.x - b.h; x < b.x + b.w; x += 9) {
            ctx.moveTo(x, b.y + b.h);
            ctx.lineTo(x + b.h, b.y);
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
          continue;
        }
        roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';                     // top highlight
        ctx.fillRect(b.x + 4, b.y + 2, b.w - 8, 3);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';                           // bottom shade
        ctx.fillRect(b.x + 4, b.y + b.h - 4, b.w - 8, 2);
        if (b.type === 'silver' && b.hp === 1) {                        // damaged silver brick
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.3, b.y);
          ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
          ctx.lineTo(b.x + b.w * 0.38, b.y + b.h);
          ctx.stroke();
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.ttl);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawPopups() {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold 14px ${FONT}`;
      ctx.fillStyle = '#ffffff';
      for (const q of popups) {
        ctx.globalAlpha = Math.max(0, q.life / q.ttl);
        ctx.fillText(q.text, q.x, q.y);
      }
      ctx.globalAlpha = 1;
    }

    function drawPaddle() {
      const g = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
      g.addColorStop(0, '#74b9ff');
      g.addColorStop(1, '#a29bfe');
      ctx.save();
      ctx.shadowColor = 'rgba(116, 185, 255, 0.8)';
      ctx.shadowBlur = 14;
      roundRect(paddle.x, paddle.y, paddle.w, paddle.h, paddle.h / 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }

    function drawBall() {
      ctx.save();
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    function overlayText() {
      switch (state) {
        case 'title':
          return {
            title: 'BRICK BREAKER',
            lines: [
              'Move: mouse, or ← → / A D',
              'Launch: click, or Space / ↑',
              'Pause: P or Esc      Mute: M',
              `${START_LIVES} lives  ·  ${LEVELS.length} levels`,
            ],
            hint: 'Click or press Space / Enter to start',
          };
        case 'paused':
          return { title: 'PAUSED', lines: [], hint: 'Press P or Esc to resume' };
        case 'levelClear':
          return {
            title: `${LEVELS[level].name} CLEARED!`,
            lines: [`Score: ${score}`],
            hint: `Click or press Space / Enter for ${LEVELS[level + 1].name}`,
          };
        case 'gameOver':
          return {
            title: 'GAME OVER',
            lines: [`Final score: ${score}`, newRecord ? 'New best score!' : `Best: ${best}`],
            hint: 'Click or press Enter to play again',
          };
        case 'win':
          return {
            title: 'YOU WIN!',
            lines: [`Final score: ${score}`, newRecord ? 'New best score!' : `Best: ${best}`],
            hint: 'Click or press Enter to play again',
          };
        default:
          return null;
      }
    }

    function drawOverlay() {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (state === 'serve') {
        ctx.font = `600 16px ${FONT}`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillText('Click or press Space to launch', W / 2, PADDLE_Y - 70);
        return;
      }
      const t = overlayText();
      if (!t) return;
      ctx.fillStyle = 'rgba(5, 10, 20, 0.7)';
      ctx.fillRect(0, HUD_H, W, H - HUD_H);
      ctx.font = `bold 52px ${FONT}`;
      ctx.fillStyle = '#ffd166';
      ctx.fillText(t.title, W / 2, 230);
      ctx.font = `20px ${FONT}`;
      ctx.fillStyle = '#e6ebf5';
      let y = 290;
      for (const line of t.lines) { ctx.fillText(line, W / 2, y); y += 30; }
      ctx.font = `bold 18px ${FONT}`;
      ctx.fillStyle = '#74b9ff';
      ctx.fillText(t.hint, W / 2, y + 30);
    }

    // ---------- Main loop ----------
    loadLevel(0);
    setState('title');

    let lastTime = performance.now();
    function frame(now) {
      // Clamp the step so a stalled tab can't make the ball jump
      const dt = clamp((now - lastTime) / 1000, 0, 1 / 30);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
