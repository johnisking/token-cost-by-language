<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #1e2656 0%, #070919 80%);
  }
  canvas {
    /* fill as much of the window as possible while keeping the 4:3 play field */
    width: min(96vw, 128vh);
    height: auto;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    box-shadow: 0 0 0 2px #2b3775, 0 24px 60px rgba(0, 0, 0, 0.6);
    touch-action: none;
    user-select: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  // ---- Constants -------------------------------------------------------
  const W = 800;
  const H = 600;
  const HUD_H = 44;                          // top score bar height
  const BALL_R = 8;
  const PADDLE_W = 120;
  const PADDLE_H = 14;
  const PADDLE_Y = H - 40;
  const PADDLE_SPEED = 620;                  // px/s when using the keyboard
  const MAX_BOUNCE = (60 * Math.PI) / 180;   // max deflection from vertical
  const MAX_LIVES = 3;
  const FLASH_TIME = 0.4;                    // red flash after losing a ball
  const LOCK_TIME = 0.8;                     // ignore input briefly after big transitions
  const FONT = '"Segoe UI", system-ui, -apple-system, sans-serif';
  const ROW_COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'];

  // '.' = empty, '1' / '2' / '3' = brick that takes that many hits to destroy
  const LEVELS = [
    {
      name: 'Level 1',
      subtitle: 'Warm up',
      speed: 360,
      map: [
        '11111111111',
        '11111111111',
        '11111111111',
        '11.11111.11',
        '.111111111.',
      ],
    },
    {
      name: 'Level 2',
      subtitle: 'Armored',
      speed: 440,
      map: [
        '33333333333',
        '32222222223',
        '21212121212',
        '23232323232',
        '...22222...',
        '...3.3.3...',
      ],
    },
  ];

  // ---- Setup -----------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ---- Game state ------------------------------------------------------
  // states: ready | playing | paused | levelClear | gameOver | win
  let state = 'ready';
  let levelIndex = 0;
  let score = 0;
  let lives = MAX_LIVES;
  let bricks = [];
  let bricksLeft = 0;
  let paddleX = (W - PADDLE_W) / 2;          // left edge of the paddle
  const ball = { x: 0, y: 0, vx: 0, vy: 0 };
  let particles = [];
  let flashTimer = 0;
  let lockTimer = 0;
  const keys = { left: false, right: false };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---- Level / flow ----------------------------------------------------
  function buildLevel(index) {
    const rows = LEVELS[index].map;
    const cols = Math.max(...rows.map((r) => r.length));
    const margin = 20;
    const gap = 6;
    const brickW = (W - margin * 2 - gap * (cols - 1)) / cols;
    const brickH = 22;
    bricks = [];
    rows.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        if (!/[1-9]/.test(row[c])) continue;
        const hp = Number(row[c]);
        bricks.push({
          x: margin + c * (brickW + gap),
          y: HUD_H + 28 + r * (brickH + gap),
          w: brickW,
          h: brickH,
          row: r,
          hp,
          maxHp: hp,
          alive: true,
        });
      }
    });
    bricksLeft = bricks.length;
  }

  function resetBall() {
    ball.x = paddleX + PADDLE_W / 2;
    ball.y = PADDLE_Y - BALL_R;
    ball.vx = 0;
    ball.vy = 0;
  }

  function startLevel(index) {
    levelIndex = index;
    buildLevel(index);
    paddleX = (W - PADDLE_W) / 2;
    particles = [];
    resetBall();
    state = 'ready';
  }

  function newGame() {
    score = 0;
    lives = MAX_LIVES;
    startLevel(0);
  }

  function launchBall() {
    resetBall();
    const speed = LEVELS[levelIndex].speed;
    const angle = (Math.random() * 2 - 1) * (Math.PI / 9);   // up to 20 degrees off vertical
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    state = 'playing';
  }

  function loseLife() {
    lives--;
    flashTimer = FLASH_TIME;
    resetBall();
    if (lives <= 0) {
      lives = 0;
      state = 'gameOver';
      lockTimer = LOCK_TIME;
    } else {
      state = 'ready';
    }
  }

  function clearLevel() {
    score += 100 * (levelIndex + 1);         // level bonus
    state = levelIndex === LEVELS.length - 1 ? 'win' : 'levelClear';
    lockTimer = LOCK_TIME;
  }

  function togglePause() {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }

  // Space or mouse click: does whatever the current screen is waiting for
  function primaryAction() {
    if (lockTimer > 0) return;
    switch (state) {
      case 'ready': launchBall(); break;
      case 'paused': state = 'playing'; break;
      case 'levelClear': startLevel(levelIndex + 1); break;
      case 'gameOver':
      case 'win': newGame(); break;
    }
  }

  // ---- Physics ---------------------------------------------------------
  // Reflects the ball off a rectangle if they overlap. Returns true on contact.
  function bounceOffRect(r) {
    const cx = clamp(ball.x, r.x, r.x + r.w);
    const cy = clamp(ball.y, r.y, r.y + r.h);
    let nx = ball.x - cx;
    let ny = ball.y - cy;
    let dist = Math.hypot(nx, ny);
    if (dist >= BALL_R) return false;

    if (dist < 1e-6) {
      // centre is already inside the rectangle: leave through the nearest side
      const exits = [
        [ball.x - r.x, -1, 0],
        [r.x + r.w - ball.x, 1, 0],
        [ball.y - r.y, 0, -1],
        [r.y + r.h - ball.y, 0, 1],
      ];
      const [, ex, ey] = exits.reduce((a, b) => (b[0] < a[0] ? b : a));
      nx = ex;
      ny = ey;
      dist = 0;
    } else {
      nx /= dist;
      ny /= dist;
    }

    const push = BALL_R - dist;
    ball.x += nx * push;
    ball.y += ny * push;

    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) {
      ball.vx -= 2 * dot * nx;
      ball.vy -= 2 * dot * ny;
    }
    return true;
  }

  // Stops the ball from settling into a flat, nearly horizontal path
  function enforceMinVertical() {
    const speed = LEVELS[levelIndex].speed;
    const minVy = speed * 0.2;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
      ball.vx = (ball.vx < 0 ? -1 : 1) * Math.sqrt(speed * speed - minVy * minVy);
    }
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      const life = 0.4 + Math.random() * 0.4;
      particles.push({
        x,
        y,
        color,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life,
        maxLife: life,
        size: 2 + Math.random() * 3,
      });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  // Advances the ball by a small time slice and handles every collision
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // side and top walls
    if (ball.x < BALL_R) {
      ball.x = BALL_R;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x > W - BALL_R) {
      ball.x = W - BALL_R;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y < HUD_H + BALL_R) {
      ball.y = HUD_H + BALL_R;
      ball.vy = Math.abs(ball.vy);
    }

    // ball fell past the paddle
    if (ball.y - BALL_R > H) {
      loseLife();
      return;
    }

    // paddle: deflection depends on where the ball hits it
    if (ball.vy > 0 && ball.y + BALL_R >= PADDLE_Y && ball.y < PADDLE_Y + PADDLE_H &&
        ball.x > paddleX - BALL_R && ball.x < paddleX + PADDLE_W + BALL_R) {
      const t = clamp((ball.x - paddleX) / PADDLE_W, 0, 1);   // 0 = left edge, 1 = right edge
      const angle = (t * 2 - 1) * MAX_BOUNCE;
      const speed = LEVELS[levelIndex].speed;
      ball.vx = speed * Math.sin(angle);
      ball.vy = -speed * Math.cos(angle);
      ball.y = PADDLE_Y - BALL_R;
      return;
    }

    // bricks
    for (const b of bricks) {
      if (!b.alive || !bounceOffRect(b)) continue;
      b.hp--;
      if (b.hp > 0) {
        score += 5;
        spawnParticles(ball.x, ball.y, brickColor(b), 4);
      } else {
        b.alive = false;
        bricksLeft--;
        score += 10 * b.maxHp;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, brickColor(b), 14);
      }
      if (bricksLeft === 0) clearLevel();
      else enforceMinVertical();
      return;
    }
  }

  function update(dt) {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    paddleX = clamp(paddleX + dir * PADDLE_SPEED * dt, 0, W - PADDLE_W);
    flashTimer = Math.max(0, flashTimer - dt);
    lockTimer = Math.max(0, lockTimer - dt);
    updateParticles(dt);

    if (state !== 'playing') {
      resetBall();                           // ball rides on the paddle until launched
      return;
    }

    // split long moves into small steps so the ball can't tunnel through bricks
    const steps = Math.ceil((LEVELS[levelIndex].speed * dt) / 3);
    for (let i = 0; i < steps && state === 'playing'; i++) {
      stepBall(dt / steps);
    }
  }

  // ---- Input -----------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;   // keep browser shortcuts (Ctrl+R etc.)
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      keys.left = true;
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      keys.right = true;
    } else if (['Space', 'KeyP', 'Escape', 'KeyR'].includes(e.code)) {
      if (!e.repeat) {
        if (e.code === 'Space') primaryAction();
        else if (e.code === 'KeyR') newGame();
        else togglePause();
      }
    } else {
      return;
    }
    e.preventDefault();
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  window.addEventListener('blur', () => {
    keys.left = false;
    keys.right = false;
    if (state === 'playing') state = 'paused';
  });

  function movePaddleToPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    paddleX = clamp(x - PADDLE_W / 2, 0, W - PADDLE_W);
  }

  window.addEventListener('pointermove', movePaddleToPointer);
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    movePaddleToPointer(e);
    primaryAction();
  });

  // ---- Rendering -------------------------------------------------------
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function brickColor(b) {
    if (b.maxHp >= 3) return '#8fa3c7';      // steel
    if (b.maxHp === 2) return '#f59f00';     // gold
    return ROW_COLORS[b.row % ROW_COLORS.length];
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#161d45');
    g.addColorStop(1, '#0a0c1f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = 'rgba(120, 140, 255, 0.5)';
    ctx.fillRect(0, HUD_H - 1, W, 1);

    ctx.textBaseline = 'middle';
    ctx.font = `bold 18px ${FONT}`;
    ctx.fillStyle = '#e8ecff';

    ctx.textAlign = 'left';
    ctx.fillText(`SCORE ${String(score).padStart(6, '0')}`, 20, HUD_H / 2);

    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${levelIndex + 1} / ${LEVELS.length}`, W / 2, HUD_H / 2);

    ctx.textAlign = 'right';
    ctx.fillText('LIVES', W - 84, HUD_H / 2);
    for (let i = 0; i < MAX_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 26 - i * 22, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? '#ffffff' : 'rgba(255, 255, 255, 0.15)';
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = brickColor(b);
      rrect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';   // top highlight
      rrect(b.x + 2, b.y + 2, b.w - 4, 5, 2);
      ctx.fill();

      // cracks show how many hits have already landed
      const cracks = b.maxHp - b.hp;
      if (cracks > 0) {
        ctx.strokeStyle = 'rgba(20, 20, 40, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < cracks; i++) {
          const x0 = b.x + b.w * (0.25 + i * 0.3);
          ctx.moveTo(x0, b.y + 2);
          ctx.lineTo(x0 + 6, b.y + b.h * 0.5);
          ctx.lineTo(x0 - 3, b.y + b.h - 2);
        }
        ctx.stroke();
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    g.addColorStop(0, '#f1f5ff');
    g.addColorStop(1, '#6f83d1');
    ctx.fillStyle = g;
    rrect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, PADDLE_H / 2);
    ctx.fill();
  }

  function drawBall() {
    ctx.save();
    ctx.shadowColor = '#9fd8ff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawPanel(title, lines) {
    const pw = 460;
    const ph = 160;
    const px = (W - pw) / 2;
    const py = 230;
    ctx.fillStyle = 'rgba(5, 7, 22, 0.88)';
    rrect(px, py, pw, ph, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 140, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold 34px ${FONT}`;
    ctx.fillText(title, W / 2, py + 44);
    ctx.font = `17px ${FONT}`;
    ctx.fillStyle = '#c3cdff';
    lines.forEach((line, i) => ctx.fillText(line, W / 2, py + 96 + i * 26));
  }

  function drawOverlay() {
    const L = LEVELS[levelIndex];
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(5, 7, 22, 0.55)';
      ctx.fillRect(0, 0, W, H);
      drawPanel('PAUSED', ['Press P or Esc to resume']);
    } else if (state === 'ready') {
      drawPanel(`${L.name} · ${L.subtitle}`, [
        'Click or press Space to launch',
        'Mouse or ← → / A D to move · P to pause',
      ]);
    } else if (state === 'levelClear') {
      drawPanel('LEVEL CLEAR!', [
        `Bonus +${100 * (levelIndex + 1)}`,
        'Click or press Space for the next level',
      ]);
    } else if (state === 'gameOver') {
      drawPanel('GAME OVER', [`Final score: ${score}`, 'Click, Space or R to play again']);
    } else if (state === 'win') {
      drawPanel('YOU WIN!', [`Final score: ${score}`, 'Click, Space or R to play again']);
    }
  }

  function render() {
    drawBackground();
    drawBricks();
    drawPaddle();
    drawParticles();
    drawBall();
    drawHUD();
    if (flashTimer > 0) {
      ctx.fillStyle = `rgba(255, 60, 60, ${(0.35 * flashTimer) / FLASH_TIME})`;
      ctx.fillRect(0, 0, W, H);
    }
    drawOverlay();
  }

  // ---- Main loop -------------------------------------------------------
  let lastTime = performance.now();
  function frame(now) {
    const dt = clamp((now - lastTime) / 1000, 0, 1 / 30);   // don't jump after a stalled tab
    lastTime = now;
    if (state !== 'paused') update(dt);
    render();
    requestAnimationFrame(frame);
  }

  newGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
