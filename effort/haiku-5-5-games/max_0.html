<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #16224f 0%, #050814 75%);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(90, 130, 255, 0.35);
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      // Logical playfield size; the canvas is scaled to fit the window
      const W = 800;
      const H = 600;
      const HUD_H = 44;              // score bar height at the top
      const LIVES_START = 3;
      const PADDLE_KEY_SPEED = 700;  // px/s with the arrow keys or A/D
      const FONT = '"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';
      const ROW_COLORS = ['#ff6b6b', '#feca57', '#1dd1a1', '#48dbfb', '#5f7cff', '#c77dff', '#ff9ff3', '#ff9f43'];
      const BRICK_MARGIN = 30;
      const BRICK_GAP = 4;
      const BRICK_H = 22;
      const BRICK_TOP = HUD_H + 40;
      const PAUSE_BTN = { x: W - 46, y: 9, w: 30, h: 26 };

      // Brick layouts: '0' = empty, '1' = normal brick (1 hit), '2' = tough brick (2 hits)
      const LEVELS = [
        {
          name: 'Level 1',
          subtitle: 'The Pyramid',
          paddleW: 120,
          ballSpeed: 380,
          layout: [
            '111111111111',
            '011111111110',
            '001111111100',
            '000111111000',
            '000011110000',
          ],
        },
        {
          name: 'Level 2',
          subtitle: 'Armored Core',
          paddleW: 96,
          ballSpeed: 470,
          layout: [
            '111111111111',
            '122222222221',
            '121111111121',
            '121111111121',
            '122222222221',
            '111111111111',
          ],
        },
      ];

      // ---------- Game state ----------
      let state = 'title';   // title | ready | playing | paused | levelClear | gameOver | win
      let stateTime = 0;     // seconds spent in the current state
      let pausedFrom = 'playing';
      let levelIndex = 0;
      let score = 0;
      let lives = LIVES_START;
      let bricks = [];
      let particles = [];
      let message = '';
      let messageTimer = 0;
      let muted = false;
      const keys = { left: false, right: false };

      const paddle = { x: 0, y: H - 44, w: 120, h: 14 };
      const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };

      // ---------- Helpers ----------
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const inside = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // Simple synthesized sound effects; silently skipped if Web Audio is unavailable
      let audioCtx = null;
      function tone(freq, dur, type = 'square', vol = 0.06) {
        if (muted) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + dur);
        } catch (err) {
          // No audio support: the game still runs
        }
      }

      function fanfare() {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'triangle', 0.1), i * 120));
      }

      // ---------- Levels & bricks ----------
      function buildBricks(layout) {
        const cols = layout[0].length;
        const w = (W - 2 * BRICK_MARGIN - (cols - 1) * BRICK_GAP) / cols;
        const list = [];
        layout.forEach((row, r) => {
          for (let c = 0; c < cols; c++) {
            const hp = Number(row[c]);
            if (hp === 0) continue;
            list.push({
              x: BRICK_MARGIN + c * (w + BRICK_GAP),
              y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
              w,
              h: BRICK_H,
              hp,
              maxHp: hp,
              row: r,
              alive: true,
            });
          }
        });
        return list;
      }

      function brickColor(b) {
        if (b.maxHp > 1) return b.hp > 1 ? '#cfd8e6' : '#7d8aa3';   // tough bricks: silver, darker once cracked
        return ROW_COLORS[b.row % ROW_COLORS.length];
      }

      function resetBall() {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 1;
        ball.vx = 0;
        ball.vy = 0;
      }

      function setupLevel(index) {
        levelIndex = index;
        const level = LEVELS[index];
        paddle.w = level.paddleW;
        paddle.x = (W - paddle.w) / 2;
        bricks = buildBricks(level.layout);
        particles = [];
        resetBall();
      }

      // ---------- Flow control ----------
      function setState(next) {
        state = next;
        stateTime = 0;
      }

      function showMessage(text, seconds) {
        message = text;
        messageTimer = seconds;
      }

      function beginLevel(index) {
        setupLevel(index);
        setState('ready');
        showMessage(`${LEVELS[index].name}: ${LEVELS[index].subtitle}`, 2.5);
      }

      function startNewGame() {
        score = 0;
        lives = LIVES_START;
        beginLevel(0);
      }

      function launchBall() {
        const speed = LEVELS[levelIndex].ballSpeed;
        const angle = (Math.random() * 2 - 1) * 0.3;   // slightly random launch direction
        ball.vx = Math.sin(angle) * speed;
        ball.vy = -Math.cos(angle) * speed;
        setState('playing');
        tone(520, 0.08);
      }

      function loseLife() {
        lives--;
        tone(160, 0.45, 'sawtooth', 0.07);
        resetBall();
        if (lives <= 0) {
          setState('gameOver');
        } else {
          setState('ready');
          showMessage(lives === 1 ? 'Last life!' : `${lives} lives left`, 1.5);
        }
      }

      function levelComplete() {
        resetBall();
        fanfare();
        setState(levelIndex === LEVELS.length - 1 ? 'win' : 'levelClear');
      }

      function togglePause() {
        if (state === 'playing' || state === 'ready') {
          pausedFrom = state;
          setState('paused');
        } else if (state === 'paused') {
          setState(pausedFrom);
        }
      }

      function pauseIfActive() {
        if (state === 'playing' || state === 'ready') togglePause();
      }

      // Space / Enter / click: the main action for whatever screen is showing
      function primaryAction() {
        // Ignore the first instant of end-of-level / game-over screens so a stray click can't skip them
        if ((state === 'levelClear' || state === 'gameOver' || state === 'win') && stateTime < 0.6) return;
        switch (state) {
          case 'title':
          case 'gameOver':
          case 'win':
            startNewGame();
            break;
          case 'ready':
            launchBall();
            break;
          case 'paused':
            togglePause();
            break;
          case 'levelClear':
            beginLevel(levelIndex + 1);
            break;
        }
      }

      // ---------- Physics ----------
      function bounceOffPaddle() {
        const speed = LEVELS[levelIndex].ballSpeed;
        // Where the ball lands decides the angle: centre = straight up, edges = 60 degrees sideways
        const offset = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
        const angle = offset * (Math.PI / 3);
        ball.vx = Math.sin(angle) * speed;
        ball.vy = -Math.cos(angle) * speed;
        ball.y = paddle.y - ball.r;
        tone(330, 0.06, 'triangle', 0.1);
      }

      function collideWalls() {
        if (ball.x - ball.r < 0) {
          ball.x = ball.r;
          ball.vx = Math.abs(ball.vx);
        } else if (ball.x + ball.r > W) {
          ball.x = W - ball.r;
          ball.vx = -Math.abs(ball.vx);
        }
        if (ball.y - ball.r < HUD_H) {
          ball.y = HUD_H + ball.r;
          ball.vy = Math.abs(ball.vy);
        }
      }

      function collidePaddle() {
        if (ball.vy <= 0) return;   // only when coming down onto it
        const cx = clamp(ball.x, paddle.x, paddle.x + paddle.w);
        const cy = clamp(ball.y, paddle.y, paddle.y + paddle.h);
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        if (dx * dx + dy * dy < ball.r * ball.r) bounceOffPaddle();
      }

      function collideBricks() {
        for (const b of bricks) {
          if (!b.alive) continue;
          // Closest point on the brick to the ball's centre
          const cx = clamp(ball.x, b.x, b.x + b.w);
          const cy = clamp(ball.y, b.y, b.y + b.h);
          const dx = ball.x - cx;
          const dy = ball.y - cy;
          const dist2 = dx * dx + dy * dy;
          if (dist2 >= ball.r * ball.r) continue;

          let nx = 0;
          let ny = 0;
          let depth;
          if (dist2 > 0) {
            const dist = Math.sqrt(dist2);
            nx = dx / dist;
            ny = dy / dist;
            depth = ball.r - dist;
          } else {
            // Centre is inside the brick (rare): push out through the nearest side
            const left = ball.x - b.x;
            const right = b.x + b.w - ball.x;
            const top = ball.y - b.y;
            const bottom = b.y + b.h - ball.y;
            const m = Math.min(left, right, top, bottom);
            if (m === left) nx = -1;
            else if (m === right) nx = 1;
            else if (m === top) ny = -1;
            else ny = 1;
            depth = m + ball.r;
          }
          ball.x += nx * depth;   // push the ball out so it just touches the brick
          ball.y += ny * depth;

          const dot = ball.vx * nx + ball.vy * ny;
          if (dot < 0) {          // only bounce if the ball is moving into the brick
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            hitBrick(b);
            return;               // one brick per sub-step
          }
        }
      }

      function hitBrick(b) {
        if (b.hp > 1) {           // tough brick: cracks but survives
          b.hp--;
          score += 5;
          spawnParticles(ball.x, ball.y, '#ffffff', 4);
          tone(180, 0.07, 'square', 0.06);
          return;
        }
        b.alive = false;
        score += 10 * b.maxHp;
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, brickColor(b), 14);
        tone(400 + Math.random() * 300, 0.06);
        if (!bricks.some(o => o.alive)) levelComplete();
      }

      // Stops the ball from getting stuck bouncing almost horizontally
      function keepBallMoving() {
        const speed = LEVELS[levelIndex].ballSpeed;
        const minVy = speed * 0.2;
        if (Math.abs(ball.vy) < minVy) {
          ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
          ball.vx = (ball.vx < 0 ? -1 : 1) * Math.sqrt(speed * speed - minVy * minVy);
        }
      }

      function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 60 + Math.random() * 160;
          particles.push({
            x,
            y,
            color,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            age: 0,
            life: 0.4 + Math.random() * 0.4,
          });
        }
      }

      function updateParticles(dt) {
        for (const p of particles) {
          p.age += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 400 * dt;   // gravity
        }
        particles = particles.filter(p => p.age < p.life);
      }

      function update(dt) {
        if (state === 'paused') return;
        stateTime += dt;
        if (messageTimer > 0) messageTimer -= dt;
        updateParticles(dt);

        // Keyboard movement (the mouse takes over whenever it moves)
        const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (dir !== 0) paddle.x = clamp(paddle.x + dir * PADDLE_KEY_SPEED * dt, 0, W - paddle.w);

        if (state === 'ready') {
          resetBall();      // the ball rides on the paddle until launched
          return;
        }
        if (state !== 'playing') return;

        // Move in small sub-steps so the ball can never tunnel through a brick or the paddle
        const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 3));
        const h = dt / steps;
        for (let i = 0; i < steps && state === 'playing'; i++) {
          ball.x += ball.vx * h;
          ball.y += ball.vy * h;
          collideWalls();
          collidePaddle();
          collideBricks();
          if (state !== 'playing') break;   // level was just cleared
          keepBallMoving();
          if (ball.y - ball.r > H) loseLife();
        }
      }

      // ---------- Rendering ----------
      function drawBackground() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#0e1638');
        g.addColorStop(1, '#070b1c');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function drawBricks() {
        for (const b of bricks) {
          if (!b.alive) continue;
          roundRect(b.x, b.y, b.w, b.h, 4);
          ctx.fillStyle = brickColor(b);
          ctx.fill();
          roundRect(b.x + 3, b.y + 2, b.w - 6, 6, 3);   // glossy highlight
          ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
          ctx.fill();
          if (b.maxHp > 1 && b.hp < b.maxHp) {           // crack on a damaged tough brick
            ctx.strokeStyle = 'rgba(20, 25, 45, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(b.x + b.w * 0.45, b.y + 3);
            ctx.lineTo(b.x + b.w * 0.55, b.y + b.h * 0.5);
            ctx.lineTo(b.x + b.w * 0.48, b.y + b.h - 3);
            ctx.stroke();
          }
        }
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.globalAlpha = 1 - p.age / p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;
      }

      function drawPaddle() {
        const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
        g.addColorStop(0, '#a8cbff');
        g.addColorStop(1, '#3d64ff');
        roundRect(paddle.x, paddle.y, paddle.w, paddle.h, paddle.h / 2);
        ctx.fillStyle = g;
        ctx.fill();
      }

      function drawBall() {
        ctx.save();
        ctx.shadowColor = '#7fdcff';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawHeart(cx, cy, s, color) {
        const t = s / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy + t * 0.9);
        ctx.bezierCurveTo(cx - t * 1.2, cy + t * 0.1, cx - t * 0.6, cy - t, cx, cy - t * 0.35);
        ctx.bezierCurveTo(cx + t * 0.6, cy - t, cx + t * 1.2, cy + t * 0.1, cx, cy + t * 0.9);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function drawHud() {
        ctx.fillStyle = '#0c1330';
        ctx.fillRect(0, 0, W, HUD_H);
        ctx.fillStyle = 'rgba(120, 150, 255, 0.4)';
        ctx.fillRect(0, HUD_H - 1, W, 1);

        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.font = `bold 18px ${FONT}`;
        ctx.fillStyle = '#ffd166';
        ctx.fillText(`SCORE ${String(score).padStart(6, '0')}`, 16, HUD_H / 2);

        ctx.textAlign = 'center';
        ctx.font = `600 16px ${FONT}`;
        ctx.fillStyle = '#9db4e6';
        ctx.fillText(`Level ${levelIndex + 1} of ${LEVELS.length}`, W / 2, HUD_H / 2);

        for (let i = 0; i < LIVES_START; i++) {
          drawHeart(W - 170 + i * 26, HUD_H / 2, 18, i < lives ? '#ff5d73' : '#2a3358');
        }

        // Pause / resume button, so the mouse can pause too
        const { x, y, w, h } = PAUSE_BTN;
        roundRect(x, y, w, h, 6);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fill();
        ctx.fillStyle = '#e6ecff';
        if (state === 'paused') {
          ctx.beginPath();
          ctx.moveTo(x + 11, y + 6);
          ctx.lineTo(x + 11, y + h - 6);
          ctx.lineTo(x + 21, y + h / 2);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(x + 9, y + 6, 4, h - 12);
          ctx.fillRect(x + 17, y + 6, 4, h - 12);
        }
      }

      function drawOverlay(title, lines) {
        ctx.fillStyle = 'rgba(5, 8, 20, 0.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold 46px ${FONT}`;
        ctx.fillText(title, W / 2, H / 2 - 80);
        ctx.font = `18px ${FONT}`;
        ctx.fillStyle = '#aebbd9';
        lines.forEach((line, i) => ctx.fillText(line, W / 2, H / 2 - 20 + i * 30));
      }

      function render() {
        drawBackground();
        drawBricks();
        drawParticles();
        drawPaddle();
        drawBall();
        drawHud();

        if (messageTimer > 0) {
          ctx.globalAlpha = Math.min(1, messageTimer);
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold 24px ${FONT}`;
          ctx.fillText(message, W / 2, H / 2 - 80);
          ctx.globalAlpha = 1;
        }

        switch (state) {
          case 'title':
            drawOverlay('BRICK BREAKER', [
              'Mouse: move the paddle, click to launch',
              'Keyboard: Left/Right or A/D to move, Space to launch',
              'P or Esc to pause, M to mute',
              'Click or press Space to start',
            ]);
            break;
          case 'ready':
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `18px ${FONT}`;
            ctx.fillStyle = '#aebbd9';
            ctx.fillText('Click or press Space to launch', W / 2, 420);
            break;
          case 'paused':
            drawOverlay('PAUSED', ['Click, or press P or Esc, to resume']);
            break;
          case 'levelClear': {
            const next = LEVELS[levelIndex + 1];
            drawOverlay(`${LEVELS[levelIndex].name} cleared!`, [
              `Score: ${score}`,
              `Up next: ${next.name}, ${next.subtitle}`,
              'Click or press Space to continue',
            ]);
            break;
          }
          case 'gameOver':
            drawOverlay('GAME OVER', [`Final score: ${score}`, 'Click or press Enter to play again']);
            break;
          case 'win':
            drawOverlay('YOU WIN!', [`Final score: ${score}`, 'Click or press Enter to play again']);
            break;
        }
      }

      // ---------- Input ----------
      function toField(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (W / rect.width),
          y: (e.clientY - rect.top) * (H / rect.height),
        };
      }

      window.addEventListener('pointermove', (e) => {
        const p = toField(e);
        paddle.x = clamp(p.x - paddle.w / 2, 0, W - paddle.w);
        canvas.style.cursor = inside(p, PAUSE_BTN) ? 'pointer' : 'default';
      });

      window.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        const p = toField(e);
        const canPause = state === 'ready' || state === 'playing' || state === 'paused';
        if (canPause && inside(p, PAUSE_BTN)) togglePause();
        else primaryAction();
      });

      window.addEventListener('keydown', (e) => {
        switch (e.code) {
          case 'ArrowLeft':
          case 'KeyA':
            keys.left = true;
            break;
          case 'ArrowRight':
          case 'KeyD':
            keys.right = true;
            break;
          case 'Space':
          case 'Enter':
          case 'NumpadEnter':
            if (!e.repeat) primaryAction();
            break;
          case 'KeyP':
          case 'Escape':
            if (!e.repeat) togglePause();
            break;
          case 'KeyM':
            if (!e.repeat) {
              muted = !muted;
              showMessage(muted ? 'Sound off' : 'Sound on', 1.2);
            }
            break;
          default:
            return;             // leave other keys (F5, Ctrl+R, ...) alone
        }
        e.preventDefault();
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      });

      // Pause automatically if the player switches away from the game
      window.addEventListener('blur', () => {
        keys.left = false;
        keys.right = false;
        pauseIfActive();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) pauseIfActive();
      });

      // ---------- Setup & main loop ----------
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.96;
        canvas.style.width = `${Math.floor(W * scale)}px`;
        canvas.style.height = `${Math.floor(H * scale)}px`;
        canvas.width = Math.floor(W * scale * dpr);
        canvas.height = Math.floor(H * scale * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      }
      window.addEventListener('resize', resize);

      let lastTime = performance.now();
      function frame(now) {
        // Clamp the step so a stalled tab can't make the ball jump through things
        const dt = clamp((now - lastTime) / 1000, 0, 1 / 30);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      resize();
      setupLevel(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
