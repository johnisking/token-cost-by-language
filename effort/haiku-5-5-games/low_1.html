<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #hud {
    width: 800px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    margin-bottom: 8px;
  }
  canvas {
    background: #000;
    border: 2px solid #30363d;
    border-radius: 6px;
    max-width: 100%;
    height: auto;
  }
  #help {
    margin-top: 10px;
    color: #8b949e;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="hud">
  <span>Score: <b id="score">0</b></span>
  <span>Level: <b id="level">1</b></span>
  <span>Lives: <b id="lives">3</b></span>
</div>
<canvas id="c" width="800" height="600"></canvas>
<div id="help">Mouse or ← → / A D: move · Click or Space: launch / continue · P or Esc: pause · R: restart</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const livesEl = document.getElementById('lives');

// '0' = empty, '1' = one hit, '2' = two hits
const LEVELS = [
  {
    speed: 5.5,
    rows: [
      '1111111111',
      '1111111111',
      '1111111111',
      '0011111100',
      '0000110000'
    ]
  },
  {
    speed: 6.5,
    rows: [
      '2222222222',
      '2002222002',
      '1211111121',
      '1121111211',
      '1112222111',
      '0110000110'
    ]
  }
];

const COLS = 10;
const BRICK_H = 22;
const GAP = 6;
const BRICK_W = (W - 80 - (COLS - 1) * GAP) / COLS;
const BRICK_TOP = 60;

const paddle = { w: 110, h: 14, x: 0, y: H - 40 };
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 7 };

let state = 'ready';     // ready | play | paused | levelclear | gameover | win
let prevState = 'ready';
let levelIndex = 0;
let score = 0;
let lives = 3;
let bricks = [];
let speed = LEVELS[0].speed;
const keys = {};

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function loadLevel(i) {
  levelIndex = i;
  const level = LEVELS[i];
  speed = level.speed;
  bricks = [];
  level.rows.forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '0') return;
      bricks.push({
        x: 40 + c * (BRICK_W + GAP),
        y: BRICK_TOP + r * (BRICK_H + GAP),
        w: BRICK_W,
        h: BRICK_H,
        hp: Number(ch),
        maxHp: Number(ch),
        row: r,
        alive: true
      });
    });
  });
  paddle.x = (W - paddle.w) / 2;
  ball.vx = 0;
  ball.vy = 0;
  state = 'ready';
  resetBallToPaddle();
}

function resetBallToPaddle() {
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
}

function restart() {
  score = 0;
  lives = 3;
  loadLevel(0);
}

function launch() {
  const vx = (Math.random() < 0.5 ? -1 : 1) * speed * 0.35;
  ball.vx = vx;
  ball.vy = -Math.sqrt(speed * speed - vx * vx);
  state = 'play';
}

function loseLife() {
  lives--;
  if (lives <= 0) {
    state = 'gameover';
  } else {
    state = 'ready';
    ball.vx = 0;
    ball.vy = 0;
    resetBallToPaddle();
  }
}

function action() {
  if (state === 'ready') launch();
  else if (state === 'levelclear') loadLevel(levelIndex + 1);
  else if (state === 'gameover' || state === 'win') restart();
  else if (state === 'paused') state = prevState;
}

function togglePause() {
  if (state === 'play' || state === 'ready') {
    prevState = state;
    state = 'paused';
  } else if (state === 'paused') {
    state = prevState;
  }
}

function update() {
  // Keyboard paddle movement
  if (state !== 'paused') {
    if (keys.left) paddle.x -= 9;
    if (keys.right) paddle.x += 9;
    paddle.x = clamp(paddle.x, 0, W - paddle.w);
  }

  if (state === 'ready') {
    resetBallToPaddle();
    return;
  }
  if (state !== 'play') return;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Walls
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

  // Paddle
  if (ball.vy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.vy) + 1 &&
      ball.x >= paddle.x - ball.r &&
      ball.x <= paddle.x + paddle.w + ball.r) {
    const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
    const angle = rel * 1.1; // radians away from vertical
    ball.vx = speed * Math.sin(angle);
    ball.vy = -speed * Math.cos(angle);
    ball.y = paddle.y - ball.r;
  }

  // Missed the ball
  if (ball.y - ball.r > H) {
    loseLife();
    return;
  }

  // Bricks (one collision per frame)
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w ||
        ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;

    const overlapL = ball.x + ball.r - b.x;
    const overlapR = b.x + b.w - (ball.x - ball.r);
    const overlapT = ball.y + ball.r - b.y;
    const overlapB = b.y + b.h - (ball.y - ball.r);
    if (Math.min(overlapL, overlapR) < Math.min(overlapT, overlapB)) {
      ball.vx = -ball.vx;
    } else {
      ball.vy = -ball.vy;
    }

    b.hp--;
    if (b.hp <= 0) {
      b.alive = false;
      score += 10 * (levelIndex + 1);
    } else {
      score += 5;
    }
    break;
  }

  // Level finished?
  if (bricks.every(b => !b.alive)) {
    if (levelIndex + 1 < LEVELS.length) {
      state = 'levelclear';
      ball.vx = 0;
      ball.vy = 0;
    } else {
      state = 'win';
      ball.vx = 0;
      ball.vy = 0;
    }
  }
}

function brickColor(b) {
  if (b.hp === 2) return '#9aa4b2';
  return `hsl(${b.row * 40}, 75%, 55%)`;
}

function drawCenterText(lines) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, H / 2 - 60, W, 120);
  ctx.fillStyle = '#e6edf3';
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px Arial';
  ctx.fillText(lines[0], W / 2, H / 2 - 10);
  ctx.font = '18px Arial';
  ctx.fillText(lines[1], W / 2, H / 2 + 22);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = brickColor(b);
    ctx.fillRect(b.x, b.y, b.w, b.h);
    if (b.maxHp === 2 && b.hp === 2) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6);
    }
  }

  // Paddle
  ctx.fillStyle = '#58a6ff';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  // Overlays
  ctx.textAlign = 'center';
  if (state === 'ready') {
    drawCenterText(['Ready', 'Click or press Space to launch']);
  } else if (state === 'paused') {
    drawCenterText(['Paused', 'Press P or Esc to resume']);
  } else if (state === 'levelclear') {
    drawCenterText([`Level ${levelIndex + 1} cleared!`, 'Click or press Space for the next level']);
  } else if (state === 'gameover') {
    drawCenterText([`Game over — score ${score}`, 'Click or press R to restart']);
  } else if (state === 'win') {
    drawCenterText(['You win!', `Final score ${score} — click or press R to play again`]);
  }
}

function updateHud() {
  scoreEl.textContent = score;
  levelEl.textContent = levelIndex + 1;
  livesEl.textContent = lives;
}

// Mouse
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w);
});
canvas.addEventListener('click', () => action());

// Keyboard
const KEY_MAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right'
};
document.addEventListener('keydown', e => {
  if (KEY_MAP[e.code]) {
    keys[KEY_MAP[e.code]] = true;
    e.preventDefault();
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    action();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    togglePause();
  } else if (e.code === 'KeyR') {
    restart();
  }
});
document.addEventListener('keyup', e => {
  if (KEY_MAP[e.code]) keys[KEY_MAP[e.code]] = false;
});

function loop() {
  update();
  draw();
  updateHud();
  requestAnimationFrame(loop);
}

restart();
loop();
</script>
</body>
</html>
