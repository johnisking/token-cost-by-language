<!doctype html><html><head><meta charset="utf-8"><title>Expenses</title><link rel="stylesheet" href="styles.css"></head><body>
<h1>Expenses</h1>
<form id="f"><input id="date" type="date"><input id="description" placeholder="Description"><input id="amount" type="number" step="0.01"><input id="category" placeholder="Category"><button id="add" type="button">Add</button></form>
<p>Balance: <span id="balance">0.00</span></p>
<select id="filter"><option value="All">All</option></select>
<input id="import" type="file" accept=".csv"><button id="export" type="button">Export</button>
<table id="list"><thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Category</th><th></th></tr></thead><tbody></tbody></table>
<canvas id="chart" width="400" height="200"></canvas>
<script type="module" src="js/app.js"></script></body></html>
