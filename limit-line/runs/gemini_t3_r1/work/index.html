<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Expense Tracker</h1>
      <div class="summary-cards">
        <div class="card">
          <span class="label">Balance</span>
          <span class="value">$<span id="balance">0.00</span></span>
        </div>
        <div class="card">
          <span class="label">Income</span>
          <span class="value income">$<span id="income">0.00</span></span>
        </div>
        <div class="card">
          <span class="label">Expense</span>
          <span class="value expense">$<span id="expense">0.00</span></span>
        </div>
      </div>
    </header>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-grid">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" placeholder="YYYY-MM-DD">
          </div>
          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Description">
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" step="any" placeholder="e.g. -25.50 or 1000">
          </div>
          <div class="field">
            <label for="category">Category</label>
            <input type="text" id="category" placeholder="Category">
          </div>
        </div>
        <button type="submit" id="add">Add Transaction</button>
      </form>
    </section>

    <section class="panel controls-panel">
      <div class="filter-group">
        <label for="filter">Filter by Category:</label>
        <select id="filter">
          <option value="All">All</option>
        </select>
      </div>
      <div class="csv-group">
        <label for="import" class="file-label">
          Import CSV
          <input type="file" id="import" accept=".csv,text/csv">
        </label>
        <button type="button" id="export">Export CSV</button>
      </div>
    </section>

    <section class="panel">
      <h2>Transactions</h2>
      <div class="table-headers">
        <span>Date</span>
        <span>Description</span>
        <span>Category</span>
        <span>Amount</span>
        <span>Action</span>
      </div>
      <table id="list">
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Expenses by Category</h2>
      <canvas id="chart" width="600" height="300"></canvas>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
