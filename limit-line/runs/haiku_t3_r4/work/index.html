<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <section class="summary">
      <div>Balance: <strong id="balance">0.00</strong></div>
      <div>Income: <span id="income">0.00</span></div>
      <div>Expense: <span id="expense">0.00</span></div>
    </section>

    <form id="transaction-form" class="card">
      <h2>Add transaction</h2>
      <div class="fields">
        <label>Date
          <input type="date" id="date" required>
        </label>
        <label>Description
          <input type="text" id="description" required>
        </label>
        <label>Amount
          <input type="number" id="amount" step="0.01" required>
        </label>
        <label>Category
          <input type="text" id="category" list="category-suggestions">
        </label>
        <datalist id="category-suggestions"></datalist>
      </div>
      <p class="hint">Use a negative amount for expenses, e.g. -12.50.</p>
      <button type="submit" id="add">Add</button>
    </form>

    <section class="card">
      <div class="toolbar">
        <label>Category
          <select id="filter">
            <option value="All">All</option>
          </select>
        </label>
        <label class="button-like">
          Import CSV
          <input type="file" id="import" accept=".csv,text/csv">
        </label>
        <button type="button" id="export">Export CSV</button>
      </div>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Expenses by category</h2>
      <canvas id="chart"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
