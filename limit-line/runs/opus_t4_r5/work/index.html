<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Budget</h1>
    <nav>
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
    <div class="balance-box">Balance: <span id="balance">0.00</span></div>
  </header>

  <main>
    <section id="view-transactions" class="view">
      <h2>Transactions</h2>
      <form id="add-form" class="form-row" autocomplete="off" novalidate>
        <label>Date <input id="date" type="date" required></label>
        <label>Description <input id="description" type="text"></label>
        <label>Amount <input id="amount" type="number" step="0.01" required></label>
        <label>Category <input id="category" type="text"></label>
        <label>Repeat
          <select id="repeat">
            <option value="none">none</option>
            <option value="week">week</option>
            <option value="month">month</option>
          </select>
        </label>
        <label>Until <input id="until" type="date"></label>
        <button id="add" type="submit">Add</button>
      </form>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search description">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <label class="file-label">Import CSV <input id="import" type="file" accept=".csv,text/csv"></label>
        <button id="export" type="button">Export CSV</button>
      </div>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th id="sort-amount" class="sortable" title="Sort by amount">Amount</th>
            <th>Category</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-budgets" class="view" hidden>
      <h2>Budgets</h2>
      <form id="budget-form" class="form-row" autocomplete="off" novalidate>
        <label>Category <input id="budget-category" type="text" required></label>
        <label>Limit <input id="budget-limit" type="number" step="0.01" min="0.01" required></label>
        <button id="budget-add" type="submit">Add budget</button>
        <label>Month <input id="budget-month" type="month"></label>
      </form>
      <table id="budgets">
        <thead>
          <tr><th>Category</th><th>Limit</th><th>Spent</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-reports" class="view" hidden>
      <h2>Reports</h2>
      <div class="form-row">
        <label>Month <input id="report-month" type="month"></label>
      </div>
      <table id="report">
        <thead>
          <tr><th>Category</th><th>Total</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <canvas id="chart" width="640" height="300"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
