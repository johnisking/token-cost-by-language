<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Budget</h1>
    <nav>
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
  </header>

  <main>
    <section id="view-transactions">
      <p class="balance">Balance: <strong id="balance">0.00</strong></p>
      <form id="add-form" class="row" onsubmit="return false">
        <input id="date" type="text" placeholder="YYYY-MM-DD" aria-label="Date">
        <input id="description" type="text" placeholder="Description" aria-label="Description">
        <input id="amount" type="text" inputmode="decimal" placeholder="Amount" aria-label="Amount">
        <input id="category" type="text" placeholder="Category" aria-label="Category">
        <select id="repeat" aria-label="Repeat">
          <option value="none">none</option>
          <option value="week">week</option>
          <option value="month">month</option>
        </select>
        <input id="until" type="text" placeholder="Until YYYY-MM-DD" aria-label="Repeat until">
        <button id="add" type="button">Add</button>
      </form>
      <div class="row">
        <input id="search" type="search" placeholder="Search description" aria-label="Search">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <label class="file">Import CSV <input id="import" type="file" accept=".csv,text/csv"></label>
        <button id="export" type="button">Export CSV</button>
      </div>
      <table class="head">
        <thead><tr>
          <th>Date</th><th>Description</th><th>Category</th>
          <th id="sort-amount" class="sortable" title="Sort by amount">Amount ▼</th><th></th>
        </tr></thead>
      </table>
      <table id="list"><tbody></tbody></table>
    </section>

    <section id="view-budgets">
      <form class="row" onsubmit="return false">
        <input id="budget-category" type="text" placeholder="Category" aria-label="Budget category">
        <input id="budget-limit" type="text" inputmode="decimal" placeholder="Limit" aria-label="Budget limit">
        <button id="budget-add" type="button">Add budget</button>
        <label>Month <input id="budget-month" type="month"></label>
      </form>
      <table class="head">
        <thead><tr><th>Category</th><th>Limit</th><th>Spent</th><th></th></tr></thead>
      </table>
      <table id="budgets"><tbody></tbody></table>
    </section>

    <section id="view-reports">
      <div class="row">
        <label>Month <input id="report-month" type="month"></label>
      </div>
      <table class="head">
        <thead><tr><th>Category</th><th>Total</th></tr></thead>
      </table>
      <table id="report"><tbody></tbody></table>
      <canvas id="chart" width="640" height="320"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
