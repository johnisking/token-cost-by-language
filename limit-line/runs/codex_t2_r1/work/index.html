<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Breaker</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020;color:#e9f0ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center;padding:20px}.game{width:min(900px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 12px}h1{font-size:clamp(20px,4vw,30px);margin:0;letter-spacing:.04em}.stats{display:flex;flex-wrap:wrap;gap:10px 20px;font-weight:700;font-variant-numeric:tabular-nums;color:#c8d7f8}.stats span{white-space:nowrap}canvas{display:block;width:100%;height:auto;aspect-ratio:900/600;border:1px solid #304064;border-radius:14px;background:radial-gradient(ellipse at 50% 5%,#1b2b4b,#0c1427 70%);box-shadow:0 18px 60px #0008;touch-action:none}.help{text-align:center;color:#9caccb;font-size:14px;margin:12px 0 0}.help kbd{font:inherit;font-weight:700;color:#e9f0ff;background:#1c2944;padding:2px 7px;border-radius:5px}
</style>
</head>
<body>
<main class="game">
  <header><h1>BRICK BREAKER</h1><div class="stats" aria-live="polite"><span id="score">Score: 0</span><span id="lives">Lives: 3</span><span id="level">Level: 1</span><span id="best">Best: 0</span></div></header>
  <canvas id="board" width="900" height="600" aria-label="Brick breaker game"></canvas>
  <p class="help"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>Space</kbd> launch · <kbd>P</kbd> pause · <kbd>N</kbd> next level · Mouse to aim and move</p>
</main>
<script>
(()=>{
  'use strict';
  const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,storeKey='brick-breaker-save-v1';
  const readSave=()=>{try{return JSON.parse(localStorage.getItem(storeKey))||{}}catch{return {}}};
  const save=readSave();
  let level=Number.isInteger(save.level)&&save.level>=1&&save.level<=5?save.level:1;
  let score=Number.isFinite(save.score)&&save.score>=0?save.score:0;
  let best=Number.isFinite(save.best)&&save.best>=0?save.best:0;
  let lives=Number.isInteger(save.lives)&&save.lives>=1&&save.lives<=3?save.lives:3;
  const paddle={w:126,h:14,x:(W-126)/2,y:H-42,speed:8};
  const ball={x:W/2,y:paddle.y-10,r:9,vx:4,vy:-5,speed:6,stuck:true};
  let bricks=[],paused=false,ended='',keys={};
  const layouts=[
    ['111111111','111111111','111111111'],
    ['100010001','010101010','001111100','111111111'],
    ['111111111','011111110','001111100','000111000','000111000'],
    ['101010101','010101010','101010101','010101010','111111111'],
    ['111111111','111111111','111111111','111111111','111111111','111111111']
  ];
  const colors=['#57d5ff','#7f9cff','#bd82ff','#ff7fa9','#ffb45e'];
  function buildLevel(){
    bricks=[];const rows=layouts[level-1],cols=9,gap=8,bw=79,bh=22,total=cols*bw+(cols-1)*gap,left=(W-total)/2,top=76;
    rows.forEach((row,r)=>[...row].forEach((cell,c)=>{if(cell==='1')bricks.push({x:left+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:level>=4&&r%2===0?2:1});}));
    resetBall();
  }
  function resetBall(){paddle.x=(W-paddle.w)/2;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;ball.vx=4;ball.vy=-5;ball.speed=6;ball.stuck=true;}
  function persist(){try{localStorage.setItem(storeKey,JSON.stringify({level,score,best,lives}));}catch{}}
  function updateStats(){document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('lives').textContent=`Lives: ${lives}`;document.getElementById('level').textContent=`Level: ${level}`;document.getElementById('best').textContent=`Best: ${best}`;}
  function launch(){if(ball.stuck&&!paused&&!ended){ball.stuck=false;const sign=(Math.random()<.5?-1:1);ball.vx=sign*4.2;ball.vy=-Math.sqrt(ball.speed*ball.speed-ball.vx*ball.vx);}}
  function nextLevel(){if(level<5){level++;buildLevel();persist();}else{ended='win';persist();}}
  function loseLife(){lives--;if(lives<=0){lives=0;ended='over';}else resetBall();persist();}
  function togglePause(){if(!ended)paused=!paused;}
  function movePaddle(x){paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;}}
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='p')togglePause();if(e.key.toLowerCase()==='n'&&!ended){nextLevel();}if(e.code==='Space')launch();});
  window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();movePaddle((e.clientX-r.left)*W/r.width);});
  canvas.addEventListener('click',()=>launch());
  canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();movePaddle((e.touches[0].clientX-r.left)*W/r.width);},{passive:false});
  canvas.addEventListener('touchstart',e=>{e.preventDefault();launch();},{passive:false});
  function update(){
    if(paused||ended)return;
    if(keys.arrowleft||keys.a)movePaddle(paddle.x+paddle.w/2-paddle.speed);
    if(keys.arrowright||keys.d)movePaddle(paddle.x+paddle.w/2+paddle.speed);
    if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return;}
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}
    if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
      const offset=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=offset*5.4;ball.vy=-Math.sqrt(Math.max(12,ball.speed*ball.speed-ball.vx*ball.vx));ball.y=paddle.y-ball.r;
    }
    for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){ball.vy=-ball.vy;b.hp--;score+=10;best=Math.max(best,score);if(b.hp<=0)bricks.splice(i,1);persist();updateStats();break;}}
    if(ball.y-ball.r>H)loseLife();if(bricks.length===0)nextLevel();
  }
  function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.globalAlpha=.24;ctx.strokeStyle='#8eabd8';ctx.lineWidth=1;for(let x=30;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}ctx.restore();
    bricks.forEach(b=>{ctx.fillStyle=b.hp>1?'#ffdc70':colors[(level-1)%colors.length];roundedRect(b.x,b.y,b.w,b.h,6);ctx.fill();ctx.fillStyle='#ffffff35';roundedRect(b.x+2,b.y+2,b.w-4,5,3);ctx.fill();});
    ctx.fillStyle='#d7e5ff';roundedRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.fillStyle='#72e7ff';roundedRect(paddle.x+12,paddle.y+3,paddle.w-24,4,3);ctx.fill();
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff2a6';ctx.shadowColor='#ffe47b';ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;
    if(paused||ended){ctx.fillStyle='#070b16b8';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f1f6ff';ctx.font='700 54px system-ui';ctx.fillText(paused?'Paused':ended==='win'?'You win':'Game over',W/2,H/2);if(!paused){ctx.font='18px system-ui';ctx.fillStyle='#b9c8e6';ctx.fillText('Refresh to play again',W/2,H/2+48);}}
  }
  function frame(){update();draw();updateStats();requestAnimationFrame(frame);}
  buildLevel();updateStats();frame();
})();
</script>
</body>
</html>
