<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">PERSONAL FINANCE</p><h1>Expense tracker</h1></div>
      <div class="balance-card"><span>Current balance</span><strong id="balance">0.00</strong></div>
    </header>

    <section class="panel" aria-labelledby="add-title">
      <div class="section-heading"><div><p class="eyebrow">NEW ENTRY</p><h2 id="add-title">Add a transaction</h2></div></div>
      <form id="transaction-form">
        <label>Date<input id="date" name="date" type="date" required></label>
        <label>Description<input id="description" name="description" type="text" placeholder="What was it for?" required maxlength="120"></label>
        <label>Amount<input id="amount" name="amount" type="number" step="0.01" placeholder="-24.50" required></label>
        <label>Category<input id="category" name="category" type="text" placeholder="e.g. Food" required maxlength="40"></label>
        <button id="add" class="primary" type="submit">Add transaction</button>
      </form>
    </section>

    <section class="panel chart-panel" aria-labelledby="chart-title">
      <div class="section-heading"><div><p class="eyebrow">SPENDING</p><h2 id="chart-title">Expenses by category</h2></div></div>
      <div class="chart-wrap"><canvas id="chart" aria-label="Bar chart of expenses by category"></canvas></div>
    </section>

    <section class="panel transactions" aria-labelledby="transactions-title">
      <div class="section-heading transaction-heading">
        <div><p class="eyebrow">YOUR ACTIVITY</p><h2 id="transactions-title">Transactions</h2></div>
        <div class="actions">
          <label class="filter-label" for="filter">Show<select id="filter"><option value="All">All</option></select></label>
          <label class="file-button" for="import">Import CSV<input id="import" type="file" accept=".csv,text/csv"></label>
          <button id="export" class="secondary" type="button">Export CSV</button>
        </div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="number">Amount</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="list"></tbody></table></div>
      <p id="empty-state" class="empty-state">No transactions yet. Add one above or import a CSV.</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <footer>Income is positive; enter expenses as negative amounts.</footer>
  </main>
</body>
</html>
