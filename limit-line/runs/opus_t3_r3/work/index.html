<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
    <div class="totals">
      <div class="card">
        <span class="label">Balance</span>
        <span id="balance" class="value">0.00</span>
      </div>
      <div class="card">
        <span class="label">Income</span>
        <span id="income" class="value pos">0.00</span>
      </div>
      <div class="card">
        <span class="label">Expenses</span>
        <span id="expense" class="value neg">0.00</span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Add transaction</h2>
      <form id="tx-form" autocomplete="off">
        <label>Date <input type="date" id="date" required></label>
        <label>Description <input type="text" id="description" placeholder="e.g. Groceries"></label>
        <label>Amount <input type="number" id="amount" step="0.01" placeholder="-25.00 or 1500" required></label>
        <label>Category <input type="text" id="category" list="categories" placeholder="e.g. Food"></label>
        <datalist id="categories"></datalist>
        <button type="submit" id="add">Add</button>
      </form>
      <p class="hint">Use negative amounts for expenses and positive amounts for income.</p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <label>Category <select id="filter"><option value="All">All</option></select></label>
        <span class="spacer"></span>
        <label class="file-btn">Import CSV <input type="file" id="import" accept=".csv,text/csv"></label>
        <button type="button" id="export">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table id="list">
          <thead>
            <tr><th>Date</th><th>Description</th><th class="num">Amount</th><th>Category</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Expenses by category</h2>
      <canvas id="chart" width="600" height="260"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
