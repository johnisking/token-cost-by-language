<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spreadsheet</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toolbar">
  <button id="undo" type="button">Undo</button>
  <button id="redo" type="button">Redo</button>
  <button id="copy" type="button">Copy</button>
  <button id="paste" type="button">Paste</button>
  <button id="export" type="button">Export CSV</button>
  <input id="formula" type="text" autocomplete="off" spellcheck="false">
</div>
<div id="wrap"><table id="grid"></table></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
