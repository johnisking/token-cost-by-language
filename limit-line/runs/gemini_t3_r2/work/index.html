<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Expense Tracker</h1>
      <div class="balance-card">
        <span class="balance-label">Current Balance</span>
        <span id="balance" class="balance-value">0.00</span>
      </div>
    </header>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form id="transaction-form" class="transaction-form">
        <input type="date" id="date" placeholder="YYYY-MM-DD" aria-label="Date">
        <input type="text" id="description" placeholder="Description" aria-label="Description">
        <input type="number" id="amount" step="any" placeholder="Amount (e.g. -25.50 or 100)" aria-label="Amount">
        <input type="text" id="category" placeholder="Category" aria-label="Category">
        <button type="submit" id="add">Add</button>
      </form>
    </section>

    <section class="panel controls-panel">
      <div class="filter-group">
        <label for="filter">Filter by Category:</label>
        <select id="filter">
          <option value="All">All</option>
        </select>
      </div>
      <div class="csv-group">
        <label for="import" class="file-label">
          Import CSV
          <input type="file" id="import" accept=".csv,text/csv">
        </label>
        <button type="button" id="export">Export CSV</button>
      </div>
    </section>

    <section class="panel">
      <h2>Transactions</h2>
      <div class="table-Headers">
        <span>Date</span>
        <span>Description</span>
        <span>Category</span>
        <span>Amount</span>
        <span>Action</span>
      </div>
      <table id="list">
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Expenses by Category</h2>
      <canvas id="chart" width="600" height="300"></canvas>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
