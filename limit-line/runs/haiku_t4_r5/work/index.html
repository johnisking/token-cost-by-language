<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Budget</h1>
    <nav>
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
  </header>

  <main>
    <p id="message" role="status"></p>

    <section id="view-transactions" class="view">
      <h2>Transactions</h2>
      <div class="form">
        <label>Date <input id="date" type="date"></label>
        <label>Description <input id="description" type="text"></label>
        <label>Amount <input id="amount" type="number" step="0.01"></label>
        <label>Category <input id="category" type="text"></label>
        <label>Repeat
          <select id="repeat">
            <option value="none">none</option>
            <option value="week">week</option>
            <option value="month">month</option>
          </select>
        </label>
        <label>Until <input id="until" type="date"></label>
        <button id="add" type="button">Add</button>
      </div>
      <p class="hint">Negative amounts are expenses, positive amounts are income.</p>

      <div class="toolbar">
        <p class="balance">Balance: <strong id="balance">0.00</strong></p>
        <label>Search <input id="search" type="search"></label>
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <label>Import CSV <input id="import" type="file" accept=".csv,text/csv"></label>
        <button id="export" type="button">Export CSV</button>
      </div>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th id="sort-amount" class="sortable" title="Sort by amount, highest first">Amount</th>
            <th>Category</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-budgets" class="view" hidden>
      <h2>Budgets</h2>
      <div class="form">
        <label>Category <input id="budget-category" type="text"></label>
        <label>Limit <input id="budget-limit" type="number" min="0" step="0.01"></label>
        <button id="budget-add" type="button">Add budget</button>
      </div>
      <div class="toolbar">
        <label>Month <input id="budget-month" type="month"></label>
      </div>
      <table id="budgets">
        <thead>
          <tr>
            <th>Category</th>
            <th>Limit</th>
            <th>Spent</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-reports" class="view" hidden>
      <h2>Reports</h2>
      <div class="toolbar">
        <label>Month <input id="report-month" type="month"></label>
      </div>
      <table id="report">
        <thead>
          <tr>
            <th>Category</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <canvas id="chart" width="640" height="320" aria-label="Expenses by category this month"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
