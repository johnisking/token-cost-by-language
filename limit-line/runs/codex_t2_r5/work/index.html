<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Breaker</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center;padding:20px}.game{width:min(920px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}h1{font-size:clamp(20px,4vw,30px);margin:0;letter-spacing:.04em}.hint{color:#aeb9d8;font-size:13px;text-align:right}canvas{display:block;width:100%;height:auto;border:1px solid #334064;border-radius:12px;background:#101a34;box-shadow:0 18px 60px #0008;touch-action:none}footer{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:#9eaccd;font-size:13px}.accent{color:#7ce8da}
</style>
</head>
<body>
<main class="game">
<header><h1>BRICK BREAKER</h1><div class="hint">← → or mouse to move · Space / click to launch · P to pause · N next level</div></header>
<canvas id="game" width="900" height="600" aria-label="Brick breaker game"></canvas>
<footer><span>Clear every brick to advance.</span><span class="accent">Keep the ball in play!</span></footer>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const SAVE_KEY = 'single-file-brick-breaker-v1';
  const layouts = [
    ['1111111111','1111111111','1111111111','1111111111'],
    ['1000000001','0100000010','0010000100','0001111000','0010000100','0100000010','1000000001'],
    ['1111111111','0111111110','0011111100','0001111000','0000110000'],
    ['1001100110','0101100110','0011111100','0011111100','0101100110','1001100110'],
    ['1111111111','1100000011','1011111101','1010000101','1011111101','1100000011','1111111111']
  ];
  const colors = ['#ff6b7a','#ffae57','#ffe36e','#7ce8da','#7e9bff','#c28bff','#ff82c8'];
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch (_) {}
  let best = Number.isFinite(saved.best) ? Math.max(0, saved.best) : 0;
  let score = Number.isFinite(saved.score) ? Math.max(0, saved.score) : 0;
  let level = Number.isFinite(saved.level) ? Math.min(5, Math.max(1, saved.level)) : 1;
  let lives = Number.isFinite(saved.lives) ? Math.min(3, Math.max(1, saved.lives)) : 3;
  let bricks = [];
  let paused = false, ended = false, won = false, launched = false;
  const paddle = { x: W/2-62, y:H-54, w:124, h:14, speed:8 };
  const ball = { x:W/2, y:paddle.y-12, r:9, vx:4.2, vy:-5.2 };
  const keys = {left:false,right:false};

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({level,score,lives,best})); } catch (_) {}
  }
  function buildLevel() {
    bricks = [];
    const map = layouts[level-1], cols = map[0].length;
    const gap=8, bw=(W-96-gap*(cols-1))/cols, bh=24, left=48, top=90;
    map.forEach((row,r) => [...row].forEach((cell,c) => {
      if (cell === '1') bricks.push({x:left+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,color:colors[(r+c+level-1)%colors.length],alive:true});
    }));
    resetBall();
  }
  function resetBall() {
    launched = false;
    ball.x = paddle.x + paddle.w/2; ball.y = paddle.y-ball.r-2;
    const dir = Math.random()<.5 ? -1 : 1;
    ball.vx = dir*(3.8+level*.2); ball.vy=-(5+level*.15);
  }
  function launch() { if (!paused && !ended && !launched) launched=true; }
  function nextLevel() {
    if (level >= 5) { won=true; ended=true; save(); return; }
    level++; save(); buildLevel();
  }
  function loseLife() {
    lives--;
    if (lives <= 0) { lives=0; ended=true; save(); }
    else { resetBall(); save(); }
  }
  function togglePause() { if (ended) return; paused=!paused; }
  function onKeyDown(e) {
    if (['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if (e.code==='ArrowLeft') keys.left=true;
    if (e.code==='ArrowRight') keys.right=true;
    if (e.code==='Space') launch();
    if (e.code==='KeyP') togglePause();
    if (e.code==='KeyN') { if (level<5) nextLevel(); else {won=true;ended=true;save();} }
  }
  function onKeyUp(e) { if(e.code==='ArrowLeft')keys.left=false; if(e.code==='ArrowRight')keys.right=false; }
  window.addEventListener('keydown',onKeyDown); window.addEventListener('keyup',onKeyUp);
  function pointerX(e) { const rect=canvas.getBoundingClientRect(); return (e.clientX-rect.left)*W/rect.width; }
  canvas.addEventListener('pointermove',e => { const rect=canvas.getBoundingClientRect(); paddle.x=pointerX(e)-paddle.w/2; clampPaddle(); if(!launched)ball.x=paddle.x+paddle.w/2; });
  canvas.addEventListener('pointerdown',e => { e.preventDefault(); paddle.x=pointerX(e)-paddle.w/2; clampPaddle(); if(!launched)ball.x=paddle.x+paddle.w/2; launch(); });
  function clampPaddle(){paddle.x=Math.max(18,Math.min(W-paddle.w-18,paddle.x));}
  function update() {
    if (paused || ended) return;
    if(keys.left)paddle.x-=paddle.speed; if(keys.right)paddle.x+=paddle.speed; clampPaddle();
    if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return;}
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x-ball.r<10){ball.x=10+ball.r;ball.vx=Math.abs(ball.vx)}
    if(ball.x+ball.r>W-10){ball.x=W-10-ball.r;ball.vx=-Math.abs(ball.vx)}
    if(ball.y-ball.r<12){ball.y=12+ball.r;ball.vy=Math.abs(ball.vy)}
    if(ball.vy>0 && ball.y+ball.r>=paddle.y && ball.y-ball.r<=paddle.y+paddle.h && ball.x>=paddle.x && ball.x<=paddle.x+paddle.w){
      const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      const speed=Math.min(9,Math.hypot(ball.vx,ball.vy)+.12);
      const angle=hit*1.05;
      ball.vx=speed*Math.sin(angle);ball.vy=-Math.max(3.5,speed*Math.cos(angle));ball.y=paddle.y-ball.r-1;
    }
    for(const b of bricks){if(!b.alive)continue; if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.alive=false;score+=10*level;best=Math.max(best,score);save();
      const overlapX=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));
      const overlapY=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));
      if(overlapX<overlapY)ball.vx*=-1;else ball.vy*=-1; break;
    }}
    if(ball.y-ball.r>H){loseLife();return;}
    if(bricks.every(b=>!b.alive))nextLevel();
  }
  function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();}
  function draw() {
    ctx.clearRect(0,0,W,H);
    const gradient=ctx.createLinearGradient(0,0,W,H);gradient.addColorStop(0,'#111d3b');gradient.addColorStop(1,'#0c142a');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#243252';ctx.lineWidth=1;for(let x=30;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,65);ctx.lineTo(x,H-20);ctx.stroke();}
    ctx.fillStyle='#f4f6ff';ctx.font='600 19px system-ui, sans-serif';ctx.textBaseline='middle';
    ctx.fillText(`Score: ${score}`,32,35);ctx.fillText(`Lives: ${lives}`,235,35);ctx.fillText(`Level: ${level}`,440,35);ctx.fillText(`Best: ${best}`,650,35);
    ctx.strokeStyle='#344363';ctx.beginPath();ctx.moveTo(24,62);ctx.lineTo(W-24,62);ctx.stroke();
    for(const b of bricks){if(!b.alive)continue;roundRect(b.x,b.y,b.w,b.h,6,b.color);ctx.fillStyle='#ffffff38';ctx.fillRect(b.x+5,b.y+3,b.w-10,3);}
    roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7,'#7ce8da');
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#7ce8da';ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;
    if(!launched&&!paused&&!ended)overlay('Press Space or click to launch','Move with ← → or mouse');
    if(paused)overlay('Paused','Press P to resume');
    if(ended)overlay(won?'You win':'Game over',won?'All five levels cleared!':'Press N to restart at the next level');
  }
  function overlay(title,sub){ctx.fillStyle='#07101dcc';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='700 46px system-ui, sans-serif';ctx.fillText(title,W/2,H/2-14);ctx.fillStyle='#c1cbe2';ctx.font='18px system-ui, sans-serif';ctx.fillText(sub,W/2,H/2+30);ctx.textAlign='left';}
  function frame(){update();draw();requestAnimationFrame(frame);}
  buildLevel(); frame();
})();
</script>
</body>
</html>
