<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <p class="balance">Balance: <strong id="balance">0.00</strong></p>

    <form id="form" class="add-form">
      <input type="date" id="date" required>
      <input type="text" id="description" placeholder="Description" required>
      <input type="number" id="amount" step="0.01" placeholder="Amount (+ income, - expense)" required>
      <input type="text" id="category" placeholder="Category" required>
      <button type="submit" id="add">Add</button>
    </form>

    <div class="toolbar">
      <label>Filter
        <select id="filter">
          <option value="All">All</option>
        </select>
      </label>
      <label>Import CSV
        <input type="file" id="import" accept=".csv,text/csv">
      </label>
      <button type="button" id="export">Export CSV</button>
    </div>

    <table id="list">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Category</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Expenses by category</h2>
    <canvas id="chart" width="600" height="320"></canvas>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
