<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Web App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Budget Tracker</h1>
    <nav class="app-nav">
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
    <div class="balance-box">
      <span>Balance: $</span><strong id="balance">0.00</strong>
    </div>
  </header>

  <main class="app-main">
    <!-- Transactions View -->
    <section id="view-transactions">
      <h2>Transactions</h2>

      <div class="form-row">
        <input id="date" type="date" aria-label="Date">
        <input id="description" type="text" placeholder="Description" aria-label="Description">
        <input id="amount" type="number" step="any" placeholder="Amount" aria-label="Amount">
        <input id="category" type="text" placeholder="Category" aria-label="Category">
        <select id="repeat" aria-label="Repeat">
          <option value="none">none</option>
          <option value="week">week</option>
          <option value="month">month</option>
        </select>
        <input id="until" type="date" aria-label="Until">
        <button id="add" type="button">Add</button>
      </div>

      <div class="toolbar">
        <input id="search" type="text" placeholder="Search description..." aria-label="Search">
        <div class="toolbar-actions">
          <button id="undo" type="button">Undo</button>
          <button id="redo" type="button">Redo</button>
          <label class="file-label">
            Import CSV
            <input id="import" type="file" accept=".csv,text/csv">
          </label>
          <button id="export" type="button">Export CSV</button>
        </div>
      </div>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th id="sort-amount" class="sortable">Amount</th>
            <th>Category</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="list-body"></tbody>
      </table>
    </section>

    <!-- Budgets View -->
    <section id="view-budgets" hidden style="display: none;">
      <h2>Budgets</h2>

      <div class="form-row">
        <input id="budget-category" type="text" placeholder="Category" aria-label="Budget Category">
        <input id="budget-limit" type="number" step="any" placeholder="Limit" aria-label="Budget Limit">
        <button id="budget-add" type="button">Add Budget</button>
        <input id="budget-month" type="month" aria-label="Budget Month">
      </div>

      <table id="budgets">
        <tbody id="budgets-body"></tbody>
      </table>
    </section>

    <!-- Reports View -->
    <section id="view-reports" hidden style="display: none;">
      <h2>Reports</h2>

      <div class="form-row">
        <input id="report-month" type="month" aria-label="Report Month">
      </div>

      <table id="report">
        <tbody id="report-body"></tbody>
      </table>

      <div class="chart-container">
        <canvas id="chart" width="600" height="300"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
