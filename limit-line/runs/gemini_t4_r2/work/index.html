<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Budget Tracker</h1>
    <nav>
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
  </header>

  <main>
    <!-- Transactions View -->
    <section id="view-transactions" class="view">
      <h2>Transactions</h2>
      <div class="balance-card">
        <span>Balance:</span>
        <span id="balance">0.00</span>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Description" />
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="any" placeholder="0.00" />
        </div>
        <div class="field">
          <label for="category">Category</label>
          <input type="text" id="category" placeholder="Category" />
        </div>
        <div class="field">
          <label for="repeat">Repeat</label>
          <select id="repeat">
            <option value="none">none</option>
            <option value="week">week</option>
            <option value="month">month</option>
          </select>
        </div>
        <div class="field">
          <label for="until">Until</label>
          <input type="date" id="until" />
        </div>
        <button type="button" id="add">Add</button>
      </div>

      <div class="toolbar">
        <div class="field">
          <label for="search">Search</label>
          <input type="text" id="search" placeholder="Search description..." />
        </div>
        <button type="button" id="undo" class="secondary">Undo</button>
        <button type="button" id="redo" class="secondary">Redo</button>
        <div class="field">
          <label for="import">Import CSV</label>
          <input type="file" id="import" accept=".csv,text/csv" />
        </div>
        <button type="button" id="export" class="secondary">Export CSV</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th id="sort-amount">Amount</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </section>

    <!-- Budgets View -->
    <section id="view-budgets" class="view hidden" hidden>
      <h2>Budgets</h2>
      <div class="form-grid">
        <div class="field">
          <label for="budget-category">Category</label>
          <input type="text" id="budget-category" placeholder="Category" />
        </div>
        <div class="field">
          <label for="budget-limit">Limit</label>
          <input type="number" id="budget-limit" step="any" placeholder="0.00" />
        </div>
        <button type="button" id="budget-add">Add Budget</button>
        <div class="field">
          <label for="budget-month">Month</label>
          <input type="month" id="budget-month" />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Limit</th>
            <th>Spent</th>
          </tr>
        </thead>
        <tbody id="budgets"></tbody>
      </table>
    </section>

    <!-- Reports View -->
    <section id="view-reports" class="view hidden" hidden>
      <h2>Reports</h2>
      <div class="form-grid">
        <div class="field">
          <label for="report-month">Month</label>
          <input type="month" id="report-month" />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="report"></tbody>
      </table>

      <canvas id="chart" width="600" height="300"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
