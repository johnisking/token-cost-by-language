<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense Tracker</h1>
    </header>

    <section class="summary-cards">
      <div class="card">
        <div class="card-label">Current Balance</div>
        <div class="card-value" id="balance">0.00</div>
      </div>
      <div class="card">
        <div class="card-label">Total Income</div>
        <div class="card-value amount-income" id="income">0.00</div>
      </div>
      <div class="card">
        <div class="card-label">Total Expense</div>
        <div class="card-value amount-expense" id="expense">0.00</div>
      </div>
    </section>

    <section class="grid-layout">
      <div class="card">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
          <div class="form-row">
            <label for="date">Date</label>
            <input type="date" id="date" />
          </div>
          <div class="form-row">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Grocery shopping" />
          </div>
          <div class="form-row">
            <label for="amount">Amount</label>
            <input type="number" id="amount" step="any" placeholder="e.g. -45.50 or 1200.00" />
          </div>
          <div class="form-row">
            <label for="category">Category</label>
            <input type="text" id="category" placeholder="e.g. Food" />
          </div>
          <button type="submit" id="add">Add Transaction</button>
        </form>
      </div>

      <div class="card">
        <h2>Expenses by Category</h2>
        <canvas id="chart" width="420" height="280"></canvas>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <div class="toolbar-group">
          <label for="filter">Filter by Category:</label>
          <select id="filter">
            <option value="All">All</option>
          </select>
        </div>
        <div class="toolbar-group">
          <label for="import">Import CSV:</label>
          <input type="file" id="import" accept=".csv,text/csv" />
          <button type="button" id="export">Export CSV</button>
        </div>
      </div>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
