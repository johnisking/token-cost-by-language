<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Sheet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <button id="undo" type="button">Undo</button>
    <button id="redo" type="button">Redo</button>
    <button id="copy" type="button">Copy</button>
    <button id="paste" type="button">Paste</button>
    <button id="export" type="button">Export CSV</button>
  </header>
  <div class="formula-bar">
    <span id="address" class="address">A1</span>
    <input id="formula" type="text" autocomplete="off" spellcheck="false" aria-label="Formula">
  </div>
  <div class="sheet-wrap">
    <table id="grid"></table>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
