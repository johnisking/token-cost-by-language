<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Budget Tracker</h1>
    <nav>
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
  </header>

  <main>
    <section id="view-transactions">
      <div class="balance-card">
        <span>Total Balance: </span>
        <strong id="balance">0.00</strong>
      </div>

      <div class="controls-bar">
        <div class="form-row">
          <input id="date" type="date" placeholder="YYYY-MM-DD" aria-label="Date">
          <input id="description" type="text" placeholder="Description" aria-label="Description">
          <input id="amount" type="number" step="0.01" placeholder="Amount" aria-label="Amount">
          <input id="category" type="text" placeholder="Category" aria-label="Category">
          <select id="repeat" aria-label="Repeat">
            <option value="none">none</option>
            <option value="week">week</option>
            <option value="month">month</option>
          </select>
          <input id="until" type="date" placeholder="Until YYYY-MM-DD" aria-label="Until">
          <button id="add" type="button">Add</button>
        </div>

        <div class="actions-row">
          <input id="search" type="text" placeholder="Search description..." aria-label="Search">
          <button id="undo" type="button">Undo</button>
          <button id="redo" type="button">Redo</button>
          <label class="file-label">
            Import CSV
            <input id="import" type="file" accept=".csv,text/csv">
          </label>
          <button id="export" type="button">Export CSV</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th id="sort-amount" class="sortable">Amount</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </section>

    <section id="view-budgets" hidden>
      <div class="controls-bar">
        <div class="form-row">
          <input id="budget-category" type="text" placeholder="Category" aria-label="Budget Category">
          <input id="budget-limit" type="number" step="0.01" placeholder="Limit" aria-label="Budget Limit">
          <button id="budget-add" type="button">Add Budget</button>
          <input id="budget-month" type="month" aria-label="Budget Month">
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Limit</th>
            <th>Spent</th>
          </tr>
        </thead>
        <tbody id="budgets"></tbody>
      </table>
    </section>

    <section id="view-reports" hidden>
      <div class="controls-bar">
        <div class="form-row">
          <input id="report-month" type="month" aria-label="Report Month">
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="report"></tbody>
      </table>

      <div class="chart-container">
        <canvas id="chart" width="600" height="300"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
