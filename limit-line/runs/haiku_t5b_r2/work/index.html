<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spreadsheet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <h1>Spreadsheet</h1>
    <button id="undo" type="button">Undo</button>
    <button id="redo" type="button">Redo</button>
    <button id="copy" type="button">Copy</button>
    <button id="paste" type="button">Paste</button>
    <button id="export" type="button">Export CSV</button>
  </header>

  <div class="formula-bar">
    <span id="current-ref" class="ref-label">A1</span>
    <input id="formula" type="text" autocomplete="off" spellcheck="false" aria-label="Formula or value">
  </div>

  <div class="grid-wrap">
    <table id="grid">
      <thead>
        <tr>
          <th></th>
          <th>A</th><th>B</th><th>C</th><th>D</th><th>E</th>
          <th>F</th><th>G</th><th>H</th><th>I</th><th>J</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
