<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Budget</h1>
    <nav>
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
  </header>

  <main>
    <section id="view-transactions">
      <p>Balance: <strong id="balance">0.00</strong></p>
      <div class="form">
        <input id="date" type="date" aria-label="Date">
        <input id="description" type="text" placeholder="Description">
        <input id="amount" type="number" step="0.01" placeholder="Amount">
        <input id="category" type="text" placeholder="Category">
        <select id="repeat" aria-label="Repeat">
          <option value="none">none</option>
          <option value="week">week</option>
          <option value="month">month</option>
        </select>
        <input id="until" type="date" aria-label="Repeat until">
        <button id="add" type="button">Add</button>
      </div>
      <div class="form">
        <input id="search" type="search" placeholder="Search description">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <label>Import CSV <input id="import" type="file" accept=".csv,text/csv"></label>
        <button id="export" type="button">Export CSV</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th id="sort-amount" class="sortable">Amount</th>
            <th>Category</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </section>

    <section id="view-budgets" hidden>
      <div class="form">
        <input id="budget-category" type="text" placeholder="Category">
        <input id="budget-limit" type="number" step="0.01" min="0" placeholder="Limit">
        <button id="budget-add" type="button">Add budget</button>
        <label>Month <input id="budget-month" type="month"></label>
      </div>
      <table>
        <thead>
          <tr><th>Category</th><th>Limit</th><th>Spent</th><th></th></tr>
        </thead>
        <tbody id="budgets"></tbody>
      </table>
    </section>

    <section id="view-reports" hidden>
      <div class="form">
        <label>Month <input id="report-month" type="month"></label>
      </div>
      <table>
        <thead>
          <tr><th>Category</th><th>Total</th></tr>
        </thead>
        <tbody id="report"></tbody>
      </table>
      <canvas id="chart" width="640" height="320"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
