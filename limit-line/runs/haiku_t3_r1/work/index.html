<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <section class="summary">
      <div class="card">
        <span class="label">Balance</span>
        <strong id="balance">0.00</strong>
      </div>
      <div class="card">
        <span class="label">Income</span>
        <strong id="income">0.00</strong>
      </div>
      <div class="card">
        <span class="label">Expense</span>
        <strong id="expense">0.00</strong>
      </div>
    </section>

    <section>
      <h2>Add transaction</h2>
      <form id="transaction-form" class="form">
        <label>
          Date
          <input id="date" type="date" required>
        </label>
        <label>
          Description
          <input id="description" type="text" required>
        </label>
        <label>
          Amount
          <input id="amount" type="number" step="any" required placeholder="-12.50 for expense">
        </label>
        <label>
          Category
          <input id="category" type="text" list="category-options" required>
        </label>
        <button id="add" type="submit">Add</button>
      </form>
      <p class="hint">Positive amounts are income, negative amounts are expenses.</p>
    </section>

    <section>
      <div class="toolbar">
        <label>
          Filter
          <select id="filter"></select>
        </label>
        <label class="button-like">
          Import CSV
          <input id="import" type="file" accept=".csv,text/csv">
        </label>
        <button id="export" type="button">Export CSV</button>
        <span id="status" role="status"></span>
      </div>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="hint" hidden>No transactions yet.</p>
    </section>

    <section>
      <h2>Expenses by category</h2>
      <canvas id="chart"></canvas>
    </section>
  </main>

  <datalist id="category-options"></datalist>

  <script type="module" src="js/app.js"></script>
</body>
</html>
