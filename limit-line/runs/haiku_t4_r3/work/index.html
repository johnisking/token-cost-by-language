<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Budget</h1>
    <nav>
      <a id="nav-transactions" href="#/transactions">Transactions</a>
      <a id="nav-budgets" href="#/budgets">Budgets</a>
      <a id="nav-reports" href="#/reports">Reports</a>
    </nav>
  </header>

  <main>
    <!-- Transactions -->
    <section id="view-transactions" class="view">
      <div class="panel">
        <h2>Add transaction</h2>
        <div class="form-row">
          <label>Date <input id="date" type="date"></label>
          <label>Description <input id="description" type="text"></label>
          <label>Amount <input id="amount" type="number" step="0.01" placeholder="+ income, - expense"></label>
          <label>Category <input id="category" type="text"></label>
        </div>
        <div class="form-row">
          <label>Repeat
            <select id="repeat">
              <option value="none">none</option>
              <option value="week">week</option>
              <option value="month">month</option>
            </select>
          </label>
          <label>Until <input id="until" type="date"></label>
          <button id="add" type="button">Add</button>
        </div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search description">
        <button id="undo" type="button" disabled>Undo</button>
        <button id="redo" type="button" disabled>Redo</button>
        <label class="file-label">Import CSV <input id="import" type="file" accept=".csv,text/csv"></label>
        <button id="export" type="button">Export CSV</button>
      </div>

      <p class="balance">Balance: <span id="balance">0.00</span></p>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th id="sort-amount" class="sortable" title="Sort by amount, highest first">Amount</th>
            <th>Category</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Budgets -->
    <section id="view-budgets" class="view" hidden>
      <div class="panel">
        <h2>Budgets</h2>
        <div class="form-row">
          <label>Month <input id="budget-month" type="month"></label>
          <label>Category <input id="budget-category" type="text"></label>
          <label>Limit <input id="budget-limit" type="number" min="0" step="0.01"></label>
          <button id="budget-add" type="button">Add budget</button>
        </div>
      </div>

      <table id="budgets">
        <thead>
          <tr>
            <th>Category</th>
            <th>Limit</th>
            <th>Spent</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Reports -->
    <section id="view-reports" class="view" hidden>
      <div class="panel">
        <h2>Reports</h2>
        <label>Month <input id="report-month" type="month"></label>
      </div>

      <table id="report">
        <thead>
          <tr>
            <th>Category</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <canvas id="chart" width="640" height="320"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
