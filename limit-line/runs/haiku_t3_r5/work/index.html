<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <section class="summary">
      <div class="card">
        <span>Balance</span>
        <strong id="balance">0.00</strong>
      </div>
      <div class="card">
        <span>Income</span>
        <strong id="income" class="income">0.00</strong>
      </div>
      <div class="card">
        <span>Expenses</span>
        <strong id="expense" class="expense">0.00</strong>
      </div>
    </section>

    <section>
      <h2>Add transaction</h2>
      <form id="form" class="add-form">
        <input id="date" type="date" required>
        <input id="description" type="text" placeholder="Description" required>
        <input id="amount" type="number" step="0.01" placeholder="Amount (-20 for expense)" required>
        <input id="category" type="text" placeholder="Category" required>
        <button id="add" type="submit">Add</button>
      </form>
    </section>

    <section>
      <div class="toolbar">
        <label>
          Filter
          <select id="filter">
            <option value="All">All</option>
          </select>
        </label>
        <label class="file-label">
          Import CSV
          <input id="import" type="file" accept=".csv,text/csv">
        </label>
        <button id="export" type="button">Export CSV</button>
      </div>

      <table id="list">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th class="num">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Expenses by category</h2>
      <canvas id="chart" width="600" height="300"></canvas>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
