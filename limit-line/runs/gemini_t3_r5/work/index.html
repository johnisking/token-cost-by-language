<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <div class="summary-cards">
        <div class="card balance-card">
          <span class="card-label">Current Balance</span>
          <span class="card-value">$<span id="balance">0.00</span></span>
        </div>
        <div class="card income-card">
          <span class="card-label">Total Income</span>
          <span class="card-value">+$<span id="income">0.00</span></span>
        </div>
        <div class="card expense-card">
          <span class="card-label">Total Expense</span>
          <span class="card-value">-$<span id="expense">0.00</span></span>
        </div>
      </div>
    </header>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form id="transaction-form" class="transaction-form">
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" placeholder="e.g. Grocery shopping">
        </div>
        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" name="amount" step="any" placeholder="e.g. -45.50 or 1200">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <input type="text" id="category" name="category" placeholder="e.g. Food">
        </div>
        <div class="form-actions">
          <button type="submit" id="add">Add Transaction</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div class="filter-group">
          <label for="filter">Filter by Category:</label>
          <select id="filter">
            <option value="All">All</option>
          </select>
        </div>
        <div class="csv-actions">
          <label for="import" class="file-label">
            Import CSV
            <input type="file" id="import" accept=".csv,text/csv">
          </label>
          <button type="button" id="export">Export CSV</button>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="table-columns" aria-hidden="true">
          <span>Date</span>
          <span>Description</span>
          <span>Category</span>
          <span>Amount</span>
          <span>Action</span>
        </div>
        <table id="list"></table>
      </div>
    </section>

    <section class="panel">
      <h2>Expenses by Category</h2>
      <div class="chart-container">
        <canvas id="chart" width="600" height="300"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
