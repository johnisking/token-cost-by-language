<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック崩し (Breakout)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .game-container {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      max-width: 100%;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 16px;
      background: #0f172a;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid #334155;
    }
    .hud-item span {
      color: #38bdf8;
      margin-left: 6px;
    }
    .lives-hearts {
      color: #f43f5e !important;
      letter-spacing: 2px;
    }
    .canvas-wrapper {
      position: relative;
      width: 640px;
      height: 480px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #475569;
      background: #090d16;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.2s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .overlay h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #38bdf8;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.4);
    }
    .overlay p {
      font-size: 1.05rem;
      color: #cbd5e1;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
    }
    .btn:active {
      transform: translateY(0);
    }
    .controls-hint {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="hud-item">SCORE: <span id="scoreEl">0</span></div>
      <div class="hud-item">LEVEL: <span id="levelEl">1 / 2</span></div>
      <div class="hud-item">LIVES: <span id="livesEl" class="lives-hearts">♥♥♥</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="640" height="480"></canvas>
      <div id="overlay" class="overlay">
        <h1 id="overlayTitle">ブロック崩し</h1>
        <p id="overlayMessage">
          マウス移動 または 左右キー (← → / A D) でパドルを操作<br>
          全2ステージクリアを目指そう！
        </p>
        <button id="actionBtn" class="btn">ゲーム開始 (Space / Click)</button>
      </div>
    </div>

    <div class="controls-hint">
      操作方法: マウス移動 / キーボード [←][→] または [A][D] ｜ 発射・再開: [Space] または クリック
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMessage = document.getElementById('overlayMessage');
    const actionBtn = document.getElementById('actionBtn');

    const MAX_LEVEL = 2;
    const INITIAL_LIVES = 3;

    let score = 0;
    let lives = INITIAL_LIVES;
    let currentLevel = 1;
    let gameState = 'START'; // START, SERVE, PLAYING, LEVEL_CLEAR, GAMEOVER, VICTORY

    // パドル設定
    const paddle = {
      width: 104,
      height: 14,
      x: (canvas.width - 104) / 2,
      y: canvas.height - 32,
      speed: 8,
      dx: 0
    };

    // ボール設定
    const ball = {
      x: canvas.width / 2,
      y: paddle.y - 8,
      radius: 8,
      baseSpeed: 5.5,
      dx: 0,
      dy: 0
    };

    // キー入力管理
    const keys = {
      left: false,
      right: false
    };

    // ブロック配列とパーティクル
    let bricks = [];
    let particles = [];

    const BRICK_COLORS = [
      '#f43f5e', // 赤
      '#f97316', // オレンジ
      '#eab308', // 黄
      '#22c55e', // 緑
      '#38bdf8', // 水色
      '#a855f7'  // 紫
    ];

    // レベルごとのブロック配置作成
    function createBricks(level) {
      bricks = [];
      const cols = 9;
      const padding = 8;
      const offsetTop = 55;
      const offsetLeft = 28;
      const brickWidth = (canvas.width - offsetLeft * 2 - padding * (cols - 1)) / cols;
      const brickHeight = 22;

      if (level === 1) {
        // レベル1: 標準的な4段構成（1発で壊れる）
        const rows = 4;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            bricks.push({
              x: offsetLeft + c * (brickWidth + padding),
              y: offsetTop + r * (brickHeight + padding),
              width: brickWidth,
              height: brickHeight,
              hp: 1,
              maxHp: 1,
              color: BRICK_COLORS[r % BRICK_COLORS.length],
              points: (rows - r) * 10
            });
          }
        }
      } else if (level === 2) {
        // レベル2: 6段のダイヤ・要塞パターン（2発必要な硬いブロックを含む）
        const layout = [
          [2, 1, 1, 2, 2, 2, 1, 1, 2],
          [1, 2, 1, 1, 2, 1, 1, 2, 1],
          [1, 1, 2, 1, 1, 1, 2, 1, 1],
          [0, 1, 1, 2, 1, 2, 1, 1, 0],
          [1, 1, 1, 1, 2, 1, 1, 1, 1],
          [1, 0, 1, 1, 1, 1, 1, 0, 1]
        ];
        for (let r = 0; r < layout.length; r++) {
          for (let c = 0; c < cols; c++) {
            const hp = layout[r][c];
            if (hp > 0) {
              bricks.push({
                x: offsetLeft + c * (brickWidth + padding),
                y: offsetTop + r * (brickHeight + padding),
                width: brickWidth,
                height: brickHeight,
                hp: hp,
                maxHp: hp,
                color: BRICK_COLORS[r % BRICK_COLORS.length],
                points: hp * 20
              });
            }
          }
        }
      }
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color,
          size: 3 + Math.random() * 3
        });
      }
    }

    function updateHUD() {
      scoreEl.textContent = score;
      levelEl.textContent = `${currentLevel} / ${MAX_LEVEL}`;
      livesEl.textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, INITIAL_LIVES - lives));
    }

    function resetBallAndPaddle() {
      paddle.width = currentLevel === 1 ? 108 : 92;
      paddle.x = (canvas.width - paddle.width) / 2;
      ball.baseSpeed = currentLevel === 1 ? 5.5 : 6.6;
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius - 1;
      ball.dx = 0;
      ball.dy = 0;
    }

    function launchBall() {
      const spread = (Math.random() * 0.6 - 0.3); // 少しランダムな角度で発射
      ball.dx = ball.baseSpeed * Math.sin(spread);
      ball.dy = -ball.baseSpeed * Math.cos(spread);
      gameState = 'PLAYING';
    }

    function showOverlay(title, message, btnText) {
      overlayTitle.textContent = title;
      overlayMessage.innerHTML = message;
      actionBtn.textContent = btnText;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function startNewGame() {
      score = 0;
      lives = INITIAL_LIVES;
      currentLevel = 1;
      createBricks(currentLevel);
      resetBallAndPaddle();
      updateHUD();
      hideOverlay();
      launchBall();
    }

    function startNextLevel() {
      currentLevel++;
      createBricks(currentLevel);
      resetBallAndPaddle();
      updateHUD();
      hideOverlay();
      launchBall();
    }

    function handleAction() {
      if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        startNewGame();
      } else if (gameState === 'LEVEL_CLEAR') {
        startNextLevel();
      } else if (gameState === 'SERVE') {
        hideOverlay();
        launchBall();
      }
    }

    // イベントリスナー（キーボード）
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (gameState !== 'PLAYING') {
          handleAction();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = false;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = false;
      }
    });

    // イベントリスナー（マウス移動）
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width / 2));
      if (gameState === 'SERVE') {
        ball.x = paddle.x + paddle.width / 2;
      }
    });

    canvas.addEventListener('click', () => {
      if (gameState === 'SERVE') {
        launchBall();
      }
    });

    actionBtn.addEventListener('click', () => {
      handleAction();
    });

    // ゲーム更新処理
    function update() {
      // パドルのキーボード移動
      if (keys.left) {
        paddle.x = Math.max(0, paddle.x - paddle.speed);
      }
      if (keys.right) {
        paddle.x = Math.min(canvas.width - paddle.width, paddle.x + paddle.speed);
      }

      if (gameState === 'SERVE') {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 1;
      }

      if (gameState === 'PLAYING') {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // 左右の壁との衝突
        if (ball.x - ball.radius < 0) {
          ball.x = ball.radius;
          ball.dx = Math.abs(ball.dx);
        } else if (ball.x + ball.radius > canvas.width) {
          ball.x = canvas.width - ball.radius;
          ball.dx = -Math.abs(ball.dx);
        }

        // 天井との衝突
        if (ball.y - ball.radius < 0) {
          ball.y = ball.radius;
          ball.dy = Math.abs(ball.dy);
        }

        // パドルとの衝突判定
        if (
          ball.dy > 0 &&
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x + ball.radius >= paddle.x &&
          ball.x - ball.radius <= paddle.x + paddle.width
        ) {
          const hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const clampedHit = Math.max(-0.9, Math.min(0.9, hitPos));
          const maxBounceAngle = Math.PI / 3; // 60度
          const bounceAngle = clampedHit * maxBounceAngle;

          ball.dx = ball.baseSpeed * Math.sin(bounceAngle);
          ball.dy = -ball.baseSpeed * Math.cos(bounceAngle);
          ball.y = paddle.y - ball.radius - 1;
        }

        // ブロックとの衝突判定
        for (let i = 0; i < bricks.length; i++) {
          const b = bricks[i];
          if (b.hp <= 0) continue;

          const closestX = Math.max(b.x, Math.min(ball.x, b.x + b.width));
          const closestY = Math.max(b.y, Math.min(ball.y, b.y + b.height));
          const distX = ball.x - closestX;
          const distY = ball.y - closestY;

          if (distX * distX + distY * distY <= ball.radius * ball.radius) {
            // 反射方向の決定
            const overlapLeft = (ball.x + ball.radius) - b.x;
            const overlapRight = (b.x + b.width) - (ball.x - ball.radius);
            const overlapTop = (ball.y + ball.radius) - b.y;
            const overlapBottom = (b.y + b.height) - (ball.y - ball.radius);
            const minOverlapX = Math.min(overlapLeft, overlapRight);
            const minOverlapY = Math.min(overlapTop, overlapBottom);

            if (minOverlapX < minOverlapY) {
              ball.dx = -ball.dx;
            } else {
              ball.dy = -ball.dy;
            }

            b.hp--;
            if (b.hp <= 0) {
              score += b.points;
              spawnParticles(b.x + b.width / 2, b.y + b.height / 2, b.color);
            } else {
              score += 5;
              spawnParticles(ball.x, ball.y, '#e2e8f0');
            }
            updateHUD();
            break;
          }
        }

        // ステージクリア判定
        const remainingBricks = bricks.some(b => b.hp > 0);
        if (!remainingBricks) {
          if (currentLevel < MAX_LEVEL) {
            gameState = 'LEVEL_CLEAR';
            showOverlay(
              `LEVEL ${currentLevel} CLEAR!`,
              `ステージ ${currentLevel} を突破しました！<br>次は最終ステージ（LEVEL 2）です。硬いシルバーブロック（2回ヒットで破壊）が登場します！`,
              '次のレベルへ (Space / Click)'
            );
          } else {
            gameState = 'VICTORY';
            showOverlay(
              'CONGRATULATIONS!',
              `全 ${MAX_LEVEL} レベルを完全クリアしました！<br>最終スコア: <strong>${score}</strong>`,
              'もう一度遊ぶ (Space / Click)'
            );
          }
        }

        // 画面下へ落下したとき
        if (ball.y - ball.radius > canvas.height) {
          lives--;
          updateHUD();
          if (lives <= 0) {
            gameState = 'GAMEOVER';
            showOverlay(
              'GAME OVER',
              `ライフがなくなりました。<br>最終スコア: <strong>${score}</strong>`,
              'リトライ (Space / Click)'
            );
          } else {
            gameState = 'SERVE';
            resetBallAndPaddle();
          }
        }
      }

      // パーティクル更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // 描画処理
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景グリッド装飾
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.22)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // ブロック描画
      for (const b of bricks) {
        if (b.hp <= 0) continue;

        ctx.save();
        // HP2の硬いブロックはメタリックな枠線と光沢を付与
        ctx.fillStyle = b.hp === 2 ? '#94a3b8' : b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.width, b.height, 5);
        ctx.fill();

        // ハイライト
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.beginPath();
        ctx.roundRect(b.x + 2, b.y + 2, b.width - 4, b.height / 2 - 2, 3);
        ctx.fill();

        if (b.hp === 2) {
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(b.x + 1, b.y + 1, b.width - 2, b.height - 2);
        }
        ctx.restore();
      }

      // パドル描画
      ctx.save();
      const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      paddleGrad.addColorStop(0, '#38bdf8');
      paddleGrad.addColorStop(1, '#0284c7');
      ctx.fillStyle = paddleGrad;
      ctx.shadowColor = 'rgba(56, 189, 248, 0.5)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
      ctx.fill();
      ctx.restore();

      // ボール描画
      ctx.save();
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // サーブ待機中のガイド表示
      if (gameState === 'SERVE') {
        ctx.save();
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('クリック または Space キーでボール発射', canvas.width / 2, canvas.height / 2 + 40);
        ctx.restore();
      }

      // パーティクル描画
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // 初期化してループ開始
    createBricks(currentLevel);
    resetBallAndPaddle();
    updateHUD();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
