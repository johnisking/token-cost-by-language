<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Арканоїд</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-wrapper {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-width: 840px;
      width: 100%;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 10px 18px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .hud-item span {
      color: #38bdf8;
      font-weight: 700;
      margin-left: 6px;
    }

    .lives-hearts {
      color: #f43f5e !important;
      letter-spacing: 3px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #090d16;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
    }

    .controls-hint {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .controls-hint kbd {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.85rem;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="hud">
      <div class="hud-item">Рахунок: <span id="scoreEl">0</span></div>
      <div class="hud-item">Рівень: <span id="levelEl">1 / 2</span></div>
      <div class="hud-item">Життя: <span id="livesEl" class="lives-hearts">♥♥♥</span></div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <div class="controls-hint">
      Керування: <strong>Миша</strong> або клавіші <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> &nbsp;|&nbsp;
      Запуск м'яча / Старт: <strong>Клік мишею</strong> або <kbd>Пробіл</kbd>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');

    const W = canvas.width;
    const H = canvas.height;

    const MAX_LEVEL = 2;
    const INITIAL_LIVES = 3;

    let score = 0;
    let lives = INITIAL_LIVES;
    let level = 1;
    // States: 'START', 'PLAYING', 'LEVEL_CLEAR', 'WIN', 'GAME_OVER'
    let gameState = 'START';
    let ballOnPaddle = true;

    const paddle = {
      width: 120,
      height: 16,
      x: (W - 120) / 2,
      y: H - 40,
      speed: 8,
      dx: 0
    };

    const ball = {
      x: W / 2,
      y: H - 50,
      radius: 8,
      baseSpeed: 6,
      dx: 4,
      dy: -4
    };

    const keys = {
      left: false,
      right: false
    };

    let bricks = [];
    let particles = [];

    const COLORS = [
      '#f43f5e', // rose
      '#fb923c', // orange
      '#facc15', // yellow
      '#4ade80', // green
      '#38bdf8', // sky
      '#a855f7'  // purple
    ];

    function buildLevel(lvl) {
      bricks = [];
      const padding = 8;
      const offsetTop = 65;
      const offsetLeft = 44;

      if (lvl === 1) {
        // Level 1: Classic 5 rows x 9 columns, 1 hit each, with a clean pattern
        const rows = 5;
        const cols = 9;
        const brickW = (W - offsetLeft * 2 - padding * (cols - 1)) / cols;
        const brickH = 24;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            bricks.push({
              x: offsetLeft + c * (brickW + padding),
              y: offsetTop + r * (brickH + padding),
              w: brickW,
              h: brickH,
              hp: 1,
              maxHp: 1,
              color: COLORS[r % COLORS.length],
              points: (rows - r) * 10
            });
          }
        }
      } else if (lvl === 2) {
        // Level 2: Fortress / Diamond pattern with 2-hit armored bricks and higher speed
        const rows = 7;
        const cols = 10;
        const brickW = (W - offsetLeft * 2 - padding * (cols - 1)) / cols;
        const brickH = 22;

        const layout = [
          [2, 2, 1, 1, 2, 2, 1, 1, 2, 2],
          [2, 1, 1, 2, 2, 2, 2, 1, 1, 2],
          [1, 1, 2, 0, 1, 1, 0, 2, 1, 1],
          [1, 2, 2, 1, 2, 2, 1, 2, 2, 1],
          [1, 1, 2, 0, 1, 1, 0, 2, 1, 1],
          [2, 1, 1, 2, 1, 1, 2, 1, 1, 2],
          [1, 1, 1, 1, 2, 2, 1, 1, 1, 1]
        ];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const hp = layout[r][c];
            if (hp > 0) {
              bricks.push({
                x: offsetLeft + c * (brickW + padding),
                y: offsetTop + r * (brickH + padding),
                w: brickW,
                h: brickH,
                hp: hp,
                maxHp: hp,
                color: COLORS[(r + c) % COLORS.length],
                points: hp * 20
              });
            }
          }
        }
      }
    }

    function updateHUD() {
      scoreEl.textContent = score;
      levelEl.textContent = `${level} / ${MAX_LEVEL}`;
      livesEl.textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, INITIAL_LIVES - lives));
    }

    function resetBallAndPaddle() {
      paddle.width = level === 1 ? 125 : 105;
      paddle.x = (W - paddle.width) / 2;
      ballOnPaddle = true;
      ball.baseSpeed = level === 1 ? 6 : 7.2;
      placeBallOnPaddle();
    }

    function placeBallOnPaddle() {
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius - 1;
      const angle = (Math.random() * 0.5 - 0.25); // slight random launch angle
      ball.dx = ball.baseSpeed * Math.sin(angle);
      ball.dy = -ball.baseSpeed * Math.cos(angle);
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function startNewGame() {
      score = 0;
      lives = INITIAL_LIVES;
      level = 1;
      buildLevel(level);
      resetBallAndPaddle();
      updateHUD();
      gameState = 'PLAYING';
    }

    function startNextLevel() {
      level++;
      buildLevel(level);
      resetBallAndPaddle();
      updateHUD();
      gameState = 'PLAYING';
    }

    function handleAction() {
      if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'WIN') {
        startNewGame();
        ballOnPaddle = false;
      } else if (gameState === 'LEVEL_CLEAR') {
        startNextLevel();
        ballOnPaddle = false;
      } else if (gameState === 'PLAYING' && ballOnPaddle) {
        ballOnPaddle = false;
      }
    }

    // Input listeners
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = true;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = true;
      } else if (e.code === 'Space') {
        e.preventDefault();
        handleAction();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = false;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = false;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(W - paddle.width, mouseX - paddle.width / 2));
      if (ballOnPaddle) {
        ball.x = paddle.x + paddle.width / 2;
      }
    });

    canvas.addEventListener('mousedown', () => {
      handleAction();
    });

    function update() {
      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      if (gameState !== 'PLAYING') return;

      // Keyboard paddle movement
      if (keys.left) {
        paddle.x = Math.max(0, paddle.x - paddle.speed);
      }
      if (keys.right) {
        paddle.x = Math.min(W - paddle.width, paddle.x + paddle.speed);
      }

      if (ballOnPaddle) {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 1;
        return;
      }

      // Move ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall collisions
      if (ball.x - ball.radius <= 0) {
        ball.x = ball.radius;
        ball.dx = Math.abs(ball.dx);
      } else if (ball.x + ball.radius >= W) {
        ball.x = W - ball.radius;
        ball.dx = -Math.abs(ball.dx);
      }

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.dy = Math.abs(ball.dy);
      }

      // Paddle collision
      if (
        ball.dy > 0 &&
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x + ball.radius >= paddle.x &&
        ball.x - ball.radius <= paddle.x + paddle.width
      ) {
        const hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        const clampedHit = Math.max(-0.9, Math.min(0.9, hitPos));
        const maxBounceAngle = (65 * Math.PI) / 180;
        const bounceAngle = clampedHit * maxBounceAngle;

        const speed = Math.min(10, Math.hypot(ball.dx, ball.dy) * 1.01);
        ball.dx = speed * Math.sin(bounceAngle);
        ball.dy = -Math.abs(speed * Math.cos(bounceAngle));
        ball.y = paddle.y - ball.radius - 1;
      }

      // Brick collisions
      for (let i = 0; i < bricks.length; i++) {
        const b = bricks[i];
        if (b.hp <= 0) continue;

        const closestX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
        const closestY = Math.max(b.y, Math.min(ball.y, b.y + b.h));
        const distX = ball.x - closestX;
        const distY = ball.y - closestY;

        if (distX * distX + distY * distY <= ball.radius * ball.radius) {
          // Determine bounce axis
          const overlapLeft = (ball.x + ball.radius) - b.x;
          const overlapRight = (b.x + b.w) - (ball.x - ball.radius);
          const overlapTop = (ball.y + ball.radius) - b.y;
          const overlapBottom = (b.y + b.h) - (ball.y - ball.radius);

          const minOverlapX = Math.min(overlapLeft, overlapRight);
          const minOverlapY = Math.min(overlapTop, overlapBottom);

          if (minOverlapX < minOverlapY) {
            ball.dx = -ball.dx;
          } else {
            ball.dy = -ball.dy;
          }

          b.hp--;
          if (b.hp <= 0) {
            score += b.points;
            spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
          } else {
            score += 5;
            spawnParticles(ball.x, ball.y, '#e2e8f0');
          }
          updateHUD();
          break;
        }
      }

      // Check level completion
      const remainingBricks = bricks.some((b) => b.hp > 0);
      if (!remainingBricks) {
        if (level < MAX_LEVEL) {
          gameState = 'LEVEL_CLEAR';
        } else {
          gameState = 'WIN';
        }
        return;
      }

      // Bottom out (lose life)
      if (ball.y - ball.radius > H) {
        lives--;
        updateHUD();
        if (lives <= 0) {
          gameState = 'GAME_OVER';
        } else {
          resetBallAndPaddle();
        }
      }
    }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawOverlay(title, subtitle, actionText, accentColor = '#38bdf8') {
      ctx.fillStyle = 'rgba(9, 13, 22, 0.78)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.fillStyle = accentColor;
      ctx.font = 'bold 44px "Segoe UI", sans-serif';
      ctx.fillText(title, W / 2, H / 2 - 40);

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '20px "Segoe UI", sans-serif';
      ctx.fillText(subtitle, W / 2, H / 2 + 10);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '18px "Segoe UI", sans-serif';
      ctx.fillText(actionText, W / 2, H / 2 + 55);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Subtle background grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Draw bricks
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        ctx.save();
        drawRoundedRect(b.x, b.y, b.w, b.h, 5);
        ctx.fillStyle = b.color;
        ctx.fill();

        // Armored brick border if hp === 2
        if (b.hp === 2) {
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fillRect(b.x + 4, b.y + 4, b.w - 8, 5);
        } else if (b.maxHp === 2 && b.hp === 1) {
          // Cracked look for damaged armored brick
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.6)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.3, b.y);
          ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.6);
          ctx.lineTo(b.x + b.w * 0.6, b.y + b.h);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Draw particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
      }

      // Draw paddle
      ctx.save();
      const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(1, '#0284c7');
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(56, 189, 248, 0.5)';
      ctx.shadowBlur = 12;
      drawRoundedRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
      ctx.fill();
      ctx.restore();

      // Draw ball
      ctx.save();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();

      // Hint when ball is on paddle during play
      if (gameState === 'PLAYING' && ballOnPaddle) {
        ctx.fillStyle = 'rgba(226, 232, 240, 0.8)';
        ctx.font = '18px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Натисніть ПРОБІЛ або клікніть мишею, щоб запустити м\'яч', W / 2, H - 90);
      }

      // Overlays
      if (gameState === 'START') {
        drawOverlay(
          'АРКАНОЇД',
          'Розбийте всі цеглинки на 2 рівнях!',
          'Клікніть мишею або натисніть ПРОБІЛ для старту',
          '#38bdf8'
        );
      } else if (gameState === 'LEVEL_CLEAR') {
        drawOverlay(
          'РІВЕНЬ 1 ПРОЙДЕНО!',
          `Поточний рахунок: ${score}`,
          'Клікніть або натисніть ПРОБІЛ, щоб перейти на Рівень 2',
          '#4ade80'
        );
      } else if (gameState === 'WIN') {
        drawOverlay(
          'ПЕРЕМОГА!',
          `Ви пройшли всі рівні! Фінальний рахунок: ${score}`,
          'Клікніть або натисніть ПРОБІЛ, щоб зіграти знову',
          '#facc15'
        );
      } else if (gameState === 'GAME_OVER') {
        drawOverlay(
          'ГРУ ЗАКІНЧЕНО',
          `Ваш рахунок: ${score}`,
          'Клікніть або натисніть ПРОБІЛ, щоб спробувати ще раз',
          '#f43f5e'
        );
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Initialize initial preview state
    buildLevel(1);
    resetBallAndPaddle();
    updateHUD();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
