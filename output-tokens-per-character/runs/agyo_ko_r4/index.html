<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at top, #1d2240, #0a0c18);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #cfd6ff;
  }
  canvas {
    width: min(800px, 96vw); aspect-ratio: 4 / 3;
    border: 2px solid #3a4280; border-radius: 8px;
    box-shadow: 0 0 30px rgba(90, 110, 255, .35);
    background: #0d1022; cursor: none;
  }
  p { margin: 10px 0 0; font-size: 14px; opacity: .75; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>이동: ← → / A D 키 또는 마우스 &nbsp;|&nbsp; 발사·진행: Space / Enter / 클릭 &nbsp;|&nbsp; 일시정지: P</p>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ----- 레벨 정의 ('.' = 빈칸, 숫자 = 내구도) -----
  const LEVELS = [
    { speed: 340, rows: [
      '1111111111',
      '1111111111',
      '1111111111',
      '1111111111',
      '1111111111',
    ]},
    { speed: 410, rows: [
      '2222222222',
      '2111111112',
      '21.2222.12',
      '2111111112',
      '1.1.11.1.1',
      '2222222222',
    ]},
  ];

  const COLS = 10, MARGIN = 35, GAP = 6, TOP = 70, BH = 22;
  const BW = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
  const ROW_COLORS = ['#ff5d73', '#ff9f43', '#feca57', '#1dd1a1', '#48dbfb', '#a29bfe'];

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 560 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, speed: 0, stuck: true };

  let state = 'title'; // title | playing | paused | levelclear | gameover | win
  let score = 0, lives = 3, level = 0, bricks = [];
  const keys = {};

  function buildLevel(i) {
    bricks = [];
    LEVELS[i].rows.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hits = parseInt(ch, 10);
        bricks.push({
          x: MARGIN + c * (BW + GAP), y: TOP + r * (BH + GAP),
          hits, maxHits: hits, color: ROW_COLORS[r % ROW_COLORS.length],
        });
      });
    });
    ball.speed = LEVELS[i].speed;
    resetBall();
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = ball.vy = 0;
    paddle.x = W / 2 - paddle.w / 2;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    const angle = (Math.random() * 40 - 20) * Math.PI / 180;
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    ball.stuck = false;
  }

  function startGame() {
    score = 0; lives = 3; level = 0;
    buildLevel(level);
    state = 'playing';
  }

  function action() {
    switch (state) {
      case 'title': startGame(); break;
      case 'playing': if (ball.stuck) launch(); break;
      case 'paused': state = 'playing'; break;
      case 'levelclear': level++; buildLevel(level); state = 'playing'; break;
      case 'gameover':
      case 'win': startGame(); break;
    }
  }

  // ----- 입력 -----
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowleft', 'arrowright', ' ', 'enter'].includes(k)) e.preventDefault();
    keys[k] = true;
    if (k === ' ' || k === 'enter') { if (!e.repeat) action(); }
    if (k === 'p') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function pointerToX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener('mousemove', e => {
    if (state !== 'playing') return;
    paddle.x = pointerToX(e.clientX) - paddle.w / 2;
    clampPaddle();
  });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); action(); });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (state !== 'playing') return;
    paddle.x = pointerToX(e.touches[0].clientX) - paddle.w / 2;
    clampPaddle();
  }, { passive: false });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); action(); }, { passive: false });

  function clampPaddle() {
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  // ----- 업데이트 -----
  function update(dt) {
    if (state !== 'playing') return;

    let dir = 0;
    if (keys['arrowleft'] || keys['a']) dir -= 1;
    if (keys['arrowright'] || keys['d']) dir += 1;
    paddle.x += dir * paddle.speed * dt;
    clampPaddle();

    if (ball.stuck) { stickBall(); return; }

    // 터널링 방지를 위한 분할 이동
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / 4));
    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx * dt / steps;
      ball.y += ball.vy * dt / steps;
      if (stepCollisions()) break;
    }
  }

  // 반환값 true = 이번 프레임 이동 중단
  function stepCollisions() {
    // 벽
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // 바닥 - 목숨 감소
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) state = 'gameover';
      else resetBall();
      return true;
    }

    // 패들
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x && ball.x - ball.r <= paddle.x + paddle.w) {
      const t = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
      const angle = t * 60 * Math.PI / 180;
      ball.speed = Math.min(ball.speed * 1.015, LEVELS[level].speed * 1.5);
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // 벽돌
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BW));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      const ox = (BW / 2 + ball.r) - Math.abs(ball.x - (b.x + BW / 2));
      const oy = (BH / 2 + ball.r) - Math.abs(ball.y - (b.y + BH / 2));
      if (ox < oy) {
        ball.vx = ball.x < b.x + BW / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + BH / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hits--;
      if (b.hits <= 0) {
        score += 10 * b.maxHits;
        bricks.splice(i, 1);
      } else {
        score += 5;
      }

      if (bricks.length === 0) {
        state = level < LEVELS.length - 1 ? 'levelclear' : 'win';
        return true;
      }
      break;
    }
    return false;
  }

  // ----- 그리기 -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHeart(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.3);
    ctx.bezierCurveTo(x - s / 2, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s / 2, y + s * 0.6, x + s / 2, y + s * 0.3);
    ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.3);
    ctx.fill();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, 44);
    ctx.font = 'bold 20px "Segoe UI", "Malgun Gothic", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8ecff';
    ctx.textAlign = 'left';
    ctx.fillText(`점수: ${score}`, 20, 22);
    ctx.textAlign = 'center';
    ctx.fillText(`레벨 ${level + 1} / ${LEVELS.length}`, W / 2, 22);
    ctx.textAlign = 'right';
    ctx.fillText('목숨', W - 100, 22);
    for (let i = 0; i < 3; i++) {
      drawHeart(W - 80 + i * 26, 13, 18, i < lives ? '#ff4d6d' : '#3a3f5c');
    }
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = 'rgba(5, 7, 20, 0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 52px "Segoe UI", "Malgun Gothic", sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 50);
    ctx.font = '22px "Segoe UI", "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#c8d0ff';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 15 + i * 34));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 벽돌
    for (const b of bricks) {
      ctx.globalAlpha = b.hits < b.maxHits ? 0.55 : 1;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, BW, BH, 4);
      ctx.fill();
      if (b.maxHits > 1) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x + 3, b.y + 3, BW - 6, 4);
    }

    // 패들
    const grad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    grad.addColorStop(0, '#9fb4ff');
    grad.addColorStop(1, '#4b5fd6');
    ctx.fillStyle = grad;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // 공
    if (state !== 'title') {
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#9fb4ff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    drawHUD();

    if (state === 'playing' && ball.stuck) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#c8d0ff';
      ctx.font = '20px "Segoe UI", "Malgun Gothic", sans-serif';
      ctx.fillText('Space 또는 클릭으로 공 발사', W / 2, H / 2 + 80);
    }

    switch (state) {
      case 'title':
        drawOverlay('벽돌깨기', ['키보드(← → / A D) 또는 마우스로 패들 이동', 'Space / Enter / 클릭으로 시작']);
        break;
      case 'paused':
        drawOverlay('일시정지', ['P 키 또는 클릭으로 계속하기']);
        break;
      case 'levelclear':
        drawOverlay(`레벨 ${level + 1} 클리어!`, [`현재 점수: ${score}`, 'Space / 클릭으로 다음 레벨']);
        break;
      case 'gameover':
        drawOverlay('게임 오버', [`최종 점수: ${score}`, 'Space / 클릭으로 다시 시작']);
        break;
      case 'win':
        drawOverlay('모든 레벨 클리어! 🎉', [`최종 점수: ${score}  (남은 목숨 ${lives})`, 'Space / 클릭으로 다시 시작']);
        break;
    }
  }

  // ----- 메인 루프 -----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
