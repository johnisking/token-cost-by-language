<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; border: 2px solid #444; cursor: none; max-width: 100vw; }
  p { margin: 8px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<p>←/→ 또는 A/D, 마우스로 이동 · 스페이스/클릭으로 발사 · P로 일시정지</p>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const LEVELS = [
    // 레벨 1: 5줄 가득
    [
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111"
    ],
    // 레벨 2: 패턴 + 단단한 벽돌(2번 맞아야 깨짐)
    [
      "2222222222",
      "2111111112",
      "2101111012",
      "2111001112",
      "2101111012",
      "2222222222"
    ]
  ];
  const COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6'];

  const BRICK_COLS = 10, BRICK_W = 56, BRICK_H = 20, BRICK_GAP = 6;
  const BRICK_TOP = 50;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

  const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30, speed: 7 };
  const ball = { x: 0, y: 0, r: 7, dx: 0, dy: 0, speed: 5 };

  let bricks = [];
  let score = 0, lives = 3, level = 0;
  let state = 'ready'; // ready | playing | paused | levelclear | gameover | win
  const keys = {};

  function loadLevel(n) {
    bricks = [];
    LEVELS[n].forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            hp, maxHp: hp, color: COLORS[r % COLORS.length]
          });
        }
      });
    });
    ball.speed = 5 + n * 1;
    resetBall();
  }

  function resetBall() {
    paddle.x = W / 2 - paddle.w / 2;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.dx = 0; ball.dy = 0;
    state = 'ready';
  }

  function launch() {
    const angle = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
    ball.dx = ball.speed * Math.cos(angle);
    ball.dy = ball.speed * Math.sin(angle);
    state = 'playing';
  }

  function newGame() {
    score = 0; lives = 3; level = 0;
    loadLevel(level);
  }

  function action() {
    if (state === 'ready') launch();
    else if (state === 'levelclear') { level++; loadLevel(level); }
    else if (state === 'gameover' || state === 'win') newGame();
  }

  // 입력: 키보드
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
    if (e.key === 'p' || e.key === 'P') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  // 입력: 마우스
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = mx - paddle.w / 2;
    clampPaddle();
  });
  canvas.addEventListener('click', action);

  function clampPaddle() {
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function update() {
    if (state === 'paused' || state === 'gameover' || state === 'win' || state === 'levelclear') return;

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
    clampPaddle();

    if (state === 'ready') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    // 서브스텝으로 터널링 방지
    const steps = 2;
    for (let s = 0; s < steps; s++) {
      ball.x += ball.dx / steps;
      ball.y += ball.dy / steps;

      // 벽
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

      // 바닥
      if (ball.y - ball.r > H) {
        lives--;
        if (lives <= 0) { state = 'gameover'; } else { resetBall(); }
        return;
      }

      // 패들
      if (ball.dy > 0 &&
          ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
        const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
        ball.dx = ball.speed * Math.sin(angle);
        ball.dy = -ball.speed * Math.cos(angle);
        ball.y = paddle.y - ball.r;
      }

      // 벽돌
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
        const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
        const ddx = ball.x - cx, ddy = ball.y - cy;
        if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
          if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
          b.hp--;
          score += b.hp <= 0 ? 10 * b.maxHp : 5;
          break;
        }
      }
    }

    if (bricks.every(b => b.hp <= 0)) {
      state = (level >= LEVELS.length - 1) ? 'win' : 'levelclear';
      if (state === 'levelclear') score += lives * 50;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCenterText(lines) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H / 2 - 60, W, 120);
    ctx.textAlign = 'center';
    lines.forEach((l, i) => {
      ctx.font = i === 0 ? 'bold 32px sans-serif' : '18px sans-serif';
      ctx.fillStyle = i === 0 ? '#fff' : '#ccc';
      ctx.fillText(l, W / 2, H / 2 - 10 + i * 34);
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.font = '18px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('점수: ' + score, 12, 28);
    ctx.textAlign = 'center';
    ctx.fillText('레벨 ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 28);
    ctx.textAlign = 'right';
    ctx.fillText('목숨: ' + '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives)), W - 12, 28);

    // 벽돌
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.5 : 1;
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // 패들
    ctx.fillStyle = '#ecf0f1';
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();

    // 공
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    if (state === 'ready') drawCenterText(['레벨 ' + (level + 1), '스페이스 또는 클릭으로 발사']);
    else if (state === 'paused') drawCenterText(['일시정지', 'P를 눌러 계속']);
    else if (state === 'levelclear') drawCenterText(['레벨 클리어!', '스페이스 또는 클릭으로 다음 레벨']);
    else if (state === 'gameover') drawCenterText(['게임 오버', '최종 점수: ' + score + ' · 클릭으로 재시작']);
    else if (state === 'win') drawCenterText(['승리했습니다!', '최종 점수: ' + score + ' · 클릭으로 재시작']);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  loop();
})();
</script>
</body>
</html>
