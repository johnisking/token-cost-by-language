<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rompe Ladrillos - Breakout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-container {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      max-width: 760px;
      width: 100%;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 10px;
      margin-bottom: 14px;
      border: 1px solid #334155;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .hud-item span {
      color: #38bdf8;
      font-weight: 800;
      margin-left: 6px;
    }

    .hud-lives span {
      color: #f43f5e;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 700 / 500;
      background: #090d16;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #475569;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #38bdf8;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    .overlay p {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 22px;
      max-width: 440px;
      line-height: 1.5;
    }

    .btn {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
    }

    .controls-hint {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="hud-item">Puntos: <span id="scoreEl">0</span></div>
      <div class="hud-item">Nivel: <span id="levelEl">1 / 2</span></div>
      <div class="hud-item hud-lives">Vidas: <span id="livesEl">❤️❤️❤️</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="700" height="500"></canvas>
      <div id="overlay" class="overlay">
        <h1 id="overlayTitle">ROMPE LADRILLOS</h1>
        <p id="overlayMessage">Usa las flechas del teclado (◀ ▶ / A D) o el ratón para mover la pala. ¡Supera los 2 niveles!</p>
        <button id="actionBtn" class="btn">Jugar Ahora</button>
      </div>
    </div>

    <div class="controls-hint">
      Controles: <strong>Ratón</strong> o <strong>Teclado (⬅️ ➡️ / A D)</strong> · Espacio o Clic para lanzar la bola
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMessage = document.getElementById('overlayMessage');
    const actionBtn = document.getElementById('actionBtn');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    let score = 0;
    let lives = 3;
    let currentLevel = 1;
    const MAX_LEVEL = 2;

    let gameState = 'MENU'; // MENU, PLAYING, BALL_STICKY, LEVEL_CLEAR, GAME_OVER, VICTORY

    const paddle = {
      width: 110,
      height: 14,
      x: (WIDTH - 110) / 2,
      y: HEIGHT - 32,
      speed: 8,
      dx: 0
    };

    const ball = {
      x: WIDTH / 2,
      y: HEIGHT - 45,
      radius: 8,
      speed: 5.5,
      dx: 4,
      dy: -4
    };

    const keys = {
      left: false,
      right: false
    };

    let bricks = [];
    let particles = [];

    const BRICK_COLORS = [
      '#ef4444', // Rojo
      '#f97316', // Naranja
      '#eab308', // Amarillo
      '#22c55e', // Verde
      '#38bdf8', // Azul
      '#a855f7'  // Morado
    ];

    function createBricks(level) {
      bricks = [];
      const padding = 8;
      const offsetTop = 55;
      const offsetLeft = 35;
      const cols = 9;
      const brickWidth = (WIDTH - offsetLeft * 2 - padding * (cols - 1)) / cols;
      const brickHeight = 22;

      if (level === 1) {
        // Nivel 1: 4 filas clásicas de 1 golpe
        const rows = 4;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            bricks.push({
              x: offsetLeft + c * (brickWidth + padding),
              y: offsetTop + r * (brickHeight + padding),
              width: brickWidth,
              height: brickHeight,
              hp: 1,
              maxHp: 1,
              points: (rows - r) * 10,
              color: BRICK_COLORS[r % BRICK_COLORS.length]
            });
          }
        }
      } else if (level === 2) {
        // Nivel 2: Patrón piramidal/fortaleza con ladrillos reforzados (2 golpes)
        const rows = 6;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            // Huecos decorativos para hacer el nivel 2 más interesante
            if ((r === 1 || r === 4) && (c === 2 || c === 6)) continue;

            const isTough = r < 2 || (r === 3 && c % 2 === 0);
            const hp = isTough ? 2 : 1;
            bricks.push({
              x: offsetLeft + c * (brickWidth + padding),
              y: offsetTop + r * (brickHeight + padding),
              width: brickWidth,
              height: brickHeight,
              hp: hp,
              maxHp: hp,
              points: hp * 15,
              color: BRICK_COLORS[r % BRICK_COLORS.length]
            });
          }
        }
      }
    }

    function resetBallAndPaddle() {
      paddle.width = currentLevel === 1 ? 110 : 96;
      paddle.x = (WIDTH - paddle.width) / 2;
      ball.speed = currentLevel === 1 ? 5.5 : 6.5;
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius - 1;
      const angle = (Math.random() * 0.6 - 0.3); // ligero ángulo inicial
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
    }

    function updateHUD() {
      scoreEl.textContent = score;
      levelEl.textContent = `${currentLevel} / ${MAX_LEVEL}`;
      livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '0';
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x,
          y,
          dx: (Math.random() - 0.5) * 5,
          dy: (Math.random() - 0.5) * 5,
          radius: Math.random() * 3 + 1.5,
          alpha: 1,
          color
        });
      }
    }

    function startNewGame() {
      score = 0;
      lives = 3;
      currentLevel = 1;
      createBricks(currentLevel);
      resetBallAndPaddle();
      updateHUD();
      overlay.classList.add('hidden');
      gameState = 'BALL_STICKY';
    }

    function startNextLevel() {
      currentLevel++;
      createBricks(currentLevel);
      resetBallAndPaddle();
      updateHUD();
      overlay.classList.add('hidden');
      gameState = 'BALL_STICKY';
    }

    function launchBall() {
      if (gameState === 'BALL_STICKY') {
        gameState = 'PLAYING';
        if (Math.abs(ball.dx) < 1) {
          ball.dx = (Math.random() > 0.5 ? 1 : -1) * 2.5;
        }
      }
    }

    // Eventos de teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'BALL_STICKY') {
          launchBall();
        } else if (gameState !== 'PLAYING') {
          actionBtn.click();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = false;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = false;
      }
    });

    // Eventos de ratón
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(WIDTH - paddle.width, mouseX - paddle.width / 2));
      if (gameState === 'BALL_STICKY') {
        ball.x = paddle.x + paddle.width / 2;
      }
    });

    canvas.addEventListener('click', () => {
      if (gameState === 'BALL_STICKY') {
        launchBall();
      }
    });

    actionBtn.addEventListener('click', () => {
      if (gameState === 'LEVEL_CLEAR') {
        startNextLevel();
      } else {
        startNewGame();
      }
    });

    function showOverlay(title, message, btnText) {
      overlayTitle.textContent = title;
      overlayMessage.textContent = message;
      actionBtn.textContent = btnText;
      overlay.classList.remove('hidden');
    }

    function update() {
      // Movimiento con teclado
      if (keys.left) {
        paddle.x = Math.max(0, paddle.x - paddle.speed);
      }
      if (keys.right) {
        paddle.x = Math.min(WIDTH - paddle.width, paddle.x + paddle.speed);
      }

      if (gameState === 'BALL_STICKY') {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 1;
      } else if (gameState === 'PLAYING') {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Colisión con paredes laterales
        if (ball.x - ball.radius < 0) {
          ball.x = ball.radius;
          ball.dx = -ball.dx;
        } else if (ball.x + ball.radius > WIDTH) {
          ball.x = WIDTH - ball.radius;
          ball.dx = -ball.dx;
        }

        // Colisión con techo
        if (ball.y - ball.radius < 0) {
          ball.y = ball.radius;
          ball.dy = -ball.dy;
        }

        // Colisión con la pala
        if (
          ball.dy > 0 &&
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.width
        ) {
          const hitOffset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const maxBounceAngle = Math.PI / 3; // 60 grados
          const bounceAngle = hitOffset * maxBounceAngle;

          ball.dx = ball.speed * Math.sin(bounceAngle);
          ball.dy = -ball.speed * Math.cos(bounceAngle);
          ball.y = paddle.y - ball.radius - 1;
        }

        // Colisión con ladrillos
        for (let i = 0; i < bricks.length; i++) {
          const b = bricks[i];
          if (b.hp > 0) {
            if (
              ball.x + ball.radius > b.x &&
              ball.x - ball.radius < b.x + b.width &&
              ball.y + ball.radius > b.y &&
              ball.y - ball.radius < b.y + b.height
            ) {
              const overlapLeft = (ball.x + ball.radius) - b.x;
              const overlapRight = (b.x + b.width) - (ball.x - ball.radius);
              const overlapTop = (ball.y + ball.radius) - b.y;
              const overlapBottom = (b.y + b.height) - (ball.y - ball.radius);

              const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
              if (minOverlap === overlapLeft || minOverlap === overlapRight) {
                ball.dx = -ball.dx;
              } else {
                ball.dy = -ball.dy;
              }

              b.hp--;
              spawnParticles(ball.x, ball.y, b.color);

              if (b.hp === 0) {
                score += b.points;
              } else {
                score += 5;
              }
              updateHUD();
              break;
            }
          }
        }

        // Comprobar si se completó el nivel
        const remainingBricks = bricks.some((b) => b.hp > 0);
        if (!remainingBricks) {
          if (currentLevel < MAX_LEVEL) {
            gameState = 'LEVEL_CLEAR';
            showOverlay(
              '¡NIVEL 1 COMPLETADO!',
              `¡Excelente trabajo! Puntuación actual: ${score}. Prepárate para el Nivel 2 con ladrillos blindados.`,
              'Siguiente Nivel'
            );
          } else {
            gameState = 'VICTORY';
            showOverlay(
              '¡VICTORIA TOTAL! 🏆',
              `¡Has superado los 2 niveles con ${score} puntos y ${lives} vida(s) restante(s)!`,
              'Jugar de Nuevo'
            );
          }
        }

        // Pérdida de bola por el fondo
        if (ball.y - ball.radius > HEIGHT) {
          lives--;
          updateHUD();
          if (lives <= 0) {
            gameState = 'GAME_OVER';
            showOverlay(
              'FIN DEL JUEGO',
              `Te has quedado sin vidas en el Nivel ${currentLevel}. Puntuación final: ${score}.`,
              'Reintentar'
            );
          } else {
            resetBallAndPaddle();
            gameState = 'BALL_STICKY';
          }
        }
      }

      // Actualizar partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Dibujar ladrillos
      for (const b of bricks) {
        if (b.hp <= 0) continue;

        ctx.save();
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.width, b.height, 4);
        ctx.fill();

        // Borde brillante para ladrillos de 2 golpes
        if (b.hp === 2) {
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.fillRect(b.x + 4, b.y + 4, b.width - 8, 5);
        }
        ctx.restore();
      }

      // Dibujar pala
      ctx.save();
      const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(1, '#0284c7');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
      ctx.fill();
      ctx.restore();

      // Dibujar bola
      ctx.save();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();

      // Dibujar partículas
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Mensaje cuando la bola está lista para lanzarse
      if (gameState === 'BALL_STICKY') {
        ctx.save();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 15px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Haz clic o pulsa ESPACIO para lanzar la bola', WIDTH / 2, HEIGHT - 65);
        ctx.restore();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    createBricks(currentLevel);
    resetBallAndPaddle();
    updateHUD();
    loop();
  </script>
</body>
</html>
