<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rompe Ladrillos</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; border: 2px solid #444; cursor: none; max-width: 100vw; }
  p { margin: 8px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<canvas id="juego" width="640" height="480"></canvas>
<p>Ratón o ← → / A D para mover · Espacio o clic para lanzar · P para pausa</p>
<script>
const canvas = document.getElementById('juego');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const NIVELES = [
  [
    "1111111111",
    "2222222222",
    "3333333333",
    "4444444444"
  ],
  [
    "5555555555",
    "4.444444.4",
    "3333..3333",
    "2.22222.22",
    "1111111111",
    ".66666666."
  ]
];
const COLORES = { 1:'#e74c3c', 2:'#e67e22', 3:'#f1c40f', 4:'#2ecc71', 5:'#3498db', 6:'#9b59b6' };

const COLS = 10, BW = 58, BH = 20, GAP = 4, OFF_X = (W - (COLS * (BW + GAP) - GAP)) / 2, OFF_Y = 60;

const paleta = { w: 90, h: 12, x: W / 2 - 45, y: H - 30, vel: 7 };
const bola = { x: 0, y: 0, r: 7, dx: 0, dy: 0, pegada: true };
let ladrillos = [], puntos = 0, vidas = 3, nivel = 0, estado = 'inicio', pausa = false;
const teclas = {};

function cargarNivel(n) {
  ladrillos = [];
  NIVELES[n].forEach((fila, r) => {
    [...fila].forEach((c, col) => {
      if (c !== '.') {
        const tipo = +c;
        ladrillos.push({
          x: OFF_X + col * (BW + GAP), y: OFF_Y + r * (BH + GAP),
          color: COLORES[tipo], golpes: (n === 1 && tipo === 5) ? 2 : 1,
          valor: 10 * (NIVELES[n].length - r), vivo: true
        });
      }
    });
  });
  reiniciarBola();
}

function reiniciarBola() {
  bola.pegada = true;
  bola.dx = 0; bola.dy = 0;
  paleta.x = Math.max(0, Math.min(W - paleta.w, paleta.x));
}

function lanzar() {
  if (estado === 'inicio' || estado === 'fin' || estado === 'victoria') {
    puntos = 0; vidas = 3; nivel = 0; cargarNivel(0); estado = 'jugando'; return;
  }
  if (estado === 'nivelSuperado') {
    nivel++; cargarNivel(nivel); estado = 'jugando'; return;
  }
  if (estado === 'jugando' && bola.pegada && !pausa) {
    const vel = 5 + nivel * 1.2;
    const ang = (Math.random() * 0.6 - 0.3);
    bola.dx = vel * Math.sin(ang);
    bola.dy = -vel * Math.cos(ang);
    bola.pegada = false;
  }
}

document.addEventListener('keydown', e => {
  teclas[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); lanzar(); }
  if ((e.key === 'p' || e.key === 'P') && estado === 'jugando') pausa = !pausa;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
});
document.addEventListener('keyup', e => { teclas[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paleta.x = Math.max(0, Math.min(W - paleta.w, mx - paleta.w / 2));
});
canvas.addEventListener('click', lanzar);

function actualizar() {
  if (estado !== 'jugando' || pausa) return;

  if (teclas['ArrowLeft'] || teclas['a'] || teclas['A']) paleta.x -= paleta.vel;
  if (teclas['ArrowRight'] || teclas['d'] || teclas['D']) paleta.x += paleta.vel;
  paleta.x = Math.max(0, Math.min(W - paleta.w, paleta.x));

  if (bola.pegada) {
    bola.x = paleta.x + paleta.w / 2;
    bola.y = paleta.y - bola.r - 1;
    return;
  }

  // Subpasos para evitar atravesar ladrillos
  const pasos = Math.ceil(Math.max(Math.abs(bola.dx), Math.abs(bola.dy)) / 3);
  for (let i = 0; i < pasos; i++) {
    bola.x += bola.dx / pasos;
    bola.y += bola.dy / pasos;
    if (colisiones()) return;
  }
}

function colisiones() {
  // Paredes
  if (bola.x - bola.r < 0) { bola.x = bola.r; bola.dx = Math.abs(bola.dx); }
  if (bola.x + bola.r > W) { bola.x = W - bola.r; bola.dx = -Math.abs(bola.dx); }
  if (bola.y - bola.r < 0) { bola.y = bola.r; bola.dy = Math.abs(bola.dy); }

  // Suelo
  if (bola.y - bola.r > H) {
    vidas--;
    if (vidas <= 0) estado = 'fin';
    else reiniciarBola();
    return true;
  }

  // Paleta
  if (bola.dy > 0 && bola.y + bola.r >= paleta.y && bola.y + bola.r <= paleta.y + paleta.h + 6 &&
      bola.x >= paleta.x - bola.r && bola.x <= paleta.x + paleta.w + bola.r) {
    const rel = (bola.x - (paleta.x + paleta.w / 2)) / (paleta.w / 2);
    const ang = Math.max(-1, Math.min(1, rel)) * (Math.PI / 3);
    const vel = Math.hypot(bola.dx, bola.dy);
    bola.dx = vel * Math.sin(ang);
    bola.dy = -vel * Math.cos(ang);
    bola.y = paleta.y - bola.r;
  }

  // Ladrillos
  for (const l of ladrillos) {
    if (!l.vivo) continue;
    const cx = Math.max(l.x, Math.min(bola.x, l.x + BW));
    const cy = Math.max(l.y, Math.min(bola.y, l.y + BH));
    const ddx = bola.x - cx, ddy = bola.y - cy;
    if (ddx * ddx + ddy * ddy <= bola.r * bola.r) {
      const solX = Math.min(Math.abs(bola.x - l.x), Math.abs(bola.x - (l.x + BW)));
      const solY = Math.min(Math.abs(bola.y - l.y), Math.abs(bola.y - (l.y + BH)));
      if (bola.x > l.x && bola.x < l.x + BW) bola.dy = -bola.dy;
      else if (bola.y > l.y && bola.y < l.y + BH) bola.dx = -bola.dx;
      else if (solX < solY) bola.dx = -bola.dx;
      else bola.dy = -bola.dy;

      l.golpes--;
      if (l.golpes <= 0) {
        l.vivo = false;
        puntos += l.valor;
      } else {
        l.color = '#85c1e9';
        puntos += 5;
      }
      // Pequeño aumento de velocidad
      const f = 1.005;
      bola.dx *= f; bola.dy *= f;

      if (ladrillos.every(b => !b.vivo)) {
        estado = (nivel === NIVELES.length - 1) ? 'victoria' : 'nivelSuperado';
        puntos += vidas * 100;
      }
      return true;
    }
  }
  return false;
}

function rectRedondo(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function texto(t, y, size = 28, color = '#fff') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText(t, W / 2, y);
}

function dibujar() {
  ctx.clearRect(0, 0, W, H);

  // Marcador
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Puntos: ' + puntos, 12, 28);
  ctx.textAlign = 'center';
  ctx.fillText('Nivel ' + (nivel + 1) + ' / ' + NIVELES.length, W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('Vidas: ' + '♥'.repeat(Math.max(0, vidas)), W - 12, 28);
  ctx.fillStyle = '#333';
  ctx.fillRect(0, 40, W, 2);

  // Ladrillos
  for (const l of ladrillos) {
    if (!l.vivo) continue;
    ctx.fillStyle = l.color;
    rectRedondo(l.x, l.y, BW, BH, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(l.x + 3, l.y + 2, BW - 6, 4);
  }

  // Paleta
  ctx.fillStyle = '#ecf0f1';
  rectRedondo(paleta.x, paleta.y, paleta.w, paleta.h, 6);

  // Bola
  if (estado === 'jugando' || estado === 'nivelSuperado') {
    ctx.beginPath();
    ctx.arc(bola.x, bola.y, bola.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  // Mensajes
  if (estado === 'inicio') {
    texto('ROMPE LADRILLOS', H / 2 - 20, 40);
    texto('Pulsa ESPACIO o haz clic para empezar', H / 2 + 25, 18, '#aaa');
  } else if (estado === 'fin') {
    texto('FIN DEL JUEGO', H / 2 - 20, 40, '#e74c3c');
    texto('Puntuación: ' + puntos, H / 2 + 20, 22);
    texto('ESPACIO o clic para reiniciar', H / 2 + 55, 18, '#aaa');
  } else if (estado === 'victoria') {
    texto('¡HAS GANADO!', H / 2 - 20, 40, '#2ecc71');
    texto('Puntuación final: ' + puntos, H / 2 + 20, 22);
    texto('ESPACIO o clic para jugar de nuevo', H / 2 + 55, 18, '#aaa');
  } else if (estado === 'nivelSuperado') {
    texto('¡NIVEL ' + (nivel + 1) + ' SUPERADO!', H / 2 + 60, 34, '#f1c40f');
    texto('ESPACIO o clic para el nivel ' + (nivel + 2), H / 2 + 95, 18, '#aaa');
  } else if (pausa) {
    texto('PAUSA', H / 2 + 60, 40);
  } else if (bola.pegada) {
    texto('ESPACIO o clic para lanzar', H / 2 + 80, 18, '#aaa');
  }
}

function bucle() {
  actualizar();
  dibujar();
  requestAnimationFrame(bucle);
}

cargarNivel(0);
bucle();
</script>
</body>
</html>
