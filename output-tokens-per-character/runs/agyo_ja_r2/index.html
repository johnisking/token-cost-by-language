<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブロック崩し</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 12px 0 4px; font-size: 22px; }
  p { margin: 4px 0 10px; font-size: 13px; color: #aaa; }
  canvas { background: #000; border: 2px solid #444; cursor: none; }
</style>
</head>
<body>
<h1>ブロック崩し</h1>
<p>操作: ← → / A D キー または マウスでパドル移動 ・ スペース / クリックで発射・開始 ・ P で一時停止</p>
<canvas id="game" width="640" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  { rows: 4, cols: 10, speed: 4.5, colors: ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71'], hits: () => 1 },
  { rows: 6, cols: 10, speed: 5.5, colors: ['#9b59b6', '#3498db', '#1abc9c', '#2ecc71', '#f1c40f', '#e74c3c'],
    hits: (r, c) => (r < 2 ? 2 : 1), skip: (r, c) => (r === 3 && (c === 0 || c === 9)) }
];

const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30, speed: 8 };
const ball = { r: 7, x: 0, y: 0, dx: 0, dy: 0 };
let bricks = [];
let score = 0, lives = 3, level = 0;
let state = 'title'; // title, serve, play, paused, levelclear, gameover, win
const keys = {};

function buildLevel(n) {
  const L = LEVELS[n];
  bricks = [];
  const pad = 6, top = 50, side = 20;
  const bw = (W - side * 2 - pad * (L.cols - 1)) / L.cols, bh = 18;
  for (let r = 0; r < L.rows; r++) {
    for (let c = 0; c < L.cols; c++) {
      if (L.skip && L.skip(r, c)) continue;
      const hp = L.hits(r, c);
      bricks.push({ x: side + c * (bw + pad), y: top + r * (bh + pad), w: bw, h: bh, hp, maxHp: hp, color: L.colors[r % L.colors.length] });
    }
  }
}

function resetBall() {
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
  ball.dx = 0; ball.dy = 0;
  state = 'serve';
}

function launch() {
  const sp = LEVELS[level].speed;
  const ang = (Math.random() * 60 - 30) * Math.PI / 180;
  ball.dx = sp * Math.sin(ang);
  ball.dy = -sp * Math.cos(ang);
  state = 'play';
}

function startGame() {
  score = 0; lives = 3; level = 0;
  buildLevel(level);
  resetBall();
}

function action() {
  if (state === 'title' || state === 'gameover' || state === 'win') startGame();
  else if (state === 'serve') launch();
  else if (state === 'levelclear') { level++; buildLevel(level); resetBall(); }
}

// 入力
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
  if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});
canvas.addEventListener('click', action);

function update() {
  if (state === 'paused' || state === 'title' || state === 'gameover' || state === 'win' || state === 'levelclear') return;

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (state === 'serve') {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }

  // サブステップで貫通防止
  const steps = 2;
  for (let s = 0; s < steps; s++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // パドル
    if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const ang = Math.max(-1, Math.min(1, hit)) * 60 * Math.PI / 180;
      const sp = Math.hypot(ball.dx, ball.dy);
      ball.dx = sp * Math.sin(ang);
      ball.dy = -sp * Math.cos(ang);
      ball.y = paddle.y - ball.r - 1;
    }

    // ブロック
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
        b.hp--;
        score += b.hp <= 0 ? 100 * (level + 1) : 20;
        break;
      }
    }

    // 落下
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'gameover'; } else resetBall();
      return;
    }
  }

  if (bricks.every(b => b.hp <= 0)) {
    score += 500 * (level + 1);
    state = level + 1 < LEVELS.length ? 'levelclear' : 'win';
  }
}

function drawText(txt, y, size = 28, color = '#fff') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(txt, W / 2, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`スコア: ${score}`, 12, 26);
  ctx.textAlign = 'center';
  ctx.fillText(`レベル ${level + 1} / ${LEVELS.length}`, W / 2, 26);
  ctx.textAlign = 'right';
  ctx.fillText('ライフ: ' + '❤'.repeat(Math.max(0, lives)), W - 12, 26);

  // ブロック
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.globalAlpha = b.hp < b.maxHp ? 0.5 : 1;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    if (b.maxHp > 1 && b.hp === b.maxHp) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    }
    ctx.globalAlpha = 1;
  }

  // パドル
  ctx.fillStyle = '#ecf0f1';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // ボール
  if (state !== 'title') {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
  }

  // メッセージ
  const overlay = () => { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H); };
  if (state === 'title') {
    overlay();
    drawText('ブロック崩し', H / 2 - 30, 40);
    drawText('スペース / クリックでスタート', H / 2 + 20, 20, '#ccc');
  } else if (state === 'serve') {
    drawText('スペース / クリックで発射', H / 2 + 60, 18, '#ccc');
  } else if (state === 'paused') {
    overlay(); drawText('一時停止中 (P で再開)', H / 2);
  } else if (state === 'levelclear') {
    overlay();
    drawText(`レベル ${level + 1} クリア！`, H / 2 - 20, 36, '#2ecc71');
    drawText('スペース / クリックで次のレベルへ', H / 2 + 25, 18, '#ccc');
  } else if (state === 'gameover') {
    overlay();
    drawText('ゲームオーバー', H / 2 - 30, 40, '#e74c3c');
    drawText(`スコア: ${score}`, H / 2 + 10, 22);
    drawText('スペース / クリックでリトライ', H / 2 + 45, 18, '#ccc');
  } else if (state === 'win') {
    overlay();
    drawText('全レベルクリア！おめでとう！', H / 2 - 30, 34, '#f1c40f');
    drawText(`最終スコア: ${score}`, H / 2 + 10, 22);
    drawText('スペース / クリックでもう一度', H / 2 + 45, 18, '#ccc');
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

buildLevel(0);
loop();
</script>
</body>
</html>
