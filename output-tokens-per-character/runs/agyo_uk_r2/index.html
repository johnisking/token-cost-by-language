<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Арканоїд</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; border: 2px solid #444; cursor: none; }
  p { margin: 8px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<p>Керування: ← → / A D або миша. Пробіл / клік — запуск м'яча. P — пауза.</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  [
    "1111111111",
    "2222222222",
    "3333333333",
    "4444444444",
    "5555555555"
  ],
  [
    "6666666666",
    "6.5.5.5.56",
    "64444444.6",
    "6.3.3.3.36",
    "62222222.6",
    "6.1.1.1.16",
    "6666666666"
  ]
];
const COLORS = { 1: '#e74c3c', 2: '#e67e22', 3: '#f1c40f', 4: '#2ecc71', 5: '#3498db', 6: '#9b59b6' };
// '6' = міцна цеглина (2 удари)

const COLS = 10, BW = 58, BH = 20, GAP = 4, OFFX = (W - (COLS * (BW + GAP) - GAP)) / 2, OFFY = 60;

const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30, speed: 7 };
const ball = { r: 7, x: 0, y: 0, dx: 0, dy: 0, speed: 5, stuck: true };
let bricks = [], level = 0, score = 0, lives = 3, state = 'play', paused = false;
const keys = {};

function loadLevel(n) {
  bricks = [];
  LEVELS[n].forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '.') return;
      const t = +ch;
      bricks.push({ x: OFFX + c * (BW + GAP), y: OFFY + r * (BH + GAP), t, hp: t === 6 ? 2 : 1, alive: true });
    });
  });
  ball.speed = 5 + n;
  resetBall();
}

function resetBall() {
  ball.stuck = true;
  ball.dx = 0; ball.dy = 0;
}

function launch() {
  if (state !== 'play') { restart(); return; }
  if (!ball.stuck || paused) return;
  ball.stuck = false;
  const a = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
  ball.dx = Math.cos(a) * ball.speed;
  ball.dy = Math.sin(a) * ball.speed;
}

function restart() {
  level = 0; score = 0; lives = 3; state = 'play';
  loadLevel(0);
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); launch(); }
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if (e.code === 'Enter' && state !== 'play') restart();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = mx - paddle.w / 2;
});
canvas.addEventListener('click', launch);

function update() {
  if (state !== 'play' || paused) return;

  if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }

  // Рух у кілька кроків для уникнення "проскакування"
  const steps = Math.ceil(ball.speed / 3);
  for (let s = 0; s < steps; s++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // Ракетка
    if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // Цеглини
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BW));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BH));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
        b.hp--;
        if (b.hp <= 0) { b.alive = false; score += b.t === 6 ? 50 : 10 * (6 - b.t); }
        else score += 5;
        break;
      }
    }

    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'over'; } else resetBall();
      return;
    }
  }

  if (bricks.every(b => !b.alive)) {
    level++;
    if (level >= LEVELS.length) state = 'win';
    else loadLevel(level);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Рахунок: ' + score, 12, 28);
  ctx.textAlign = 'center';
  ctx.fillText('Рівень: ' + (Math.min(level, LEVELS.length - 1) + 1) + ' / ' + LEVELS.length, W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('Життя: ' + '❤'.repeat(Math.max(0, lives)), W - 12, 28);

  // Цеглини
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = COLORS[b.t];
    if (b.t === 6 && b.hp === 1) ctx.fillStyle = '#5e3370';
    ctx.fillRect(b.x, b.y, BW, BH);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, BW - 1, BH - 1);
  }

  // Ракетка
  ctx.fillStyle = '#ecf0f1';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // М'яч
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  ctx.textAlign = 'center';
  if (state === 'play' && ball.stuck) {
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Натисніть Пробіл або клацніть, щоб запустити м\'яч', W / 2, H / 2 + 60);
  }
  if (paused) overlay('ПАУЗА', 'Натисніть P, щоб продовжити');
  if (state === 'over') overlay('ГРУ ЗАКІНЧЕНО', 'Рахунок: ' + score + ' — Enter або клік для нової гри');
  if (state === 'win') overlay('ПЕРЕМОГА!', 'Рахунок: ' + score + ' — Enter або клік для нової гри');
}

function overlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 10);
  ctx.font = '18px sans-serif';
  ctx.fillText(sub, W / 2, H / 2 + 30);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loadLevel(0);
loop();
</script>
</body>
</html>
