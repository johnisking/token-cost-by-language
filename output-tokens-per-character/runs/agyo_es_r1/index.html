<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rompe Ladrillos</title>
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#eee}
  canvas{background:#000;border:2px solid #444;cursor:none;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const LEVELS=[
  ["1111111111","1111111111","2222222222","2222222222","3333333333"],
  ["3030303030","0303030303","2222222222","1100110011","3333333333","1111111111"]
];
const COLORS={1:'#4fc3f7',2:'#81c784',3:'#ffb74d'};
const BW=70,BH=22,PAD=6,OFFX=(W-(10*BW+9*PAD))/2,OFFY=60;
let paddle,ball,bricks,score,lives,level,state,keys={};

function newGame(){score=0;lives=3;level=0;loadLevel();}
function loadLevel(){
  bricks=[];
  LEVELS[level].forEach((row,r)=>[...row].forEach((ch,c)=>{
    const hp=+ch; if(hp) bricks.push({x:OFFX+c*(BW+PAD),y:OFFY+r*(BH+PAD),hp,pts:hp*10});
  }));
  resetBall(); state='ready';
}
function resetBall(){
  paddle={w:110,h:14,x:W/2-55,y:H-40};
  const sp=5+level*1.2;
  ball={r:8,x:W/2,y:paddle.y-9,dx:0,dy:0,sp};
}
function launch(){
  const a=(Math.random()*0.6-0.3)-Math.PI/2;
  ball.dx=Math.cos(a)*ball.sp; ball.dy=Math.sin(a)*ball.sp; state='play';
}
function action(){
  if(state==='ready')launch();
  else if(state==='play')state='pause';
  else if(state==='pause')state='play';
  else if(state==='over'||state==='win')newGame();
  else if(state==='levelup'){level++;loadLevel();}
}

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();action();}
  if(e.key==='p'||e.key==='P'){if(state==='play')state='pause';else if(state==='pause')state='play';}
  if(e.key.startsWith('Arrow'))e.preventDefault();
});
document.addEventListener('keyup',e=>keys[e.key]=false);
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*W/r.width;
  paddle.x=Math.max(0,Math.min(W-paddle.w,mx-paddle.w/2));
});
cv.addEventListener('click',action);

function update(){
  const ps=9;
  if(keys['ArrowLeft']||keys['a']||keys['A'])paddle.x-=ps;
  if(keys['ArrowRight']||keys['d']||keys['D'])paddle.x+=ps;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  if(state==='ready'){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return;}
  if(state!=='play')return;
  const steps=3;
  for(let s=0;s<steps;s++){
    ball.x+=ball.dx/steps; ball.y+=ball.dy/steps;
    if(ball.x<ball.r){ball.x=ball.r;ball.dx=Math.abs(ball.dx);}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.dx=-Math.abs(ball.dx);}
    if(ball.y<ball.r){ball.y=ball.r;ball.dy=Math.abs(ball.dy);}
    // paddle
    if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h+ball.dy&&ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){
      const hit=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2));
      const a=Math.max(-1,Math.min(1,hit))*(Math.PI/3);
      ball.dx=ball.sp*Math.sin(a); ball.dy=-ball.sp*Math.cos(a);
      ball.y=paddle.y-ball.r;
    }
    // bricks
    for(let i=0;i<bricks.length;i++){
      const b=bricks[i];
      const cx=Math.max(b.x,Math.min(ball.x,b.x+BW)),cy=Math.max(b.y,Math.min(ball.y,b.y+BH));
      const ddx=ball.x-cx,ddy=ball.y-cy;
      if(ddx*ddx+ddy*ddy<=ball.r*ball.r){
        const ox=Math.min(ball.x+ball.r-b.x,b.x+BW-(ball.x-ball.r));
        const oy=Math.min(ball.y+ball.r-b.y,b.y+BH-(ball.y-ball.r));
        if(ox<oy){ball.dx=-ball.dx;ball.x+=ball.dx>0?ox:-ox;}
        else{ball.dy=-ball.dy;ball.y+=ball.dy>0?oy:-oy;}
        b.hp--; score+=10;
        if(b.hp<=0){score+=b.pts;bricks.splice(i,1);}
        break;
      }
    }
    if(ball.y>H+ball.r){
      lives--;
      if(lives<=0){state='over';return;}
      resetBall(); state='ready'; return;
    }
  }
  if(bricks.length===0){score+=lives*100;state=level<LEVELS.length-1?'levelup':'win';}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill();}
function text(t,y,size=36,color='#fff'){ctx.fillStyle=color;ctx.font=`bold ${size}px Arial`;ctx.textAlign='center';ctx.fillText(t,W/2,y);}
function draw(){
  ctx.clearRect(0,0,W,H);
  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';
  ctx.textAlign='left';ctx.fillText('Puntos: '+score,16,32);
  ctx.textAlign='center';ctx.fillText('Nivel '+(level+1)+' / '+LEVELS.length,W/2,32);
  ctx.textAlign='right';ctx.fillText('Vidas: '+'♥'.repeat(Math.max(0,lives)),W-16,32);
  // bricks
  bricks.forEach(b=>{ctx.fillStyle=COLORS[b.hp];rr(b.x,b.y,BW,BH,4);});
  // paddle
  ctx.fillStyle='#e0e0e0';rr(paddle.x,paddle.y,paddle.w,paddle.h,7);
  // ball
  ctx.fillStyle='#ff5252';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  // overlays
  const sub='Clic, Espacio o Enter para continuar';
  if(state!=='play'){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,H/2-90,W,170);}
  if(state==='ready'){text('Nivel '+(level+1),H/2-30);text('Clic o Espacio para lanzar',H/2+10,20);text('Mover: ratón, ← → o A/D  ·  Pausa: P',H/2+45,16,'#bbb');}
  if(state==='pause'){text('PAUSA',H/2-10);text(sub,H/2+30,20);}
  if(state==='levelup'){text('¡Nivel completado!',H/2-10);text(sub,H/2+30,20);}
  if(state==='over'){text('FIN DEL JUEGO',H/2-20,40,'#ff5252');text('Puntuación: '+score,H/2+15,22);text('Clic o Espacio para reiniciar',H/2+50,18);}
  if(state==='win'){text('¡HAS GANADO!',H/2-20,40,'#81c784');text('Puntuación final: '+score,H/2+15,22);text('Clic o Espacio para jugar de nuevo',H/2+50,18);}
}
function loop(){update();draw();requestAnimationFrame(loop);}
newGame();loop();
</script>
</body>
</html>
