<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Арканоїд</title>
<style>
  body { margin:0; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:Arial, sans-serif; color:#eee; }
  canvas { background:#000; border:2px solid #444; cursor:none; }
  p { margin:8px; font-size:14px; color:#aaa; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<p>Керування: ← → або A/D, чи мишею. Пробіл / клік — запустити м'яч. P — пауза.</p>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const paddle = { w: 90, h: 12, x: W/2 - 45, y: H - 30, speed: 7 };
const ball = { r: 7, x: 0, y: 0, dx: 0, dy: 0, stuck: true };
const keys = {};
let bricks = [];
let score = 0, lives = 3, level = 0;
let state = 'play'; // play | paused | levelup | over | win
let stateTimer = 0;

const LEVELS = [
  // Рівень 1: суцільні ряди
  [
    "1111111111",
    "2222222222",
    "3333333333",
    "4444444444",
    "5555555555"
  ],
  // Рівень 2: візерунок, міцніші цеглини (цифра = кількість ударів для "9")
  [
    "9.9.99.9.9",
    "1234554321",
    ".22222222.",
    "3.3.33.3.3",
    "4444444444",
    ".55.55.55.",
    "9999999999"
  ]
];
const COLORS = { '1':'#e74c3c', '2':'#e67e22', '3':'#f1c40f', '4':'#2ecc71', '5':'#3498db', '9':'#9b59b6' };

function buildLevel(n) {
  bricks = [];
  const rows = LEVELS[n];
  const cols = 10, pad = 4, top = 50, side = 20;
  const bw = (W - side*2 - pad*(cols-1)) / cols, bh = 18;
  rows.forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '.') return;
      bricks.push({
        x: side + c*(bw+pad), y: top + r*(bh+pad), w: bw, h: bh,
        hits: ch === '9' ? 2 : 1, color: COLORS[ch], points: ch === '9' ? 30 : 10 * (6 - Number(ch))
      });
    });
  });
}

function resetBall() {
  ball.stuck = true;
  ball.dx = 0; ball.dy = 0;
}

function launch() {
  if (!ball.stuck || state !== 'play') return;
  const speed = 5 + level * 1.2;
  const angle = (Math.random() * 0.6 - 0.3);
  ball.dx = speed * Math.sin(angle);
  ball.dy = -speed * Math.cos(angle);
  ball.stuck = false;
}

function newGame() {
  score = 0; lives = 3; level = 0;
  buildLevel(level); resetBall(); state = 'play';
}

// Ввід
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (state === 'over' || state === 'win') newGame(); else launch();
  }
  if (e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З') {
    if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play';
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});
canvas.addEventListener('click', () => {
  if (state === 'over' || state === 'win') newGame(); else launch();
});

function update() {
  if (state === 'levelup') {
    if (--stateTimer <= 0) { level++; buildLevel(level); resetBall(); state = 'play'; }
    return;
  }
  if (state !== 'play') return;

  if (keys['ArrowLeft'] || keys['a'] || keys['A'] || keys['ф'] || keys['Ф']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D'] || keys['в'] || keys['В']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) {
    ball.x = paddle.x + paddle.w/2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }

  // Рух із підкроками, щоб не пролітати крізь цеглини
  const steps = Math.ceil(Math.max(Math.abs(ball.dx), Math.abs(ball.dy)) / 3);
  for (let s = 0; s < steps; s++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;

    // Стіни
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // Платформа
    if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const speed = Math.hypot(ball.dx, ball.dy);
      const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2); // -1..1
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
      ball.dx = speed * Math.sin(angle);
      ball.dy = -speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // Цеглини
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx*ddx + ddy*ddy <= ball.r*ball.r) {
        // Визначаємо сторону відбиття
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
        b.hits--;
        if (b.hits <= 0) { score += b.points; bricks.splice(i, 1); }
        else { b.color = '#c39bd3'; score += 5; }
        break;
      }
    }

    // Падіння
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'over'; } else resetBall();
      return;
    }
  }

  if (bricks.length === 0) {
    if (level + 1 < LEVELS.length) { state = 'levelup'; stateTimer = 120; }
    else state = 'win';
  }
}

function drawText(text, size, y, color = '#fff') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText(text, W/2, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Рахунок: ' + score, 15, 26);
  ctx.textAlign = 'center';
  ctx.fillText('Рівень ' + (level + 1) + ' / ' + LEVELS.length, W/2, 26);
  ctx.textAlign = 'right';
  ctx.fillText('Життя: ' + '♥'.repeat(Math.max(0, lives)), W - 15, 26);

  // Цеглини
  bricks.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(b.x, b.y, b.w, 4);
  });

  // Платформа
  ctx.fillStyle = '#ecf0f1';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // М'яч
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  if (state === 'play' && ball.stuck) drawText('Пробіл або клік — запустити м\'яч', 18, H/2 + 60, '#aaa');
  if (state === 'paused') drawText('ПАУЗА', 40, H/2);
  if (state === 'levelup') drawText('Рівень ' + (level + 1) + ' пройдено!', 36, H/2, '#2ecc71');
  if (state === 'over') {
    drawText('ГРУ ЗАКІНЧЕНО', 42, H/2, '#e74c3c');
    drawText('Рахунок: ' + score + '. Пробіл або клік — нова гра', 18, H/2 + 40);
  }
  if (state === 'win') {
    drawText('ПЕРЕМОГА!', 42, H/2, '#f1c40f');
    drawText('Рахунок: ' + score + '. Пробіл або клік — нова гра', 18, H/2 + 40);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

newGame();
loop();
</script>
</body>
</html>
