<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; color: #eee; }
  #wrap { text-align: center; }
  canvas { background: #1b1f2a; border: 2px solid #444; display: block; cursor: none; }
  p { font-size: 13px; color: #999; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="480"></canvas>
  <p>Move: ← → / A D or mouse &nbsp;|&nbsp; Launch: Space / click &nbsp;|&nbsp; Pause: P</p>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  // Level 1: simple rows
  [
    "1111111111",
    "1111111111",
    "2222222222",
    "2222222222",
    "3333333333"
  ],
  // Level 2: pattern with tougher bricks (number = hits required)
  [
    "3330000333",
    "2223333222",
    "1122222211",
    "1110110111",
    "2211111122",
    "0022222200"
  ]
];
const COLORS = { 1: '#4fc3f7', 2: '#ffb74d', 3: '#e57373' };

const BRICK_COLS = 10, BRICK_W = 58, BRICK_H = 20, BRICK_GAP = 4, BRICK_TOP = 50;
const BRICK_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP)) / 2;

const paddle = { w: 100, h: 12, x: W / 2 - 50, y: H - 36, speed: 8 };
const ball = { x: 0, y: 0, r: 7, dx: 0, dy: 0, speed: 5, stuck: true };

let bricks = [];
let score = 0, lives = 3, level = 0;
let state = 'start'; // start, playing, paused, levelClear, gameOver, win
const keys = {};

function loadLevel(n) {
  bricks = [];
  LEVELS[n].forEach((row, r) => {
    [...row].forEach((ch, c) => {
      const hp = parseInt(ch, 10);
      if (hp > 0) bricks.push({
        x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
        hp, maxHp: hp
      });
    });
  });
  ball.speed = 5 + n * 1;
  resetBall();
}

function resetBall() {
  ball.stuck = true;
  paddle.x = W / 2 - paddle.w / 2;
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r;
  ball.dx = 0; ball.dy = 0;
}

function launch() {
  if (!ball.stuck) return;
  ball.stuck = false;
  const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45..45 deg from vertical
  ball.dx = ball.speed * Math.sin(angle);
  ball.dy = -ball.speed * Math.cos(angle);
}

function newGame() {
  score = 0; lives = 3; level = 0;
  loadLevel(level);
  state = 'playing';
}

function action() {
  if (state === 'start' || state === 'gameOver' || state === 'win') newGame();
  else if (state === 'levelClear') { level++; loadLevel(level); state = 'playing'; }
  else if (state === 'playing') launch();
}

// ---- Input ----
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});
canvas.addEventListener('click', action);

// ---- Update ----
function update() {
  if (state !== 'playing') return;

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r;
    return;
  }

  // Sub-step movement to avoid tunneling
  const steps = Math.ceil(ball.speed / 3);
  for (let s = 0; s < steps; s++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;
    if (collide()) break;
  }
}

function collide() {
  // Walls
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // Bottom: lose life
  if (ball.y - ball.r > H) {
    lives--;
    if (lives <= 0) state = 'gameOver';
    else resetBall();
    return true;
  }

  // Paddle
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.dy &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
    const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3); // up to 60 deg
    ball.dx = ball.speed * Math.sin(angle);
    ball.dy = -ball.speed * Math.cos(angle);
    ball.y = paddle.y - ball.r;
  }

  // Bricks
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
    const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
    const ddx = ball.x - cx, ddy = ball.y - cy;
    if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
      // Determine bounce side by overlap
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
      if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;

      b.hp--;
      score += 10;
      if (b.hp <= 0) { bricks.splice(i, 1); score += 10 * b.maxHp; }

      if (bricks.length === 0) {
        score += 100 * lives;
        state = (level + 1 < LEVELS.length) ? 'levelClear' : 'win';
      }
      return true;
    }
  }
  return false;
}

// ---- Draw ----
function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#eee';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 12, 28);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + '♥'.repeat(Math.max(0, lives)), W - 12, 28);

  // Bricks
  bricks.forEach(b => {
    ctx.fillStyle = COLORS[b.hp];
    ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, BRICK_W - 1, BRICK_H - 1);
  });

  // Paddle
  ctx.fillStyle = '#e0e0e0';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff176';
  ctx.fill();

  // Overlays
  const msg = {
    start: ['BRICK BREAKER', 'Press Space or click to start'],
    paused: ['PAUSED', 'Press P to resume'],
    levelClear: ['LEVEL ' + (level + 1) + ' CLEAR!', 'Press Space or click for next level'],
    gameOver: ['GAME OVER', 'Final score: ' + score + ' — Space / click to restart'],
    win: ['YOU WIN!', 'Final score: ' + score + ' — Space / click to play again']
  }[state];
  if (msg) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px Arial';
    ctx.fillText(msg[0], W / 2, H / 2 - 10);
    ctx.font = '18px Arial';
    ctx.fillText(msg[1], W / 2, H / 2 + 30);
  } else if (state === 'playing' && ball.stuck) {
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center';
    ctx.font = '16px Arial';
    ctx.fillText('Space / click to launch', W / 2, H / 2 + 60);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loadLevel(0);
loop();
</script>
</body>
</html>
