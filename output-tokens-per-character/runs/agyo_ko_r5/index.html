<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #10131c;
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    color: #eee;
  }
  #wrap { text-align: center; }
  canvas {
    background: linear-gradient(#1b2235, #0d1020);
    border: 2px solid #3a4566;
    border-radius: 8px;
    display: block;
    cursor: none;
    max-width: 95vw;
  }
  p { color: #8a93ad; font-size: 14px; margin: 10px 0 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <p>← → / A D 또는 마우스로 패들 이동 · Space / 클릭으로 발사 · P 일시정지</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ----- 레벨 정의 (숫자 = 벽돌 내구도, 0 = 빈칸) -----
  const LEVELS = [
    [
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111",
      "1111111111",
    ],
    [
      "2222222222",
      "2100000012",
      "2122222212",
      "2120110212",
      "2122222212",
      "2100000012",
      "2222222222",
    ],
  ];
  const COLORS = { 1: ["#4fc3f7", "#81c784", "#ffd54f", "#ff8a65", "#ba68c8", "#4dd0e1", "#aed581"], 2: "#e57373" };

  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_OFFSET_X = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;
  const BRICK_OFFSET_Y = 70;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, dx: 0, dy: 0, speed: 6 };

  let bricks = [];
  let score = 0, lives = 3, level = 0;
  let state = "ready"; // ready | playing | paused | levelclear | gameover | win
  const keys = {};

  function buildLevel(n) {
    bricks = [];
    LEVELS[n].forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
            y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
            hp, maxHp: hp, row: r,
          });
        }
      });
    });
    ball.speed = 6 + n * 1.2;
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.dx = 0; ball.dy = 0;
  }

  function launch() {
    if (state === "ready") {
      const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // 위쪽으로 약간 랜덤
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
      state = "playing";
    } else if (state === "levelclear") {
      level++;
      buildLevel(level);
      resetBall();
      state = "ready";
    } else if (state === "gameover" || state === "win") {
      newGame();
    }
  }

  function newGame() {
    score = 0; lives = 3; level = 0;
    paddle.x = W / 2 - paddle.w / 2;
    buildLevel(level);
    resetBall();
    state = "ready";
  }

  // ----- 입력 -----
  document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') { e.preventDefault(); launch(); }
    if (e.key.toLowerCase() === 'p') {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }
    if (e.key.startsWith('Arrow')) e.preventDefault();
  });
  document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
  });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); launch(); });

  // ----- 업데이트 -----
  function update() {
    if (state === "paused" || state === "gameover" || state === "win" || state === "levelclear") return;

    if (keys['arrowleft'] || keys['a']) paddle.x -= paddle.speed;
    if (keys['arrowright'] || keys['d']) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (state === "ready") { resetBall(); return; }

    // 서브스텝으로 터널링 방지
    const steps = Math.ceil(Math.max(Math.abs(ball.dx), Math.abs(ball.dy)) / 4);
    for (let i = 0; i < steps; i++) {
      ball.x += ball.dx / steps;
      ball.y += ball.dy / steps;
      if (stepCollisions()) break;
    }
  }

  // true를 반환하면 이번 프레임 이동 중단
  function stepCollisions() {
    // 벽
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // 바닥
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = "gameover"; }
      else { state = "ready"; resetBall(); }
      return true;
    }

    // 패들
    if (ball.dy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.dy &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);      // 최대 60도
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // 벽돌
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
        // 충돌 방향 판정
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;

        b.hp--;
        score += b.hp <= 0 ? 10 * b.maxHp : 5;

        if (bricks.every(br => br.hp <= 0)) {
          state = (level + 1 >= LEVELS.length) ? "win" : "levelclear";
          if (state === "levelclear") score += lives * 50; // 남은 목숨 보너스
        }
        return true;
      }
    }
    return false;
  }

  // ----- 그리기 -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // HUD
    ctx.fillStyle = "#e8ecf7";
    ctx.font = "bold 20px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText(`점수: ${score}`, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(`레벨 ${level + 1} / ${LEVELS.length}`, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("목숨:", W - 20 - 3 * 22, 30);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lives ? "#ff5370" : "#3a4566";
      ctx.beginPath();
      ctx.arc(W - 20 - (2 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    // 벽돌
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      let color;
      if (b.maxHp === 2) color = b.hp === 2 ? COLORS[2] : "#f4b6b6";
      else color = COLORS[1][b.row % COLORS[1].length];
      ctx.fillStyle = color;
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, BRICK_W - 6, 4);
    }

    // 패들
    const grad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    grad.addColorStop(0, "#9fb4ff");
    grad.addColorStop(1, "#4a63d6");
    ctx.fillStyle = grad;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // 공
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fd8ff";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 메시지
    const msg = {
      ready: ["", "Space 또는 클릭으로 공 발사"],
      paused: ["일시정지", "P 키로 계속하기"],
      levelclear: [`레벨 ${level + 1} 클리어!`, "Space 또는 클릭으로 다음 레벨"],
      gameover: ["게임 오버", `최종 점수: ${score} · Space 또는 클릭으로 재시작`],
      win: ["축하합니다! 모든 레벨 클리어!", `최종 점수: ${score} · Space 또는 클릭으로 재시작`],
    }[state];

    if (msg) {
      if (state !== "ready") {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, W, H);
      }
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      if (msg[0]) {
        ctx.font = "bold 40px 'Segoe UI', 'Malgun Gothic', sans-serif";
        ctx.fillText(msg[0], W / 2, H / 2 - 20);
      }
      ctx.font = "18px 'Segoe UI', 'Malgun Gothic', sans-serif";
      ctx.fillStyle = "#cfd6ea";
      ctx.fillText(msg[1], W / 2, msg[0] ? H / 2 + 25 : H / 2 + 80);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  loop();
})();
</script>
</body>
</html>
