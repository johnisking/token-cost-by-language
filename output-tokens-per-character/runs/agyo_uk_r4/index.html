<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арканоїд</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d1a; }
  body { display: flex; flex-direction: column; justify-content: center; align-items: center;
         font-family: "Segoe UI", Arial, sans-serif; color: #ccd; }
  canvas { background: #05050f; border: 2px solid #334; border-radius: 6px;
           max-width: 100vw; max-height: 92vh; cursor: none; box-shadow: 0 0 30px #2a2a6a88; }
  p { margin: 8px; font-size: 14px; opacity: .75; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<p>Миша або ← → / A D — рух ракетки · Клік / Пробіл — запуск м'яча · P — пауза</p>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const HUD = 40;

  // ---------- Рівні ----------
  // 1-5: звичайні цеглинки (1 удар), S: міцна цеглинка (2 удари), '.': порожньо
  const LEVELS = [
    {
      speed: 340,
      map: [
        "1111111111",
        "2222222222",
        "3333333333",
        "4444444444",
        "5555555555"
      ]
    },
    {
      speed: 400,
      map: [
        "S11111111S",
        "2S222222S2",
        "33S3333S33",
        "444SSSS444",
        "5555..5555",
        "S.S.SS.S.S"
      ]
    }
  ];
  const COLORS = { '1': '#ff4d6d', '2': '#ff9f1c', '3': '#ffd60a', '4': '#4cd964', '5': '#4dabf7' };
  const POINTS = { '1': 50, '2': 40, '3': 30, '4': 20, '5': 10, 'S': 100 };

  const COLS = 10, MARGIN = 35, GAP = 6, BRICK_H = 22, TOP = HUD + 40;
  const BRICK_W = (W - 2 * MARGIN - (COLS - 1) * GAP) / COLS;

  // ---------- Стан гри ----------
  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 560 };
  const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, speed: 340, maxSpeed: 620 };
  let bricks = [], particles = [];
  let score = 0, lives = 3, level = 0;
  let state = 'start'; // start | serve | play | paused | levelComplete | gameover | win
  let best = Number(localStorage.getItem('arkanoid_best') || 0);
  const keys = {};

  function buildLevel(n) {
    bricks = [];
    LEVELS[n].map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        bricks.push({
          x: MARGIN + c * (BRICK_W + GAP),
          y: TOP + r * (BRICK_H + GAP),
          w: BRICK_W, h: BRICK_H,
          type: ch,
          hits: ch === 'S' ? 2 : 1,
          alive: true
        });
      });
    });
    ball.speed = LEVELS[n].speed;
    resetBall();
  }

  function resetBall() {
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0; ball.vy = 0;
  }

  function resetGame() {
    score = 0; lives = 3; level = 0;
    particles = [];
    buildLevel(level);
  }

  function launch() {
    const angle = (Math.random() * 0.6 - 0.3) * Math.PI / 2;
    ball.vx = ball.speed * Math.sin(angle);
    ball.vy = -ball.speed * Math.cos(angle);
    state = 'play';
  }

  function action() {
    switch (state) {
      case 'start': resetGame(); state = 'serve'; break;
      case 'serve': launch(); break;
      case 'paused': state = 'play'; break;
      case 'levelComplete': level++; buildLevel(level); state = 'serve'; break;
      case 'gameover':
      case 'win': resetGame(); state = 'serve'; break;
    }
  }

  function togglePause() {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }

  // ---------- Керування ----------
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' || e.code === 'Enter') action();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  canvas.addEventListener('mousemove', e => {
    if (state === 'paused') return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
  });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); action(); });
  window.addEventListener('blur', () => { if (state === 'play') state = 'paused'; });

  // ---------- Логіка ----------
  function setVelocity() {
    const len = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = ball.vx / len * ball.speed;
    ball.vy = ball.vy / len * ball.speed;
    // не даємо м'ячу летіти майже горизонтально
    const minVy = ball.speed * 0.3;
    if (Math.abs(ball.vy) < minVy) {
      ball.vy = Math.sign(ball.vy || -1) * minVy;
      ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(ball.speed ** 2 - minVy ** 2);
    }
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function loseLife() {
    lives--;
    if (lives <= 0) {
      lives = 0;
      state = 'gameover';
      saveBest();
    } else {
      state = 'serve';
      resetBall();
    }
  }

  function saveBest() {
    if (score > best) { best = score; localStorage.setItem('arkanoid_best', best); }
  }

  function checkLevelDone() {
    if (bricks.some(b => b.alive)) return;
    score += lives * 100; // бонус за життя, що залишилися
    if (level < LEVELS.length - 1) state = 'levelComplete';
    else { state = 'win'; saveBest(); }
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // стіни
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < HUD + ball.r) { ball.y = HUD + ball.r; ball.vy = Math.abs(ball.vy); }
    if (ball.y - ball.r > H) { loseLife(); return false; }

    // ракетка
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      let hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      hit = Math.max(-1, Math.min(1, hit));
      const angle = hit * Math.PI / 3; // до 60°
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // цеглинки
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) {
        ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      b.hits--;
      if (b.hits <= 0) {
        b.alive = false;
        score += POINTS[b.type];
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.type === 'S' ? '#aab' : COLORS[b.type]);
      } else {
        score += 5;
      }
      ball.speed = Math.min(ball.maxSpeed, ball.speed + 4);
      setVelocity();
      checkLevelDone();
      break; // одна цеглинка за підкрок
    }
    return state === 'play';
  }

  function update(dt) {
    // рух ракетки клавіатурою
    if (state === 'play' || state === 'serve') {
      let dir = 0;
      if (keys.ArrowLeft || keys.KeyA) dir -= 1;
      if (keys.ArrowRight || keys.KeyD) dir += 1;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + dir * paddle.speed * dt));
    }

    if (state === 'serve') {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
    } else if (state === 'play') {
      const steps = Math.ceil(ball.speed * dt / 3);
      const sdt = dt / steps;
      for (let i = 0; i < steps; i++) if (!stepBall(sdt)) break;
    }

    if (state !== 'paused') {
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
    }
  }

  // ---------- Малювання ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = '#11112a';
    ctx.fillRect(0, 0, W, HUD);
    ctx.fillStyle = '#334';
    ctx.fillRect(0, HUD - 2, W, 2);
    ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('Рахунок: ' + score, 15, HUD / 2);
    ctx.textAlign = 'center';
    ctx.fillText('Рівень: ' + (level + 1) + ' / ' + LEVELS.length + '   Рекорд: ' + Math.max(best, score), W / 2, HUD / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff4d6d';
    ctx.fillText('♥'.repeat(lives) + '♡'.repeat(3 - lives), W - 15, HUD / 2);
    ctx.fillStyle = '#fff';
    ctx.fillText('Життя:', W - 15 - ctx.measureText('♥♥♥').width - 8, HUD / 2);
  }

  function drawBricks() {
    for (const b of bricks) {
      if (!b.alive) continue;
      let color;
      if (b.type === 'S') color = b.hits === 2 ? '#9aa0b5' : '#5f6478';
      else color = COLORS[b.type];
      const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      g.addColorStop(0, '#ffffff55');
      g.addColorStop(0.4, color);
      g.addColorStop(1, color);
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = color; ctx.fill();
      ctx.fillStyle = g; ctx.fill();
      if (b.type === 'S') {
        ctx.strokeStyle = '#dde'; ctx.lineWidth = 1.5; ctx.stroke();
        if (b.hits === 1) { // тріщина
          ctx.beginPath();
          ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
          ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.5);
          ctx.lineTo(b.x + b.w * 0.6, b.y + b.h * 0.4);
          ctx.lineTo(b.x + b.w * 0.7, b.y + b.h - 2);
          ctx.strokeStyle = '#222'; ctx.stroke();
        }
      }
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, '#e0f0ff');
    g.addColorStop(1, '#3a7bd5');
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fillStyle = g;
    ctx.shadowColor = '#4dabf7'; ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function overlay(title, lines, color) {
    ctx.fillStyle = 'rgba(0,0,10,0.7)';
    ctx.fillRect(0, HUD, W, H - HUD);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color || '#fff';
    ctx.font = 'bold 52px "Segoe UI", Arial, sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 50);
    ctx.fillStyle = '#ccd';
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 10 + i * 32));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();

    ctx.textAlign = 'center';
    switch (state) {
      case 'start':
        overlay('АРКАНОЇД', [
          'Розбий усі цеглинки на 2 рівнях!',
          'Миша або ← → / A D — рух ракетки',
          'Клік або Пробіл — почати гру'
        ], '#4dabf7');
        break;
      case 'serve':
        ctx.fillStyle = '#ccd';
        ctx.font = '18px "Segoe UI", Arial, sans-serif';
        ctx.fillText('Клік або Пробіл — запустити м\'яч', W / 2, H - 90);
        break;
      case 'paused':
        overlay('ПАУЗА', ['Натисни P, Пробіл або клікни, щоб продовжити']);
        break;
      case 'levelComplete':
        overlay('РІВЕНЬ ' + (level + 1) + ' ПРОЙДЕНО!', [
          'Рахунок: ' + score,
          'Клік або Пробіл — наступний рівень'
        ], '#4cd964');
        break;
      case 'gameover':
        overlay('ГРУ ЗАКІНЧЕНО', [
          'Рахунок: ' + score + '   Рекорд: ' + best,
          'Клік або Пробіл — грати знову'
        ], '#ff4d6d');
        break;
      case 'win':
        overlay('ПЕРЕМОГА!', [
          'Усі рівні пройдено! Рахунок: ' + score,
          'Рекорд: ' + best,
          'Клік або Пробіл — грати знову'
        ], '#ffd60a');
        break;
    }
  }

  // ---------- Головний цикл ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
