<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; font-family: sans-serif; color: #eee; }
  #wrap { text-align: center; }
  canvas { background: #1b1b2f; border: 2px solid #444; display: block; cursor: none; }
  p { font-size: 13px; color: #aaa; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="480"></canvas>
  <p>Move: ← → / A D or mouse &nbsp;|&nbsp; Launch: Space or click &nbsp;|&nbsp; Pause: P</p>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  // Level 1: simple rows
  [
    "1111111111",
    "1111111111",
    "2222222222",
    "2222222222",
    "3333333333"
  ],
  // Level 2: pattern with tougher bricks (number = hits needed, 0 = empty)
  [
    "3030303030",
    "0303030303",
    "2222222222",
    "2033333302",
    "2011111102",
    "1111111111"
  ]
];
const COLORS = { 1: '#4fc3f7', 2: '#ffb74d', 3: '#e57373' };
const COLS = 10, BRICK_W = 58, BRICK_H = 20, PAD = 4, TOP = 50;
const OFFSET_X = (W - (COLS * (BRICK_W + PAD) - PAD)) / 2;

const paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 30, speed: 7 };
const ball = { r: 7, x: 0, y: 0, dx: 0, dy: 0, stuck: true };
let bricks = [], score = 0, lives = 3, level = 0;
let state = 'start'; // start, playing, paused, levelclear, gameover, win
const keys = {};

function loadLevel(n) {
  bricks = [];
  LEVELS[n].forEach((row, r) => {
    [...row].forEach((ch, c) => {
      const hp = parseInt(ch, 10);
      if (hp > 0) bricks.push({
        x: OFFSET_X + c * (BRICK_W + PAD),
        y: TOP + r * (BRICK_H + PAD),
        hp, max: hp
      });
    });
  });
  resetBall();
}

function resetBall() {
  ball.stuck = true;
  ball.dx = 0; ball.dy = 0;
  paddle.x = W / 2 - paddle.w / 2;
}

function baseSpeed() { return 5 + level * 1.2; }

function launch() {
  if (state === 'start') { state = 'playing'; }
  else if (state === 'levelclear') { level++; loadLevel(level); state = 'playing'; return; }
  else if (state === 'gameover' || state === 'win') { newGame(); state = 'playing'; return; }
  if (state === 'playing' && ball.stuck) {
    ball.stuck = false;
    const s = baseSpeed();
    const ang = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
    ball.dx = s * Math.cos(ang);
    ball.dy = s * Math.sin(ang);
  }
}

function newGame() {
  score = 0; lives = 3; level = 0;
  loadLevel(0);
}

// Input
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); launch(); }
  if (e.key.toLowerCase() === 'p') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  if (['arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});
canvas.addEventListener('mousedown', e => { e.preventDefault(); launch(); });

function update() {
  if (state !== 'playing') return;

  if (keys['arrowleft'] || keys['a']) paddle.x -= paddle.speed;
  if (keys['arrowright'] || keys['d']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }

  // Sub-step movement to avoid tunneling
  const steps = Math.ceil(Math.hypot(ball.dx, ball.dy) / 3);
  for (let i = 0; i < steps; i++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;
    if (stepCollisions()) break;
  }
}

function stepCollisions() {
  // Walls
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // Bottom: lose life
  if (ball.y - ball.r > H) {
    lives--;
    if (lives <= 0) { state = 'gameover'; }
    else resetBall();
    return true;
  }

  // Paddle
  if (ball.dy > 0 &&
      ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
    const ang = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
    const s = Math.hypot(ball.dx, ball.dy);
    ball.dx = s * Math.sin(ang);
    ball.dy = -s * Math.cos(ang);
    ball.y = paddle.y - ball.r;
  }

  // Bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
    const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
    const dx = ball.x - cx, dy = ball.y - cy;
    if (dx * dx + dy * dy <= ball.r * ball.r) {
      // Determine bounce axis by overlap
      const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
      if (overlapX < overlapY) {
        ball.dx = ball.x < b.x + BRICK_W / 2 ? -Math.abs(ball.dx) : Math.abs(ball.dx);
      } else {
        ball.dy = ball.y < b.y + BRICK_H / 2 ? -Math.abs(ball.dy) : Math.abs(ball.dy);
      }
      b.hp--;
      score += b.hp <= 0 ? 10 * b.max : 5;
      // slight speed-up
      const s = Math.hypot(ball.dx, ball.dy);
      const ns = Math.min(s * 1.01, baseSpeed() + 3);
      ball.dx *= ns / s; ball.dy *= ns / s;

      if (bricks.every(br => br.hp <= 0)) {
        score += lives * 50;
        state = level < LEVELS.length - 1 ? 'levelclear' : 'win';
        resetBall();
      }
      return true;
    }
  }
  return false;
}

function drawText(txt, y, size = 32, color = '#fff') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(txt, W / 2, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 12, 28);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + '♥'.repeat(Math.max(0, lives)), W - 12, 28);

  // Bricks
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = COLORS[b.hp];
    ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, BRICK_W - 1, BRICK_H - 1);
  }

  // Paddle
  ctx.fillStyle = '#e0e0e0';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Ball
  if (state !== 'gameover') {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff176';
    ctx.fill();
  }

  // Overlays
  const overlay = (title, sub) => {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawText(title, H / 2 - 10, 40);
    drawText(sub, H / 2 + 30, 18, '#ccc');
  };
  if (state === 'start') overlay('BRICK BREAKER', 'Press Space or click to start');
  else if (state === 'paused') overlay('PAUSED', 'Press P to resume');
  else if (state === 'levelclear') overlay('LEVEL ' + (level + 1) + ' CLEAR!', 'Press Space or click for next level');
  else if (state === 'gameover') overlay('GAME OVER', 'Score: ' + score + ' — Space or click to restart');
  else if (state === 'win') overlay('YOU WIN!', 'Final score: ' + score + ' — Space or click to play again');
  else if (state === 'playing' && ball.stuck) drawText('Space / click to launch', H / 2 + 60, 16, '#aaa');
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

newGame();
ball.x = paddle.x + paddle.w / 2;
ball.y = paddle.y - ball.r - 1;
loop();
</script>
</body>
</html>
