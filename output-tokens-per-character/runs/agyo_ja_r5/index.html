<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブロック崩し</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; }
  h1 { margin:12px 0 4px; font-size:22px; }
  p { margin:4px 0 10px; font-size:13px; color:#aaa; }
  canvas { background:#000; border:2px solid #444; cursor:none; }
</style>
</head>
<body>
<h1>ブロック崩し</h1>
<p>操作：← → / A D キー または マウスで移動 ・ スペース / クリックで発射 ・ P で一時停止</p>
<canvas id="game" width="640" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  { rows: 4, cols: 10, speed: 4, layout: null },
  { rows: 6, cols: 10, speed: 5, layout: [
      "1111111111",
      "1222222221",
      "1200000021",
      "1200000021",
      "1222222221",
      "1111111111" ] }
];
const COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'];

const paddle = { w: 90, h: 12, x: W/2 - 45, y: H - 30, speed: 7 };
const ball = { r: 7, x: 0, y: 0, dx: 0, dy: 0, stuck: true };
let bricks = [], score = 0, lives = 3, level = 0;
let state = 'title'; // title, play, paused, levelclear, gameover, win
const keys = {};

function buildLevel(n) {
  const L = LEVELS[n];
  bricks = [];
  const bw = 56, bh = 20, pad = 6;
  const offX = (W - (L.cols * (bw + pad) - pad)) / 2, offY = 50;
  for (let r = 0; r < L.rows; r++) {
    for (let c = 0; c < L.cols; c++) {
      let hp = 1;
      if (L.layout) {
        hp = parseInt(L.layout[r][c]);
        if (hp === 0) continue;
      }
      bricks.push({ x: offX + c * (bw + pad), y: offY + r * (bh + pad), w: bw, h: bh, hp, maxHp: hp, color: COLORS[r % COLORS.length] });
    }
  }
}

function resetBall() {
  ball.stuck = true;
  ball.dx = 0; ball.dy = 0;
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
}

function launch() {
  if (!ball.stuck) return;
  const s = LEVELS[level].speed;
  const ang = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
  ball.dx = s * Math.cos(ang);
  ball.dy = s * Math.sin(ang);
  ball.stuck = false;
}

function startGame() {
  score = 0; lives = 3; level = 0;
  buildLevel(level);
  resetBall();
  state = 'play';
}

function action() {
  if (state === 'title' || state === 'gameover' || state === 'win') startGame();
  else if (state === 'levelclear') { level++; buildLevel(level); resetBall(); state = 'play'; }
  else if (state === 'play') launch();
}

// 入力
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); action(); }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});
canvas.addEventListener('mousedown', action);

function update() {
  if (state !== 'play') return;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }

  // サブステップで貫通防止
  const steps = 3;
  for (let i = 0; i < steps; i++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // パドル
    if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const ang = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
      const sp = Math.hypot(ball.dx, ball.dy);
      ball.dx = sp * Math.sin(ang);
      ball.dy = -sp * Math.cos(ang);
      ball.y = paddle.y - ball.r;
    }

    // ブロック
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
        b.hp--;
        score += b.hp <= 0 ? 10 * (level + 1) : 5;
        break;
      }
    }

    // 落下
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'gameover'; }
      else resetBall();
      return;
    }
  }

  if (bricks.every(b => b.hp <= 0)) {
    state = (level + 1 < LEVELS.length) ? 'levelclear' : 'win';
  }
}

function drawCenterText(lines) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  lines.forEach((t, i) => {
    ctx.font = i === 0 ? 'bold 36px sans-serif' : '18px sans-serif';
    ctx.fillText(t, W / 2, H / 2 - 30 + i * 40);
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // ブロック
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.maxHp > 1 && b.hp === 1 ? 0.5 : 1;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.globalAlpha = 1;
    if (b.maxHp > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2); }
  }

  // パドル
  ctx.fillStyle = '#ecf0f1';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // ボール
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // HUD
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('スコア: ' + score, 10, 24);
  ctx.textAlign = 'center';
  ctx.fillText('レベル ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 24);
  ctx.textAlign = 'right';
  ctx.fillText('ライフ: ' + '♥'.repeat(Math.max(0, lives)), W - 10, 24);

  if (state === 'play' && ball.stuck) {
    ctx.textAlign = 'center';
    ctx.fillText('スペース / クリックで発射', W / 2, H / 2 + 60);
  }
  if (state === 'title') drawCenterText(['ブロック崩し', 'スペース / クリックでスタート']);
  if (state === 'paused') drawCenterText(['一時停止', 'P で再開']);
  if (state === 'levelclear') drawCenterText(['レベル ' + (level + 1) + ' クリア！', 'スペース / クリックで次へ']);
  if (state === 'gameover') drawCenterText(['ゲームオーバー', 'スコア: ' + score, 'スペース / クリックでリトライ']);
  if (state === 'win') drawCenterText(['全レベルクリア！', 'スコア: ' + score, 'スペース / クリックでもう一度']);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
buildLevel(0);
resetBall();
loop();
</script>
</body>
</html>
