<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Арканоїд — Розбивання цеглинок</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 75%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-wrapper {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      max-width: 760px;
      width: 100%;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      padding: 12px 20px;
      border-radius: 10px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 600;
      font-size: 1.05rem;
    }

    .hud-item span {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin-left: 6px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 720 / 480;
      background: #090d16;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.25);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
    }

    .overlay p {
      color: var(--muted);
      margin-bottom: 22px;
      font-size: 1.05rem;
      max-width: 440px;
      line-height: 1.5;
    }

    .btn {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.55);
    }

    .controls-hint {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="hud">
      <div class="hud-item">Рахунок: <span id="scoreEl">0</span></div>
      <div class="hud-item">Рівень: <span id="levelEl">1 / 2</span></div>
      <div class="hud-item">Життя: <span id="livesEl">❤️❤️❤️</span></div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="720" height="480"></canvas>
      <div id="overlay" class="overlay">
        <h1 id="overlayTitle">Арканоїд</h1>
        <p id="overlayDesc">Розбийте всі цеглинки на 2 рівнях! Керуйте платформою мишею або клавішами ← → / A D. Натисніть Пробіл або клікніть, щоб запустити м'яч.</p>
        <button id="actionBtn" class="btn">Почати гру</button>
      </div>
    </div>

    <div class="controls-hint">
      Керування: <strong>Миша</strong> або клавіші <strong>← / →</strong> (<strong>A / D</strong>) • Запуск м'яча: <strong>Пробіл</strong> або <strong>Клік</strong> • Пауза: <strong>P</strong>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const actionBtn = document.getElementById('actionBtn');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const MAX_LEVEL = 2;

    let score = 0;
    let lives = 3;
    let level = 1;
    let gameState = 'menu'; // 'menu' | 'playing' | 'paused' | 'levelclear' | 'gameover' | 'victory'
    let ballOnPaddle = true;

    const paddle = {
      width: 110,
      height: 14,
      x: (WIDTH - 110) / 2,
      y: HEIGHT - 34,
      speed: 8,
      dx: 0
    };

    const ball = {
      x: WIDTH / 2,
      y: HEIGHT - 45,
      radius: 8,
      baseSpeed: 5.5,
      dx: 4,
      dy: -4
    };

    const keys = {
      left: false,
      right: false
    };

    let bricks = [];
    let particles = [];

    const BRICK_COLORS = {
      1: { fill: '#38bdf8', stroke: '#bae6fd', points: 10 },
      2: { fill: '#f59e0b', stroke: '#fde68a', points: 25 },
      3: { fill: '#ec4899', stroke: '#fbcfe8', points: 40 }
    };

    function createBricksForLevel(lvl) {
      bricks = [];
      const rows = lvl === 1 ? 4 : 6;
      const cols = 9;
      const pad = 8;
      const offsetTop = 55;
      const offsetLeft = 36;
      const totalWidth = WIDTH - offsetLeft * 2;
      const brickWidth = (totalWidth - pad * (cols - 1)) / cols;
      const brickHeight = 22;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let hp = 1;
          if (lvl === 1) {
            // Level 1: classic rows, top row has 2 HP
            hp = r === 0 ? 2 : 1;
          } else {
            // Level 2: Fortress & diamond pattern with 1-3 HP bricks
            if ((r === 2 || r === 3) && c === 4) continue; // Center gap
            if (r === 0) hp = 3;
            else if (r === 1 || (r + c) % 2 === 0) hp = 2;
            else hp = 1;
          }

          bricks.push({
            x: offsetLeft + c * (brickWidth + pad),
            y: offsetTop + r * (brickHeight + pad),
            width: brickWidth,
            height: brickHeight,
            hp,
            maxHp: hp
          });
        }
      }
    }

    function resetBallAndPaddle() {
      paddle.width = level === 1 ? 115 : 100;
      paddle.x = (WIDTH - paddle.width) / 2;
      ballOnPaddle = true;
      ball.baseSpeed = level === 1 ? 5.6 : 6.5;
      placeBallOnPaddle();
    }

    function placeBallOnPaddle() {
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius - 1;
    }

    function launchBall() {
      if (!ballOnPaddle || gameState !== 'playing') return;
      ballOnPaddle = false;
      const angle = -Math.PI / 2 + (Math.random() * 0.5 - 0.25);
      ball.dx = ball.baseSpeed * Math.cos(angle);
      ball.dy = ball.baseSpeed * Math.sin(angle);
    }

    function updateHUD() {
      scoreEl.textContent = score;
      levelEl.textContent = `${level} / ${MAX_LEVEL}`;
      livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) || '0';
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3.5;
        particles.push({
          x,
          y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life: 1,
          color
        });
      }
    }

    function showOverlay(title, desc, btnText) {
      overlayTitle.textContent = title;
      overlayDesc.textContent = desc;
      actionBtn.textContent = btnText;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function startNewGame() {
      score = 0;
      lives = 3;
      level = 1;
      particles = [];
      createBricksForLevel(level);
      resetBallAndPaddle();
      updateHUD();
      gameState = 'playing';
      hideOverlay();
    }

    function startNextLevel() {
      level++;
      particles = [];
      createBricksForLevel(level);
      resetBallAndPaddle();
      updateHUD();
      gameState = 'playing';
      hideOverlay();
    }

    // Input handlers
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = true;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = true;
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'playing' && ballOnPaddle) {
          launchBall();
        } else if (gameState !== 'playing') {
          actionBtn.click();
        }
      } else if (e.code === 'KeyP') {
        if (gameState === 'playing') {
          gameState = 'paused';
          showOverlay('Пауза', 'Гра призупинена. Натисніть кнопку або P, щоб продовжити.', 'Продовжити');
        } else if (gameState === 'paused') {
          gameState = 'playing';
          hideOverlay();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = false;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = false;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(WIDTH - paddle.width, mouseX - paddle.width / 2));
      if (ballOnPaddle) {
        placeBallOnPaddle();
      }
    });

    canvas.addEventListener('click', () => {
      if (gameState === 'playing' && ballOnPaddle) {
        launchBall();
      }
    });

    actionBtn.addEventListener('click', () => {
      if (gameState === 'menu' || gameState === 'gameover' || gameState === 'victory') {
        startNewGame();
      } else if (gameState === 'levelclear') {
        startNextLevel();
      } else if (gameState === 'paused') {
        gameState = 'playing';
        hideOverlay();
      }
    });

    function update() {
      if (gameState !== 'playing') return;

      // Keyboard movement
      if (keys.left) {
        paddle.x = Math.max(0, paddle.x - paddle.speed);
      }
      if (keys.right) {
        paddle.x = Math.min(WIDTH - paddle.width, paddle.x + paddle.speed);
      }

      if (ballOnPaddle) {
        placeBallOnPaddle();
      } else {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Wall collisions
        if (ball.x - ball.radius < 0) {
          ball.x = ball.radius;
          ball.dx = -ball.dx;
        } else if (ball.x + ball.radius > WIDTH) {
          ball.x = WIDTH - ball.radius;
          ball.dx = -ball.dx;
        }

        if (ball.y - ball.radius < 0) {
          ball.y = ball.radius;
          ball.dy = -ball.dy;
        }

        // Paddle collision
        if (
          ball.dy > 0 &&
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x - ball.radius &&
          ball.x <= paddle.x + paddle.width + ball.radius
        ) {
          const hitOffset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const clampedOffset = Math.max(-0.9, Math.min(0.9, hitOffset));
          const bounceAngle = clampedOffset * (Math.PI / 3); // up to 60 deg
          const speed = Math.min(9, Math.hypot(ball.dx, ball.dy) * 1.01);

          ball.dx = speed * Math.sin(bounceAngle);
          ball.dy = -Math.abs(speed * Math.cos(bounceAngle));
          ball.y = paddle.y - ball.radius - 1;
        }

        // Brick collisions
        for (let i = bricks.length - 1; i >= 0; i--) {
          const b = bricks[i];
          if (
            ball.x + ball.radius > b.x &&
            ball.x - ball.radius < b.x + b.width &&
            ball.y + ball.radius > b.y &&
            ball.y - ball.radius < b.y + b.height
          ) {
            const overlapLeft = (ball.x + ball.radius) - b.x;
            const overlapRight = (b.x + b.width) - (ball.x - ball.radius);
            const overlapTop = (ball.y + ball.radius) - b.y;
            const overlapBottom = (b.y + b.height) - (ball.y - ball.radius);

            const minOverlapX = Math.min(overlapLeft, overlapRight);
            const minOverlapY = Math.min(overlapTop, overlapBottom);

            if (minOverlapX < minOverlapY) {
              ball.dx = -ball.dx;
            } else {
              ball.dy = -ball.dy;
            }

            const colorInfo = BRICK_COLORS[b.hp] || BRICK_COLORS[1];
            b.hp--;
            score += 10;
            spawnParticles(ball.x, ball.y, colorInfo.fill);

            if (b.hp <= 0) {
              score += colorInfo.points;
              bricks.splice(i, 1);
            }

            updateHUD();
            break;
          }
        }

        // Check level clear
        if (bricks.length === 0) {
          if (level < MAX_LEVEL) {
            gameState = 'levelclear';
            showOverlay(
              'Рівень 1 пройдено!',
              `Чудова робота! Ваш рахунок: ${score}. Готові до складнішого 2-го рівня?`,
              'Рівень 2'
            );
          } else {
            gameState = 'victory';
            showOverlay(
              'Перемога! 🎉',
              `Ви успішно пройшли обидва рівні! Фінальний рахунок: ${score}.`,
              'Грати знову'
            );
          }
        }

        // Bottom loss
        if (ball.y - ball.radius > HEIGHT) {
          lives--;
          updateHUD();
          if (lives <= 0) {
            gameState = 'gameover';
            showOverlay(
              'Гру закінчено',
              `Ви витратили всі життя. Ваш підсумковий рахунок: ${score}.`,
              'Спробувати ще'
            );
          } else {
            ballOnPaddle = true;
            placeBallOnPaddle();
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.life -= 0.03;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Subtle background grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < WIDTH; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
      }
      for (let y = 0; y < HEIGHT; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }

      // Draw bricks
      for (const b of bricks) {
        const style = BRICK_COLORS[b.hp] || BRICK_COLORS[1];
        ctx.fillStyle = style.fill;
        ctx.strokeStyle = style.stroke;
        ctx.lineWidth = 1.5;
        drawRoundedRect(b.x, b.y, b.width, b.height, 5);
        ctx.fill();
        ctx.stroke();

        if (b.hp > 1) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.hp, b.x + b.width / 2, b.y + b.height / 2);
        }
      }

      // Draw paddle
      const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      paddleGrad.addColorStop(0, '#38bdf8');
      paddleGrad.addColorStop(1, '#0284c7');
      ctx.fillStyle = paddleGrad;
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 1.5;
      drawRoundedRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
      ctx.fill();
      ctx.stroke();

      // Draw ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Prompt when ball is on paddle
      if (gameState === 'playing' && ballOnPaddle) {
        ctx.fillStyle = 'rgba(248, 250, 252, 0.75)';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Натисніть ПРОБІЛ або клікніть мишею для запуску', WIDTH / 2, HEIGHT - 75);
      }

      // Draw particles
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    createBricksForLevel(1);
    resetBallAndPaddle();
    updateHUD();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
