<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111827;
    color: #e5e7eb;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 { margin-bottom: 10px; font-size: 28px; letter-spacing: 2px; }
  canvas {
    background: linear-gradient(#0f172a, #1e293b);
    border: 2px solid #334155;
    border-radius: 8px;
    cursor: none;
    max-width: 95vw;
  }
  .help { margin-top: 10px; font-size: 14px; color: #94a3b8; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<h1>🧱 벽돌깨기</h1>
<canvas id="game" width="800" height="560"></canvas>
<div class="help">
  키보드: ← → (또는 A / D) 이동 · Space 발사 · P 일시정지 · Enter 재시작<br>
  마우스: 움직여서 이동 · 클릭으로 발사 / 재시작
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const HUD_H = 40;

  // ----- 레벨 정의 (0: 빈칸, 1~3: 벽돌 내구도) -----
  const LEVELS = [
    {
      name: "레벨 1",
      speed: 5,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "레벨 2",
      speed: 6.2,
      map: [
        "3300000033",
        "2222222222",
        "1121111211",
        "2212222122",
        "1111331111",
        "0222222220",
      ],
    },
  ];

  const COLORS = { 1: "#22c55e", 2: "#f59e0b", 3: "#ef4444" };
  const BRICK_COLS = 10, BRICK_GAP = 6, BRICK_H = 22;
  const BRICK_TOP = HUD_H + 40, BRICK_SIDE = 30;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, dx: 0, dy: 0, stuck: true };

  let bricks = [];
  let level = 0, score = 0, lives = 3;
  let state = "ready"; // ready | playing | paused | levelclear | gameover | win
  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(idx) {
    bricks = [];
    LEVELS[idx].map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H, hp, maxHp: hp,
          });
        }
      });
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.dx = 0; ball.dy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launch() {
    if (!ball.stuck) return;
    const speed = LEVELS[level].speed;
    const angle = (Math.random() * 0.6 - 0.3); // 위쪽 기준 약간 랜덤
    ball.dx = speed * Math.sin(angle);
    ball.dy = -speed * Math.cos(angle);
    ball.stuck = false;
  }

  function newGame() {
    level = 0; score = 0; lives = 3;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "ready";
  }

  function nextLevel() {
    level++;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "ready";
  }

  // 메인 행동: Space / 클릭
  function primaryAction() {
    if (state === "ready") { state = "playing"; launch(); }
    else if (state === "playing" && ball.stuck) launch();
    else if (state === "levelclear") nextLevel();
    else if (state === "gameover" || state === "win") newGame();
    else if (state === "paused") state = "playing";
  }

  // ----- 입력 -----
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    if (e.code === "Space") { e.preventDefault(); primaryAction(); }
    if (e.key === "Enter") {
      if (state === "gameover" || state === "win") newGame();
      else if (state === "levelclear") nextLevel();
    }
    if (e.key === "p" || e.key === "P") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }
    if (["ArrowLeft", "ArrowRight"].includes(e.key)) { e.preventDefault(); mouseX = null; }
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); primaryAction(); });

  // ----- 업데이트 -----
  function update() {
    // 패들 이동 (일시정지/종료 상태가 아니면)
    if (state === "playing" || state === "ready") {
      if (keys.left) { paddle.x -= paddle.speed; mouseX = null; }
      if (keys.right) { paddle.x += paddle.speed; mouseX = null; }
      if (mouseX !== null) paddle.x = mouseX - paddle.w / 2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    }

    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
    }
    if (state !== "playing" || ball.stuck) return;

    // 터널링 방지를 위해 서브스텝 이동
    const steps = Math.ceil(Math.max(Math.abs(ball.dx), Math.abs(ball.dy)) / 4);
    for (let i = 0; i < steps; i++) {
      if (!stepBall(ball.dx / steps, ball.dy / steps)) break;
    }
  }

  // 반환값 false면 이번 프레임 이동 중단
  function stepBall(sx, sy) {
    ball.x += sx;
    ball.y += sy;

    // 벽
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.dy = Math.abs(ball.dy); }

    // 바닥 → 목숨 감소
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = "gameover"; }
      else { resetBall(); }
      return false;
    }

    // 패들
    if (ball.dy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + Math.abs(sy) &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);      // 최대 60도
      const speed = Math.hypot(ball.dx, ball.dy);
      ball.dx = speed * Math.sin(angle);
      ball.dy = -speed * Math.cos(angle);
      ball.y = paddle.y - ball.r - 1;
      return false;
    }

    // 벽돌
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
        // 충돌 방향 판정: 겹침이 적은 축으로 반사
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.dx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.dx) : Math.abs(ball.dx);
        } else {
          ball.dy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.dy) : Math.abs(ball.dy);
        }
        b.hp--;
        score += b.hp <= 0 ? 10 * b.maxHp : 5;

        if (bricks.every(br => br.hp <= 0)) {
          score += lives * 50; // 남은 목숨 보너스
          state = level < LEVELS.length - 1 ? "levelclear" : "win";
          resetBall();
        }
        return false;
      }
    }
    return true;
  }

  // ----- 그리기 -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = "#334155";
    ctx.fillRect(0, HUD_H - 2, W, 2);

    ctx.font = "bold 18px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e5e7eb";
    ctx.textAlign = "left";
    ctx.fillText(`점수: ${score}`, 16, HUD_H / 2);
    ctx.textAlign = "center";
    ctx.fillText(`${LEVELS[level].name} / ${LEVELS.length}`, W / 2, HUD_H / 2);
    ctx.textAlign = "right";
    ctx.fillText("목숨:", W - 16 - 3 * 22, HUD_H / 2);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lives ? "#f43f5e" : "#475569";
      ctx.beginPath();
      ctx.arc(W - 16 - 8 - (2 - i) * 22, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.fillStyle = COLORS[b.hp];
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#60a5fa");
    g.addColorStop(1, "#2563eb");
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.fillStyle = "#f8fafc";
    ctx.shadowColor = "#93c5fd";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function overlay(title, sub, color = "#f8fafc") {
    ctx.fillStyle = "rgba(15,23,42,0.75)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.font = "bold 44px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "18px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillText(sub, W / 2, H / 2 + 28);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    drawBall();
    drawHUD();

    if (state === "ready") {
      ctx.textAlign = "center";
      ctx.fillStyle = "#cbd5e1";
      ctx.font = "20px 'Segoe UI', 'Malgun Gothic', sans-serif";
      ctx.fillText(`${LEVELS[level].name} — Space 또는 클릭으로 시작`, W / 2, H / 2 + 60);
    } else if (state === "playing" && ball.stuck) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#cbd5e1";
      ctx.font = "18px 'Segoe UI', 'Malgun Gothic', sans-serif";
      ctx.fillText("Space 또는 클릭으로 공 발사", W / 2, H / 2 + 60);
    } else if (state === "paused") {
      overlay("일시정지", "P 또는 클릭으로 계속");
    } else if (state === "levelclear") {
      overlay(`${LEVELS[level].name} 클리어!`, "Space / Enter / 클릭으로 다음 레벨", "#4ade80");
    } else if (state === "gameover") {
      overlay("게임 오버", `최종 점수: ${score} — Space / Enter / 클릭으로 재시작`, "#f87171");
    } else if (state === "win") {
      overlay("🎉 승리! 🎉", `최종 점수: ${score} — Space / Enter / 클릭으로 재시작`, "#facc15");
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  loop();
})();
</script>
</body>
</html>
