<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rompe Ladrillos - 2 Niveles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      width: 800px;
      max-width: 95vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 12px 24px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      font-size: 1.1rem;
      font-weight: 600;
    }
    .hud span {
      color: #38bdf8;
    }
    .canvas-wrapper {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      border: 2px solid #334155;
    }
    canvas {
      display: block;
      background: #090d16;
      max-width: 95vw;
      height: auto;
      cursor: none;
    }
    .controls-hint {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div>Puntos: <span id="scoreEl">0</span></div>
    <div>Nivel: <span id="levelEl">1 / 2</span></div>
    <div>Vidas: <span id="livesEl">❤️❤️❤️</span></div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="800" height="540"></canvas>
  </div>

  <div class="controls-hint">
    Controles: Ratón o Flechas Izquierda/Derecha (A / D) &bull; Espacio o Clic para lanzar / reiniciar
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');

    // Estado del juego
    let score = 0;
    let lives = 3;
    let level = 1;
    const maxLevels = 2;
    let gameState = 'START'; // 'START', 'PLAYING', 'LEVEL_TRANSITION', 'WIN', 'GAMEOVER'

    // Paleta
    const paddle = {
      width: 115,
      height: 14,
      x: (canvas.width - 115) / 2,
      y: canvas.height - 32,
      speed: 8,
      dx: 0
    };

    // Pelota
    const ball = {
      radius: 8,
      x: canvas.width / 2,
      y: paddle.y - 8,
      speed: 5.5,
      dx: 4,
      dy: -4
    };

    // Teclado
    let rightPressed = false;
    let leftPressed = false;

    // Ladrillos
    let bricks = [];
    const brickConfig = {
      cols: 10,
      width: 66,
      height: 22,
      padding: 8,
      offsetTop: 55,
      offsetLeft: 34
    };

    const rowColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];

    function createBricks(currentLevel) {
      bricks = [];
      if (currentLevel === 1) {
        // Nivel 1: 4 filas clásicas de 1 golpe
        const rows = 4;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < brickConfig.cols; c++) {
            bricks.push({
              x: brickConfig.offsetLeft + c * (brickConfig.width + brickConfig.padding),
              y: brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding),
              width: brickConfig.width,
              height: brickConfig.height,
              hp: 1,
              maxHp: 1,
              points: (rows - r) * 10,
              color: rowColors[r % rowColors.length]
            });
          }
        }
      } else if (currentLevel === 2) {
        // Nivel 2: 6 filas con patrón y ladrillos blindados (2 golpes)
        const rows = 6;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < brickConfig.cols; c++) {
            // Huecos decorativos para un diseño de fortaleza
            if ((r === 2 || r === 3) && (c === 2 || c === 7)) continue;
            const isArmored = r < 2 || (r === 4 && c % 2 === 0);
            const hp = isArmored ? 2 : 1;
            bricks.push({
              x: brickConfig.offsetLeft + c * (brickConfig.width + brickConfig.padding),
              y: brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding),
              width: brickConfig.width,
              height: brickConfig.height,
              hp: hp,
              maxHp: hp,
              points: isArmored ? 30 : 15,
              color: rowColors[r % rowColors.length]
            });
          }
        }
      }
    }

    function resetBallAndPaddle() {
      paddle.width = level === 1 ? 115 : 100;
      paddle.x = (canvas.width - paddle.width) / 2;
      ball.speed = level === 1 ? 5.5 : 6.6;
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius;
      const angle = (Math.random() * 0.6 - 0.3); // ángulo inicial ligero
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
    }

    function updateHUD() {
      scoreEl.textContent = score;
      levelEl.textContent = `${level} / ${maxLevels}`;
      livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '0';
    }

    function initGame() {
      score = 0;
      lives = 3;
      level = 1;
      createBricks(level);
      resetBallAndPaddle();
      updateHUD();
      gameState = 'START';
    }

    // Eventos de teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        rightPressed = true;
      } else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        leftPressed = true;
      } else if (e.code === 'Space') {
        handleAction();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        rightPressed = false;
      } else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        leftPressed = false;
      }
    });

    // Eventos de ratón
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width / 2));
      if (gameState === 'START' || gameState === 'LEVEL_TRANSITION') {
        ball.x = paddle.x + paddle.width / 2;
      }
    });

    canvas.addEventListener('click', () => {
      handleAction();
    });

    function handleAction() {
      if (gameState === 'START' || gameState === 'LEVEL_TRANSITION') {
        gameState = 'PLAYING';
      } else if (gameState === 'GAMEOVER' || gameState === 'WIN') {
        initGame();
        gameState = 'PLAYING';
      }
    }

    function update() {
      // Movimiento de la paleta por teclado
      if (rightPressed) {
        paddle.x = Math.min(canvas.width - paddle.width, paddle.x + paddle.speed);
      } else if (leftPressed) {
        paddle.x = Math.max(0, paddle.x - paddle.speed);
      }

      if (gameState === 'START' || gameState === 'LEVEL_TRANSITION') {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius;
        return;
      }

      if (gameState !== 'PLAYING') return;

      ball.x += ball.dx;
      ball.y += ball.dy;

      // Rebote en paredes laterales
      if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.dx = -ball.dx;
      } else if (ball.x + ball.radius > canvas.width) {
        ball.x = canvas.width - ball.radius;
        ball.dx = -ball.dx;
      }

      // Rebote en techo
      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.dy = -ball.dy;
      }

      // Rebote en la paleta
      if (
        ball.dy > 0 &&
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x + ball.radius >= paddle.x &&
        ball.x - ball.radius <= paddle.x + paddle.width
      ) {
        const hitOffset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        const maxBounceAngle = Math.PI / 3; // 60 grados
        const bounceAngle = hitOffset * maxBounceAngle;
        ball.dx = ball.speed * Math.sin(bounceAngle);
        ball.dy = -ball.speed * Math.cos(bounceAngle);
        ball.y = paddle.y - ball.radius;
      }

      // Colisión con ladrillos
      for (let i = 0; i < bricks.length; i++) {
        const b = bricks[i];
        if (b.hp > 0) {
          if (
            ball.x + ball.radius > b.x &&
            ball.x - ball.radius < b.x + b.width &&
            ball.y + ball.radius > b.y &&
            ball.y - ball.radius < b.y + b.height
          ) {
            // Determinar eje de rebote
            const overlapLeft = (ball.x + ball.radius) - b.x;
            const overlapRight = (b.x + b.width) - (ball.x - ball.radius);
            const overlapTop = (ball.y + ball.radius) - b.y;
            const overlapBottom = (b.y + b.height) - (ball.y - ball.radius);
            const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

            if (minOverlap === overlapLeft || minOverlap === overlapRight) {
              ball.dx = -ball.dx;
            } else {
              ball.dy = -ball.dy;
            }

            b.hp--;
            if (b.hp === 0) {
              score += b.points;
            } else {
              score += 5;
            }
            updateHUD();
            break;
          }
        }
      }

      // Comprobar si se completó el nivel
      const remainingBricks = bricks.filter(b => b.hp > 0).length;
      if (remainingBricks === 0) {
        if (level < maxLevels) {
          level++;
          createBricks(level);
          resetBallAndPaddle();
          updateHUD();
          gameState = 'LEVEL_TRANSITION';
        } else {
          gameState = 'WIN';
        }
      }

      // Caída de la pelota al fondo
      if (ball.y - ball.radius > canvas.height) {
        lives--;
        updateHUD();
        if (lives <= 0) {
          gameState = 'GAMEOVER';
        } else {
          resetBallAndPaddle();
          gameState = 'START';
        }
      }
    }

    function drawRoundedRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar ladrillos
      for (const b of bricks) {
        if (b.hp > 0) {
          const stroke = b.hp > 1 ? '#f8fafc' : null;
          drawRoundedRect(b.x, b.y, b.width, b.height, 4, b.color, stroke);
          if (b.hp > 1) {
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.fillRect(b.x + 4, b.y + 4, b.width - 8, 4);
          }
        }
      }

      // Dibujar paleta
      drawRoundedRect(paddle.x, paddle.y, paddle.width, paddle.height, 7, '#38bdf8', '#bae6fd');

      // Dibujar pelota
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
      ctx.closePath();

      // Mensajes de estado
      if (gameState !== 'PLAYING') {
        ctx.fillStyle = 'rgba(9, 13, 22, 0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 34px "Segoe UI", sans-serif';

        if (gameState === 'START') {
          ctx.fillText(`NIVEL ${level}`, canvas.width / 2, canvas.height / 2 - 20);
          ctx.font = '20px "Segoe UI", sans-serif';
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('Haz clic o pulsa ESPACIO para lanzar la bola', canvas.width / 2, canvas.height / 2 + 25);
        } else if (gameState === 'LEVEL_TRANSITION') {
          ctx.fillStyle = '#22c55e';
          ctx.fillText('¡NIVEL 1 COMPLETADO!', canvas.width / 2, canvas.height / 2 - 25);
          ctx.font = '20px "Segoe UI", sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText('Prepárate para el Nivel 2 • Haz clic o pulsa ESPACIO', canvas.width / 2, canvas.height / 2 + 20);
        } else if (gameState === 'WIN') {
          ctx.fillStyle = '#eab308';
          ctx.fillText('¡VICTORIA! HAS SUPERADO LOS 2 NIVELES', canvas.width / 2, canvas.height / 2 - 25);
          ctx.font = '22px "Segoe UI", sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText(`Puntuación final: ${score} • Clic o ESPACIO para jugar otra vez`, canvas.width / 2, canvas.height / 2 + 25);
        } else if (gameState === 'GAMEOVER') {
          ctx.fillStyle = '#ef4444';
          ctx.fillText('FIN DEL JUEGO', canvas.width / 2, canvas.height / 2 - 25);
          ctx.font = '22px "Segoe UI", sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText(`Puntuación final: ${score} • Clic o ESPACIO para reintentar`, canvas.width / 2, canvas.height / 2 + 25);
        }
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    loop();
  </script>
</body>
</html>
