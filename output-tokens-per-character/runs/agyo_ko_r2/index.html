<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111827;
    color: #e5e7eb;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  canvas {
    background: #0b1020;
    border: 2px solid #374151;
    border-radius: 8px;
    cursor: none;
    max-width: 100%;
  }
  p.help { margin: 10px 0 0; font-size: 14px; color: #9ca3af; text-align: center; }
</style>
</head>
<body>
<h1>벽돌깨기</h1>
<canvas id="game" width="800" height="600"></canvas>
<p class="help">
  이동: ← → / A D 키 또는 마우스 &nbsp;|&nbsp; 발사: 스페이스바 또는 클릭 &nbsp;|&nbsp; 일시정지: P
</p>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ----- 레벨 정의 (숫자 = 벽돌 내구도, 0 = 빈칸) -----
  const LEVELS = [
    {
      name: "레벨 1",
      speed: 5,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "레벨 2",
      speed: 6,
      map: [
        "2222222222",
        "2011111102",
        "2101111012",
        "2110220112",
        "2101111012",
        "2011111102",
        "2222222222",
      ],
    },
  ];

  const COLORS = {
    1: ["#38bdf8", "#f472b6", "#a3e635", "#facc15", "#fb923c", "#c084fc", "#34d399"],
    2: "#ef4444",
  };

  const BRICK_COLS = 10;
  const BRICK_W = 70, BRICK_H = 22, BRICK_GAP = 6;
  const BRICK_TOP = 70;
  const BRICK_LEFT = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP)) / 2;

  const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 9 };
  const ball = { r: 8, x: 0, y: 0, dx: 0, dy: 0, speed: 5 };

  let bricks = [];
  let score = 0;
  let lives = 3;
  let levelIndex = 0;
  // 상태: ready(발사 대기), playing, paused, levelClear, gameOver, win
  let state = "ready";

  const keys = { left: false, right: false };

  // ----- 초기화 -----
  function buildLevel(idx) {
    const level = LEVELS[idx];
    bricks = [];
    level.map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const hp = parseInt(ch, 10);
        if (hp > 0) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            hp,
            maxHp: hp,
            color: hp >= 2 ? COLORS[2] : COLORS[1][r % COLORS[1].length],
          });
        }
      });
    });
    ball.speed = level.speed;
  }

  function resetBall() {
    paddle.x = W / 2 - paddle.w / 2;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    ball.dx = 0;
    ball.dy = 0;
    state = "ready";
  }

  function newGame() {
    score = 0;
    lives = 3;
    levelIndex = 0;
    buildLevel(levelIndex);
    resetBall();
  }

  function launch() {
    if (state !== "ready") return;
    const angle = (Math.random() * 60 - 30) * Math.PI / 180; // 위쪽 ±30°
    ball.dx = ball.speed * Math.sin(angle);
    ball.dy = -ball.speed * Math.cos(angle);
    state = "playing";
  }

  // 스페이스/클릭 공통 동작
  function action() {
    if (state === "ready") launch();
    else if (state === "levelClear") {
      levelIndex++;
      buildLevel(levelIndex);
      resetBall();
    } else if (state === "gameOver" || state === "win") {
      newGame();
    } else if (state === "paused") {
      state = "playing";
    }
  }

  // ----- 입력 -----
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    if (e.code === "Space") { e.preventDefault(); action(); }
    if (e.key === "p" || e.key === "P") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
    }
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });

  canvas.addEventListener("mousemove", (e) => {
    if (state === "paused") return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = mx - paddle.w / 2;
    clampPaddle();
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); action(); });

  function clampPaddle() {
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  // ----- 업데이트 -----
  function update() {
    if (state === "paused" || state === "gameOver" || state === "win" || state === "levelClear") return;

    if (keys.left) paddle.x -= paddle.speed;
    if (keys.right) paddle.x += paddle.speed;
    clampPaddle();

    if (state === "ready") {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }

    // 터널링 방지를 위해 여러 단계로 나눠 이동
    const steps = Math.ceil(ball.speed / 2);
    for (let i = 0; i < steps; i++) {
      ball.x += ball.dx / steps;
      ball.y += ball.dy / steps;
      if (stepCollisions()) break;
    }
  }

  // true를 반환하면 이번 프레임의 이동 중단
  function stepCollisions() {
    // 벽
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // 바닥 → 목숨 감소
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { lives = 0; state = "gameOver"; }
      else resetBall();
      return true;
    }

    // 패들
    if (ball.dy > 0 &&
        ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.r &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
      const angle = Math.max(-1, Math.min(1, hit)) * 60 * Math.PI / 180;
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r;
    }

    // 벽돌
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
        // 겹침이 작은 축으로 반사
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx;
        else ball.dy = -ball.dy;

        b.hp--;
        score += b.hp === 0 ? 10 * b.maxHp : 5;

        if (bricks.every(br => br.hp <= 0)) {
          score += lives * 100; // 남은 목숨 보너스
          state = levelIndex < LEVELS.length - 1 ? "levelClear" : "win";
        }
        return true;
      }
    }
    return false;
  }

  // ----- 그리기 -----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e5e7eb";
    ctx.font = "bold 20px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText(`점수: ${score}`, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("목숨:", W - 20 - 3 * 24, 30);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lives ? "#ef4444" : "#374151";
      ctx.font = "20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("♥", W - 20 - (2 - i) * 24 - 10, 31);
    }
    ctx.strokeStyle = "#1f2937";
    ctx.beginPath();
    ctx.moveTo(0, 52); ctx.lineTo(W, 52);
    ctx.stroke();
  }

  function drawBricks() {
    for (const b of bricks) {
      if (b.hp <= 0) continue;
      ctx.fillStyle = b.maxHp >= 2 && b.hp === 1 ? "#fca5a5" : b.color;
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 3, BRICK_W - 6, 4);
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#e0e7ff");
    g.addColorStop(1, "#6366f1");
    ctx.fillStyle = g;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#fde68a";
    ctx.shadowColor = "#fde68a";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 44px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.font = "20px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillText(sub, W / 2, H / 2 + 25);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();
    drawBricks();
    drawPaddle();
    drawBall();

    if (state === "ready") {
      ctx.fillStyle = "#9ca3af";
      ctx.font = "18px 'Segoe UI', 'Malgun Gothic', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("스페이스바 또는 클릭으로 공 발사", W / 2, H / 2 + 80);
    } else if (state === "paused") {
      drawOverlay("일시정지", "P 키 또는 클릭으로 계속");
    } else if (state === "levelClear") {
      drawOverlay(`${LEVELS[levelIndex].name} 클리어!`, "스페이스바 또는 클릭으로 다음 레벨");
    } else if (state === "gameOver") {
      drawOverlay("게임 오버", `최종 점수: ${score} — 스페이스바 또는 클릭으로 재시작`);
    } else if (state === "win") {
      drawOverlay("축하합니다! 모든 레벨 클리어!", `최종 점수: ${score} — 스페이스바 또는 클릭으로 재시작`);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  loop();
})();
</script>
</body>
</html>
