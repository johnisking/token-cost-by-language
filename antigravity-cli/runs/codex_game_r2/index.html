<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Breaker</title>
<style>
:root{color-scheme:dark;--ink:#eef4ff;--muted:#93a4c2;--cyan:#66f2e2;--pink:#ff6da8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#172649 0,#0b1020 55%,#070a13 100%);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:22px}.game{width:min(100%,760px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 2px 12px}.brand{font-size:clamp(20px,4vw,28px);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.brand span{color:var(--cyan)}.stats{display:flex;gap:10px}.stat{min-width:88px;padding:7px 12px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff08;text-align:center}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.stat b{font-size:19px}.frame{position:relative;border:1px solid #a8c7ff30;border-radius:18px;padding:8px;background:linear-gradient(145deg,#ffffff12,#ffffff03);box-shadow:0 24px 80px #0008,0 0 40px #38d8dc12;overflow:hidden}canvas{display:block;width:100%;height:auto;border-radius:11px;background:#080e20;touch-action:none}.overlay{position:absolute;inset:8px;display:grid;place-items:center;border-radius:11px;background:#071023bd;backdrop-filter:blur(5px);text-align:center;padding:24px;transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.card{max-width:390px}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--cyan);font-weight:700;text-transform:uppercase}.card h1{font-size:clamp(27px,6vw,42px);line-height:1.05;margin:8px 0 10px}.card p{color:#b7c5df;margin:0 0 20px}.button{border:0;border-radius:999px;padding:12px 23px;background:linear-gradient(100deg,#66f2e2,#7db8ff);color:#07111c;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 8px 24px #55dfea30}.button:hover{filter:brightness(1.08);transform:translateY(-1px)}.hint{text-align:center;color:var(--muted);font-size:12px;margin:12px 0}.hint kbd{border:1px solid #ffffff32;border-radius:5px;padding:2px 6px;color:#dbe8ff;background:#ffffff0b}@media(max-width:500px){body{padding:12px}.stat{min-width:68px;padding:5px 8px}.stats{gap:6px}.hint{font-size:11px}}
</style>
</head>
<body>
<main class="game">
<header><div class="brand">Neon <span>Breaker</span></div><div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Level</small><b id="level">1 / 2</b></div><div class="stat"><small>Lives</small><b id="lives">3</b></div></div></header>
<div class="frame"><canvas id="game" width="720" height="520" aria-label="Brick breaker game"></canvas><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">Ready when you are</div><h1 id="title">Break the<br>neon wall.</h1><p id="message">Clear both levels and keep the ball in play. Move your paddle to aim your shots.</p><button class="button" id="action">Start game</button></div></div></div>
<p class="hint"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move · Move mouse to steer · <kbd>Space</kbd> to launch</p>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');
const scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),livesEl=document.querySelector('#lives');
const W=720,H=520, paddle={w:112,h:13,x:304,y:477,speed:7.5}, ball={x:360,y:460,r:8,vx:0,vy:0};
let score=0,lives=3,level=1,bricks=[],running=false,launched=false,keys={},last=0,raf=0;
const palettes=[['#ff6584','#ff9e68','#ffd166','#62e6bf','#64b5ff'],['#ff4d9d','#b66cff','#7587ff','#4bdcff','#73f2cc']];
function makeBricks(){bricks=[];const rows=level===1?5:6,cols=10,gap=8,bw=60,bh=20,left=(W-(cols*bw+(cols-1)*gap))/2,top=68;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level===2&&((r===0&&(c===0||c===9))||(r===5&&(c===0||c===9))))continue;bricks.push({x:left+c*(bw+gap),y:top+r*(bh+9),w:bw,h:bh,hp:level===2&&r<2?2:1,color:palettes[level-1][r%5]})}}
function updateHud(){scoreEl.textContent=score;levelEl.textContent=level+' / 2';livesEl.textContent=lives}
function parkBall(){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=ball.vy=0;launched=false}
function newGame(){score=0;lives=3;level=1;paddle.x=(W-paddle.w)/2;makeBricks();parkBall();updateHud();hideOverlay();running=true;last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function hideOverlay(){overlay.classList.add('hidden')}function showOverlay(ey,title,msg,button){document.querySelector('#eyebrow').textContent=ey;document.querySelector('#title').innerHTML=title;document.querySelector('#message').textContent=msg;document.querySelector('#action').textContent=button;overlay.classList.remove('hidden')}
function launch(){if(!running)return;if(!launched){launched=true;const dir=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=dir*3.4;ball.vy=-5.1}}
function movePaddle(x){paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));if(!launched)parkBall()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1630');g.addColorStop(1,'#080d1b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// subtle stars
for(let i=0;i<34;i++){let x=(i*137+29)%W,y=(i*83+17)%H;ctx.fillStyle=`rgba(160,203,255,${.12+(i%3)*.08})`;ctx.fillRect(x,y,2,2)}
for(const b of bricks){ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=10;let gr=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);gr.addColorStop(0,b.color);gr.addColorStop(1,b.color+'aa');ctx.fillStyle=gr;roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.restore();if(b.hp>1){ctx.fillStyle='#fff9';ctx.fillRect(b.x+5,b.y+4,b.w-10,2)}}
ctx.save();ctx.shadowColor='#66f2e2';ctx.shadowBlur=18;let pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);pg.addColorStop(0,'#d6fffa');pg.addColorStop(1,'#48d7d4');ctx.fillStyle=pg;roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.restore();
ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=16;const bg=ctx.createRadialGradient(ball.x-2,ball.y-3,1,ball.x,ball.y,ball.r);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#a6c9ff');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore();
if(!launched&&running){ctx.fillStyle='#a8bddc';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('PRESS SPACE OR CLICK TO LAUNCH',W/2,430)}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function loop(ts){if(!running)return;const dt=Math.min((ts-last||16.67)/16.67,2);last=ts;if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=paddle.speed*dt;if(keys.ArrowRight||keys.d||keys.D)paddle.x+=paddle.speed*dt;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r+8){ball.y=ball.r+8;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.y=paddle.y-ball.r;const offset=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);const speed=Math.min(8.4,Math.hypot(ball.vx,ball.vy)+.08);ball.vx=offset*speed*.88;ball.vy=-Math.sqrt(Math.max(12,speed*speed-ball.vx*ball.vx))}for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){const px=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r)),py=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));if(px<py)ball.vx*=-1;else ball.vy*=-1;b.hp--;if(!b.hp){bricks.splice(i,1);score+=level===1?10:20;updateHud()}break}}if(ball.y-ball.r>H){lives--;updateHud();if(lives<=0){running=false;showOverlay('Run complete','Out of lives.','You scored '+score+' points. Give it another shot?','Play again')}else parkBall()}if(bricks.length===0){if(level===1){level=2;makeBricks();parkBall();updateHud();showOverlay('Level 1 clear','Nice work.','Level 2 is quicker and some bricks take two hits.','Continue');running=false}else{running=false;showOverlay('You did it','Wall demolished.','Both levels cleared with '+score+' points.','Play again')}}}draw();if(running)raf=requestAnimationFrame(loop)}
function resume(){if(document.querySelector('#action').textContent==='Start game'||document.querySelector('#action').textContent==='Play again'){newGame();launch()}else{hideOverlay();running=true;last=0;raf=requestAnimationFrame(loop)}}
document.querySelector('#action').addEventListener('click',resume);canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();movePaddle((e.clientX-r.left)*W/r.width)});canvas.addEventListener('pointerdown',e=>{if(!running){resume()}else launch();canvas.setPointerCapture?.(e.pointerId)});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '){if(!running&&overlay.classList.contains('hidden')===false)resume();else launch()}});window.addEventListener('keyup',e=>keys[e.key]=false);
makeBricks();updateHud();draw();
})();
</script>
</body>
</html>
