<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#eee}
  canvas{background:#1b1f3a;border:2px solid #444;cursor:none;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const LEVELS = [
  // Level 1: simple rows
  [
    "1111111111",
    "1111111111",
    "2222222222",
    "2222222222",
    "3333333333"
  ],
  // Level 2: pattern with tougher bricks (number = hits needed)
  [
    "3330000333",
    "2223333222",
    "1122222211",
    "0112332110",
    "3311111133",
    "0220220220"
  ]
];
const COLORS = {1:'#4fc3f7', 2:'#ffb74d', 3:'#e57373'};

const paddle = {w:110, h:14, x:W/2-55, y:H-40, speed:8};
const ball = {r:8, x:0, y:0, dx:0, dy:0, stuck:true};
let bricks = [], level = 0, score = 0, lives = 3;
let state = 'start'; // start, play, levelclear, over, win
const keys = {};

function buildLevel(n){
  bricks = [];
  const rows = LEVELS[n], cols = rows[0].length;
  const pad = 6, top = 70, side = 30;
  const bw = (W - side*2 - pad*(cols-1)) / cols, bh = 22;
  rows.forEach((row, r) => {
    [...row].forEach((ch, c) => {
      const hp = +ch;
      if (hp > 0) bricks.push({x: side + c*(bw+pad), y: top + r*(bh+pad), w: bw, h: bh, hp, max: hp});
    });
  });
}

function resetBall(){
  ball.stuck = true;
  ball.dx = 0; ball.dy = 0;
  paddle.x = W/2 - paddle.w/2;
}

function launch(){
  if (!ball.stuck) return;
  const sp = 5 + level * 1.2;
  const ang = (-Math.PI/2) + (Math.random()*0.6 - 0.3);
  ball.dx = sp * Math.cos(ang);
  ball.dy = sp * Math.sin(ang);
  ball.stuck = false;
}

function newGame(){
  level = 0; score = 0; lives = 3;
  buildLevel(level); resetBall(); state = 'play';
}

function action(){
  if (state === 'start' || state === 'over' || state === 'win') newGame();
  else if (state === 'levelclear'){ level++; buildLevel(level); resetBall(); state = 'play'; }
  else if (state === 'play') launch();
}

// Keyboard
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); action(); }
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Mouse
cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});
cv.addEventListener('mousedown', e => { e.preventDefault(); action(); });

function update(){
  if (state !== 'play') return;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck){
    ball.x = paddle.x + paddle.w/2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }

  // Sub-step to avoid tunneling
  const steps = Math.ceil(Math.max(Math.abs(ball.dx), Math.abs(ball.dy)) / 4);
  for (let s = 0; s < steps; s++){
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;

    // Walls
    if (ball.x < ball.r){ ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x > W - ball.r){ ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y < ball.r){ ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // Paddle
    if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r){
      const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2); // -1..1
      const sp = Math.hypot(ball.dx, ball.dy);
      const ang = Math.max(-1, Math.min(1, hit)) * (Math.PI/3);
      ball.dx = sp * Math.sin(ang);
      ball.dy = -sp * Math.cos(ang);
      ball.y = paddle.y - ball.r;
    }

    // Bricks
    for (let i = 0; i < bricks.length; i++){
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx*ddx + ddy*ddy <= ball.r*ball.r){
        // Determine bounce axis by penetration
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
        b.hp--;
        score += 10;
        if (b.hp <= 0){ score += 10 * b.max; bricks.splice(i, 1); }
        break;
      }
    }

    // Lost ball
    if (ball.y - ball.r > H){
      lives--;
      if (lives <= 0){ state = 'over'; }
      else resetBall();
      return;
    }
  }

  if (bricks.length === 0){
    state = (level + 1 >= LEVELS.length) ? 'win' : 'levelclear';
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

function centerText(lines){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  lines.forEach((l, i) => {
    ctx.font = i === 0 ? 'bold 44px Arial' : '20px Arial';
    ctx.fillStyle = i === 0 ? '#fff' : '#ccc';
    ctx.fillText(l, W/2, H/2 - 40 + i * 40 + (i ? 10 : 0));
  });
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'left'; ctx.fillText('Score: ' + score, 20, 35);
  ctx.textAlign = 'center'; ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W/2, 35);
  ctx.textAlign = 'right'; ctx.fillText('Lives: ' + '\u2764'.repeat(Math.max(0, lives)), W - 20, 35);

  // Bricks
  bricks.forEach(b => {
    ctx.fillStyle = COLORS[b.hp];
    roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.stroke();
  });

  // Paddle
  ctx.fillStyle = '#e0e0e0';
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();

  // Ball
  if (state === 'play' || state === 'levelclear'){
    ctx.fillStyle = '#fff176';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  }

  if (state === 'play' && ball.stuck){
    ctx.fillStyle = '#aaa'; ctx.font = '18px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Press SPACE or click to launch', W/2, H/2 + 80);
  }

  if (state === 'start') centerText(['BRICK BREAKER', 'Move: Mouse or \u2190 \u2192 / A D', 'Click or press SPACE to start']);
  if (state === 'levelclear') centerText(['LEVEL ' + (level + 1) + ' CLEAR!', 'Score: ' + score, 'Click or press SPACE for next level']);
  if (state === 'over') centerText(['GAME OVER', 'Final score: ' + score, 'Click or press SPACE to play again']);
  if (state === 'win') centerText(['YOU WIN!', 'Final score: ' + score, 'Click or press SPACE to play again']);
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
buildLevel(0); resetBall();
ball.x = paddle.x + paddle.w/2; ball.y = paddle.y - ball.r - 1;
loop();
</script>
</body>
</html>
