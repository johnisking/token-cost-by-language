<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10121a;
    color: #e8e8f0;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #1a1d2b;
    border: 2px solid #3a3f5c;
    border-radius: 6px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
  }
  #help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa0bc;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Mouse: move paddle, click to launch &nbsp;|&nbsp;
  Keyboard: ← → or A / D to move, Space to launch, P to pause, Enter to restart
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ---- Configuration ----
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 600;
  const BALL_R = 8;
  const START_LIVES = 3;
  const BRICK_ROWS_TOP = 70;
  const BRICK_GAP = 6;
  const BRICK_H = 22;
  const COLORS = ["#ff5c7a", "#ff9f43", "#feca57", "#1dd1a1", "#48dbfb", "#a29bfe"];

  // Level layouts: '.' = empty, '1' = normal brick, '2' = tough brick (2 hits)
  const LEVELS = [
    {
      speed: 340,
      map: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      speed: 400,
      map: [
        "2222222222",
        "1.11..11.1",
        "1122112211",
        "1.11..11.1",
        "2211111122",
        "1111..1111",
      ],
    },
  ];

  // ---- State ----
  let state = "ready";      // ready | playing | paused | levelClear | gameOver | win
  let level = 0;
  let score = 0;
  let lives = START_LIVES;
  let bricks = [];
  const paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, stuck: true };
  const keys = { left: false, right: false };
  let mouseX = null;

  function buildLevel(n) {
    const map = LEVELS[n].map;
    const cols = map[0].length;
    const bw = (W - 40 - BRICK_GAP * (cols - 1)) / cols;
    bricks = [];
    map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        const hp = Number(ch);
        bricks.push({
          x: 20 + c * (bw + BRICK_GAP),
          y: BRICK_ROWS_TOP + r * (BRICK_H + BRICK_GAP),
          w: bw, h: BRICK_H,
          hp, maxHp: hp,
          color: COLORS[r % COLORS.length],
        });
      });
    });
  }

  function resetBall() {
    ball.stuck = true;
    ball.vx = 0;
    ball.vy = 0;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    if (!ball.stuck) return;
    const speed = LEVELS[level].speed;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
    ball.stuck = false;
  }

  function newGame() {
    level = 0;
    score = 0;
    lives = START_LIVES;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "ready";
  }

  function nextLevel() {
    level++;
    buildLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    state = "ready";
  }

  // Primary action: launch / continue / restart
  function action() {
    switch (state) {
      case "ready": state = "playing"; launchBall(); break;
      case "playing": launchBall(); break;
      case "paused": state = "playing"; break;
      case "levelClear": nextLevel(); break;
      case "gameOver":
      case "win": newGame(); break;
    }
  }

  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }

  // ---- Input ----
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; mouseX = null; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; mouseX = null; e.preventDefault(); }
    else if (k === " " || k === "Spacebar") { action(); e.preventDefault(); }
    else if (k === "Enter") {
      if (state === "gameOver" || state === "win" || state === "levelClear" || state === "ready") action();
      e.preventDefault();
    }
    else if (k === "p" || k === "P" || k === "Escape") togglePause();
  });
  document.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); action(); });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "playing") state = "paused";
  });

  // ---- Physics ----
  function circleRectHit(b, r) {
    const cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
    const cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
    const dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  function updatePaddle(dt) {
    if (state === "paused") return;
    if (keys.left || keys.right) {
      paddle.x += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * PADDLE_SPEED * dt;
    } else if (mouseX !== null) {
      paddle.x = mouseX - paddle.w / 2;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRectHit(ball, paddle)) {
      const speed = Math.hypot(ball.vx, ball.vy);
      const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const clamped = Math.max(-1, Math.min(1, rel));
      const angle = clamped * (Math.PI / 3); // up to 60° from vertical
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (one hit per step)
    for (let i = 0; i < bricks.length; i++) {
      const br = bricks[i];
      if (!circleRectHit(ball, br)) continue;

      // Decide bounce axis by penetration depth
      const overlapX = Math.min(ball.x + ball.r - br.x, br.x + br.w - (ball.x - ball.r));
      const overlapY = Math.min(ball.y + ball.r - br.y, br.y + br.h - (ball.y - ball.r));
      if (overlapX < overlapY) {
        ball.vx = ball.x < br.x + br.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
      } else {
        ball.vy = ball.y < br.y + br.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
      }

      br.hp--;
      if (br.hp <= 0) {
        score += br.maxHp * 10 * (level + 1);
        bricks.splice(i, 1);
      } else {
        score += 5;
      }
      // Slight speed up per hit, capped
      const speed = Math.hypot(ball.vx, ball.vy);
      const target = Math.min(speed * 1.01, LEVELS[level].speed * 1.6);
      ball.vx *= target / speed;
      ball.vy *= target / speed;
      break;
    }

    // Fell below
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        lives = 0;
        state = "gameOver";
      } else {
        resetBall();
      }
      return false;
    }

    if (bricks.length === 0) {
      state = level + 1 < LEVELS.length ? "levelClear" : "win";
      resetBall();
      return false;
    }
    return true;
  }

  function update(dt) {
    updatePaddle(dt);
    if (ball.stuck) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      return;
    }
    if (state !== "playing") return;
    // Sub-step to avoid tunneling
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r / 2)));
    for (let s = 0; s < steps; s++) {
      if (!stepBall(dt / steps)) break;
    }
  }

  // ---- Rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "#e8e8f0";
    ctx.font = "bold 20px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 30);
    ctx.textAlign = "center";
    ctx.fillText("Level " + (level + 1) + " / " + LEVELS.length, W / 2, 30);
    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 20 - START_LIVES * 22, 30);
    for (let i = 0; i < START_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 20 - (START_LIVES - 1 - i) * 22 - 8, 30, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5c7a" : "#3a3f5c";
      ctx.fill();
    }
    ctx.strokeStyle = "#2c3148";
    ctx.beginPath();
    ctx.moveTo(0, 52);
    ctx.lineTo(W, 52);
    ctx.stroke();
  }

  function drawBricks() {
    for (const b of bricks) {
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
      }
    }
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#c8d6ff");
    g.addColorStop(1, "#5f7cff");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
  }

  function overlay(title, sub) {
    ctx.fillStyle = "rgba(10, 12, 20, 0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 44px Segoe UI, Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.font = "20px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = "#c0c6e0";
    ctx.fillText(sub, W / 2, H / 2 + 30);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHUD();
    drawBricks();
    drawPaddle();
    drawBall();

    switch (state) {
      case "ready":
        overlay("Level " + (level + 1), "Click or press Space to launch");
        break;
      case "paused":
        overlay("Paused", "Press P, Space or click to resume");
        break;
      case "levelClear":
        overlay("Level Cleared!", "Click or press Space for Level " + (level + 2));
        break;
      case "gameOver":
        overlay("Game Over", "Score: " + score + "  —  Click or press Enter to restart");
        break;
      case "win":
        overlay("You Win!", "Final score: " + score + "  —  Click or press Enter to play again");
        break;
      case "playing":
        if (ball.stuck) {
          ctx.fillStyle = "#9aa0bc";
          ctx.textAlign = "center";
          ctx.font = "18px Segoe UI, Arial, sans-serif";
          ctx.fillText("Click or press Space to launch", W / 2, H / 2 + 60);
        }
        break;
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
