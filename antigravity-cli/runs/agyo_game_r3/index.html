<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; font-family: sans-serif; color: #eee; }
  canvas { background: #1b1f2a; border: 2px solid #444; cursor: none; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const LEVELS = [
  // Level 1: simple rows
  [
    "1111111111",
    "1111111111",
    "2222222222",
    "2222222222",
    "3333333333"
  ],
  // Level 2: pattern with tougher bricks (number = hits needed)
  [
    "3330000333",
    "2222222222",
    "1310110131",
    "2222222222",
    "0333333330",
    "1111111111"
  ]
];
const COLORS = { 1: '#4fc3f7', 2: '#81c784', 3: '#ffb74d' };

const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 22, BRICK_PAD = 6;
const BRICK_OFFSET_X = (W - (BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_PAD)) / 2;
const BRICK_OFFSET_Y = 70;

const paddle = { w: 110, h: 14, x: W / 2 - 55, y: H - 40, speed: 8 };
const ball = { x: 0, y: 0, r: 8, dx: 0, dy: 0, speed: 5 };

let bricks = [], score = 0, lives = 3, level = 0;
let state = 'start'; // start, serve, play, levelclear, gameover, win
const keys = {};

function loadLevel(n) {
  bricks = [];
  LEVELS[n].forEach((row, r) => {
    [...row].forEach((ch, c) => {
      const hp = parseInt(ch, 10);
      if (hp > 0) bricks.push({
        x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_PAD),
        y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_PAD),
        hp, maxHp: hp
      });
    });
  });
  ball.speed = 5 + n * 1.2;
  resetBall();
}

function resetBall() {
  paddle.x = W / 2 - paddle.w / 2;
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
  ball.dx = 0; ball.dy = 0;
  state = 'serve';
}

function launch() {
  const angle = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
  ball.dx = Math.cos(angle) * ball.speed;
  ball.dy = Math.sin(angle) * ball.speed;
  state = 'play';
}

function newGame() {
  score = 0; lives = 3; level = 0;
  loadLevel(level);
}

function action() {
  if (state === 'start' || state === 'gameover' || state === 'win') newGame();
  else if (state === 'serve') launch();
  else if (state === 'levelclear') { level++; loadLevel(level); }
}

// Keyboard
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { action(); e.preventDefault(); }
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Mouse
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
});
canvas.addEventListener('mousedown', action);

function update() {
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (state === 'serve') {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
    return;
  }
  if (state !== 'play') return;

  // Sub-step to avoid tunneling
  const steps = 4;
  for (let s = 0; s < steps; s++) {
    ball.x += ball.dx / steps;
    ball.y += ball.dy / steps;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

    // Paddle
    if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + ball.speed &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const angle = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
      ball.dx = Math.sin(angle) * ball.speed;
      ball.dy = -Math.cos(angle) * ball.speed;
      ball.y = paddle.y - ball.r;
    }

    // Bricks
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const cx = Math.max(b.x, Math.min(ball.x, b.x + BRICK_W));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + BRICK_H));
      const ddx = ball.x - cx, ddy = ball.y - cy;
      if (ddx * ddx + ddy * ddy <= ball.r * ball.r) {
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + BRICK_W - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + BRICK_H - (ball.y - ball.r));
        if (overlapX < overlapY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
        b.hp--;
        score += 10;
        if (b.hp <= 0) { bricks.splice(i, 1); score += 10 * b.maxHp; }
        break;
      }
    }

    if (bricks.length === 0) {
      state = level < LEVELS.length - 1 ? 'levelclear' : 'win';
      return;
    }

    // Lost ball
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) { state = 'gameover'; }
      else resetBall();
      return;
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCenterText(lines) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H / 2 - 80, W, 160);
  ctx.textAlign = 'center';
  lines.forEach((l, i) => {
    ctx.font = i === 0 ? 'bold 40px sans-serif' : '20px sans-serif';
    ctx.fillStyle = i === 0 ? '#fff' : '#ccc';
    ctx.fillText(l, W / 2, H / 2 - 20 + i * 40);
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 16, 32);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + (level + 1) + ' / ' + LEVELS.length, W / 2, 32);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + '\u2665'.repeat(Math.max(0, lives)), W - 16, 32);

  // Bricks
  bricks.forEach(b => {
    ctx.fillStyle = COLORS[b.hp];
    roundRect(b.x, b.y, BRICK_W, BRICK_H, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.stroke();
  });

  // Paddle
  ctx.fillStyle = '#e0e0e0';
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
  ctx.fill();

  // Ball
  if (state !== 'gameover') {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ff5252';
    ctx.fill();
  }

  const ctrl = 'Move: Mouse or \u2190/\u2192 (A/D)';
  if (state === 'start') drawCenterText(['BRICK BREAKER', ctrl, 'Click or press Space to start']);
  else if (state === 'serve') {
    ctx.textAlign = 'center'; ctx.font = '18px sans-serif'; ctx.fillStyle = '#aaa';
    ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 80);
  }
  else if (state === 'levelclear') drawCenterText(['LEVEL ' + (level + 1) + ' CLEAR!', 'Score: ' + score, 'Click or press Space for next level']);
  else if (state === 'gameover') drawCenterText(['GAME OVER', 'Final score: ' + score, 'Click or press Space to restart']);
  else if (state === 'win') drawCenterText(['YOU WIN!', 'Final score: ' + score, 'Click or press Space to play again']);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loadLevel(0);
state = 'start';
loop();
</script>
</body>
</html>
