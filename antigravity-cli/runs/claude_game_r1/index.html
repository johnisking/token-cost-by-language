<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #10131c;
    color: #e8ecf4;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  canvas {
    background: linear-gradient(#1b2133, #0d1018);
    border: 2px solid #3a4560;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 86vh;
    cursor: none;
    touch-action: none;
  }
  #help {
    margin-top: 10px;
    font-size: 14px;
    color: #9aa6c0;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="help">
  Move: Mouse or &larr; / &rarr; (A / D) &nbsp;|&nbsp; Launch: Click or Space &nbsp;|&nbsp; Pause: P / Esc
</div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const HUD_H = 40;
  const PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 40, PADDLE_SPEED = 560;
  const BALL_R = 8;
  const MAX_LIVES = 3;

  // Level layouts: each char is a brick. '.' = empty, '1' = normal, '2' = tough (2 hits), '3' = very tough (3 hits)
  const LEVELS = [
    {
      name: "Level 1",
      speed: 340,
      rows: [
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
        "1111111111",
      ],
    },
    {
      name: "Level 2",
      speed: 400,
      rows: [
        "3.3.33.3.3",
        "2222222222",
        "12.2112.21",
        "1111111111",
        "2.22..22.2",
        "1111111111",
      ],
    },
  ];

  const ROW_COLORS = ["#ff5d73", "#ff9f43", "#feca57", "#1dd1a1", "#48dbfb", "#a29bfe"];

  // ---- State ----
  let state = "title"; // title | serve | play | paused | levelClear | gameOver | win
  let levelIndex = 0;
  let score = 0;
  let lives = MAX_LIVES;
  let bricks = [];
  let particles = [];
  let stateTimer = 0;

  const paddle = { x: W / 2 - PADDLE_W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, speed: 0 };

  const keys = { left: false, right: false };

  // ---- Setup ----
  function buildLevel(i) {
    bricks = [];
    const layout = LEVELS[i].rows;
    const cols = layout[0].length;
    const pad = 6;
    const marginX = 30;
    const top = HUD_H + 40;
    const bw = (W - marginX * 2 - pad * (cols - 1)) / cols;
    const bh = 22;
    layout.forEach((row, r) => {
      for (let c = 0; c < cols; c++) {
        const ch = row[c];
        if (ch === ".") continue;
        const hp = parseInt(ch, 10);
        bricks.push({
          x: marginX + c * (bw + pad),
          y: top + r * (bh + pad),
          w: bw,
          h: bh,
          hp,
          maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
          alive: true,
        });
      }
    });
  }

  function resetBall() {
    ball.speed = LEVELS[levelIndex].speed;
    ball.vx = 0;
    ball.vy = 0;
    stickBall();
  }

  function stickBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 1;
  }

  function launchBall() {
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    state = "play";
  }

  function startGame() {
    levelIndex = 0;
    score = 0;
    lives = MAX_LIVES;
    startLevel();
  }

  function startLevel() {
    buildLevel(levelIndex);
    paddle.x = W / 2 - paddle.w / 2;
    particles = [];
    resetBall();
    state = "serve";
  }

  // ---- Input ----
  function primaryAction() {
    switch (state) {
      case "title": startGame(); break;
      case "serve": launchBall(); break;
      case "paused": state = "play"; break;
      case "levelClear":
        if (stateTimer <= 0) { levelIndex++; startLevel(); }
        break;
      case "gameOver":
      case "win": startGame(); break;
    }
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
    else if (k === " " || k === "Enter") { if (!e.repeat) primaryAction(); e.preventDefault(); }
    else if (k === "p" || k === "P" || k === "Escape") { togglePause(); e.preventDefault(); }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
  });
  window.addEventListener("blur", () => {
    keys.left = keys.right = false;
    if (state === "play") state = "paused";
  });

  function pointerToCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  function movePaddleTo(x) {
    if (state === "paused") return;
    paddle.x = clamp(x - paddle.w / 2, 0, W - paddle.w);
  }

  canvas.addEventListener("mousemove", (e) => movePaddleTo(pointerToCanvasX(e.clientX)));
  canvas.addEventListener("mousedown", (e) => {
    if (e.button === 0) primaryAction();
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  // Touch support as a bonus
  canvas.addEventListener("touchmove", (e) => {
    movePaddleTo(pointerToCanvasX(e.touches[0].clientX));
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchstart", (e) => {
    movePaddleTo(pointerToCanvasX(e.touches[0].clientX));
    primaryAction();
    e.preventDefault();
  }, { passive: false });

  // ---- Helpers ----
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function spawnParticles(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  // Circle-rectangle collision; returns normal of the hit or null
  function circleRectHit(cx, cy, r, rect) {
    const nx = clamp(cx, rect.x, rect.x + rect.w);
    const ny = clamp(cy, rect.y, rect.y + rect.h);
    const dx = cx - nx, dy = cy - ny;
    if (dx * dx + dy * dy > r * r) return null;
    // Determine side by penetration depth
    const overlapL = cx + r - rect.x;
    const overlapR = rect.x + rect.w - (cx - r);
    const overlapT = cy + r - rect.y;
    const overlapB = rect.y + rect.h - (cy - r);
    const minX = Math.min(overlapL, overlapR);
    const minY = Math.min(overlapT, overlapB);
    if (minX < minY) return { axis: "x", sign: overlapL < overlapR ? -1 : 1, depth: minX };
    return { axis: "y", sign: overlapT < overlapB ? -1 : 1, depth: minY };
  }

  // ---- Update ----
  function update(dt) {
    // Particles always animate
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 400 * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);

    if (stateTimer > 0) stateTimer -= dt;

    if (state === "paused" || state === "title" || state === "gameOver" || state === "win" || state === "levelClear") return;

    // Paddle keyboard movement
    let dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;
    if (dir !== 0) paddle.x = clamp(paddle.x + dir * PADDLE_SPEED * dt, 0, W - paddle.w);

    if (state === "serve") {
      stickBall();
      return;
    }

    // Substep the ball to prevent tunneling
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      if (!stepBall(sdt)) break;
    }
  }

  // Returns false if stepping should stop (ball lost / level cleared)
  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < HUD_H) { ball.y = HUD_H + ball.r; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0 && circleRectHit(ball.x, ball.y, ball.r, paddle)) {
      const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const angle = clamp(hitPos, -1, 1) * (Math.PI / 3); // up to 60 degrees
      ball.speed = Math.min(ball.speed * 1.01, LEVELS[levelIndex].speed * 1.6);
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.cos(angle) * ball.speed;
      ball.y = paddle.y - ball.r - 0.5;
    }

    // Bricks (one hit per substep)
    for (const b of bricks) {
      if (!b.alive) continue;
      const hit = circleRectHit(ball.x, ball.y, ball.r, b);
      if (!hit) continue;
      if (hit.axis === "x") {
        ball.vx = hit.sign * Math.abs(ball.vx);
        ball.x += hit.sign * hit.depth;
      } else {
        ball.vy = hit.sign * Math.abs(ball.vy);
        ball.y += hit.sign * hit.depth;
      }
      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        score += 10 * b.maxHp * (levelIndex + 1);
        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color, 14);
      } else {
        score += 5;
        spawnParticles(ball.x, ball.y, "#ffffff", 5);
      }
      break;
    }

    // Level cleared?
    if (bricks.every((b) => !b.alive)) {
      if (levelIndex + 1 < LEVELS.length) {
        state = "levelClear";
        stateTimer = 0.8;
      } else {
        state = "win";
      }
      return false;
    }

    // Ball lost
    if (ball.y - ball.r > H) {
      lives--;
      if (lives <= 0) {
        state = "gameOver";
      } else {
        resetBall();
        state = "serve";
      }
      return false;
    }
    return true;
  }

  // ---- Render ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.strokeStyle = "#3a4560";
    ctx.beginPath();
    ctx.moveTo(0, HUD_H);
    ctx.lineTo(W, HUD_H);
    ctx.stroke();

    ctx.font = "bold 18px Segoe UI, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#e8ecf4";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, HUD_H / 2);

    ctx.textAlign = "center";
    ctx.fillText(LEVELS[levelIndex].name + " / " + LEVELS.length, W / 2, HUD_H / 2);

    ctx.textAlign = "right";
    ctx.fillText("Lives:", W - 16 - MAX_LIVES * 22, HUD_H / 2);
    for (let i = 0; i < MAX_LIVES; i++) {
      ctx.beginPath();
      ctx.arc(W - 16 - (MAX_LIVES - 1 - i) * 22 - 8, HUD_H / 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = i < lives ? "#ff5d73" : "#3a4560";
      ctx.fill();
    }
  }

  function drawBricks() {
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.globalAlpha = 0.45 + 0.55 * (b.hp / b.maxHp);
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.maxHp > 1) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#10131c";
        ctx.font = "bold 13px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 4);
    }
    ctx.lineWidth = 1;
  }

  function drawPaddle() {
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    const g = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    g.addColorStop(0, "#9fb4ff");
    g.addColorStop(1, "#4b63d6");
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#9fb4ff";
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay(title, lines) {
    ctx.fillStyle = "rgba(8,10,16,0.7)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 46px Segoe UI, Arial, sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 40);
    ctx.font = "20px Segoe UI, Arial, sans-serif";
    ctx.fillStyle = "#c9d3ea";
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 15 + i * 30));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBricks();
    drawPaddle();
    drawBall();
    drawParticles();
    drawHUD();

    switch (state) {
      case "title":
        drawOverlay("BRICK BREAKER", [
          "Mouse or Arrow keys / A-D to move",
          "Click or press Space to start",
        ]);
        break;
      case "serve":
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "18px Segoe UI, Arial, sans-serif";
        ctx.fillStyle = "#c9d3ea";
        ctx.fillText("Click or press Space to launch", W / 2, H / 2 + 80);
        break;
      case "paused":
        drawOverlay("PAUSED", ["Press P, Esc, Space or click to resume"]);
        break;
      case "levelClear":
        drawOverlay("LEVEL CLEAR!", [
          "Score: " + score,
          stateTimer <= 0 ? "Click or press Space for " + LEVELS[levelIndex + 1].name : "",
        ]);
        break;
      case "gameOver":
        drawOverlay("GAME OVER", ["Final score: " + score, "Click or press Space to play again"]);
        break;
      case "win":
        drawOverlay("YOU WIN!", ["All levels cleared!", "Final score: " + score, "Click or press Space to play again"]);
        break;
    }
  }

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  buildLevel(0);
  stickBall();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
