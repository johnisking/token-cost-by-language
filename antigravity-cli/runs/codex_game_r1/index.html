<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Breaker</title>
<style>
:root{color-scheme:dark;--ink:#eaf6ff;--muted:#9ab3c9;--cyan:#53e6ff;--pink:#ff5f9e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% 0%,#1b3760 0,#0b1528 52%,#070b15 100%)}.game{width:min(920px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 4px 12px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#47e5ff,#7284ff);color:#071222;font-size:21px;box-shadow:0 0 24px #53e6ff44}h1{font-size:clamp(18px,4vw,24px);letter-spacing:.02em;margin:0}.tagline{color:var(--muted);font-size:12px;margin-top:2px}.stats{display:flex;gap:clamp(12px,4vw,32px);align-items:center}.stat{min-width:52px;text-align:right}.stat span{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.14em}.stat strong{display:block;font-size:19px;font-variant-numeric:tabular-nums}.hearts{color:var(--pink);letter-spacing:3px;white-space:nowrap}.stage{position:relative;border:1px solid #6c94c555;border-radius:16px;padding:8px;background:#081326;box-shadow:0 24px 70px #0009,inset 0 0 28px #4adfff0b}canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none;background:#081326}.overlay{position:absolute;inset:8px;border-radius:10px;display:grid;place-items:center;padding:20px;text-align:center;background:#06101dcc;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.card{max-width:430px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.card h2{margin:9px 0;font-size:clamp(28px,6vw,44px);line-height:1.05}.card p{color:#b1c4d9;line-height:1.55;margin:0 auto 20px}button{border:0;border-radius:999px;padding:12px 24px;color:#06101c;background:linear-gradient(100deg,#53e6ff,#9affdc);font:800 14px system-ui;cursor:pointer;box-shadow:0 8px 24px #53e6ff33}button:hover{filter:brightness(1.08);transform:translateY(-1px)}.help{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;margin-top:12px;color:var(--muted);font-size:12px}kbd{padding:2px 6px;color:var(--ink);border:1px solid #52708d;border-radius:5px;background:#14243b;font:600 11px ui-monospace,monospace}@media(max-width:520px){body{padding:12px}.tagline{display:none}.stat{min-width:42px}.stat strong{font-size:16px}.stage{padding:5px}.overlay{inset:5px}}
</style>
</head>
<body>
<main class="game">
<header><div class="brand"><div class="mark">✦</div><div><h1>BRICK BREAKER</h1><div class="tagline">Clear the wall. Keep the ball alive.</div></div></div><div class="stats" aria-live="polite"><div class="stat"><span>SCORE</span><strong id="score">0000</strong></div><div class="stat"><span>LEVEL</span><strong id="level">1 / 2</strong></div><div class="stat"><span>LIVES</span><strong class="hearts" id="lives">♥ ♥ ♥</strong></div></div></header>
<section class="stage" aria-label="Brick breaker game"><canvas id="board" width="900" height="560" aria-label="Game field. Move the paddle with the left and right arrow keys or mouse."></canvas><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">READY?</div><h2 id="headline">Break the wall.</h2><p id="message">Use your paddle to bounce the ball and clear both levels. You have three lives.</p><button id="start">Start game</button></div></div></section>
<div class="help"><span><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> Move paddle</span><span>Mouse: move paddle</span><span><kbd>Space</kbd> Launch / continue</span></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),livesEl=document.getElementById('lives');const overlay=document.getElementById('overlay'),headline=document.getElementById('headline'),message=document.getElementById('message'),eyebrow=document.getElementById('eyebrow'),startBtn=document.getElementById('start');
const W=900,H=560,paddle={w:116,h:13,x:392,y:522,speed:8},ball={x:450,y:500,r:8,vx:0,vy:0};const keys={};let score=0,lives=3,level=1,bricks=[],running=false,launched=false,last=0,raf=0;const palettes=[['#ff668f','#ff9f68','#ffd166','#72e2bd','#68caff'],['#b18cff','#718bff','#4ce0ff','#55e5bb','#ffe071']];
function makeBricks(){bricks=[];const rows=level===1?5:6,cols=10,gap=8,left=42,top=62,bw=(W-left*2-gap*(cols-1))/cols,bh=level===1?24:22;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level===2&&((r===1||r===4)&&(c===2||c===7)))continue;bricks.push({x:left+c*(bw+gap),y:top+r*(bh+9),w:bw,h:bh,hp:level===2&&r<2?2:1,color:palettes[level-1][r%5]})}}
function resetBall(){launched=false;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=0;ball.vy=0}function updateHud(){scoreEl.textContent=String(score).padStart(4,'0');levelEl.textContent=level+' / 2';livesEl.textContent='♥ '.repeat(lives).trim()||'—'}function show(title,desc,label,over='READY?'){running=false;cancelAnimationFrame(raf);headline.textContent=title;message.textContent=desc;startBtn.textContent=label;eyebrow.textContent=over;overlay.hidden=false}function launch(){if(launched)return;launched=true;ball.vx=(Math.random()<.5?-1:1)*3.5;ball.vy=-5.7}function begin(){if(headline.textContent==='You win!'||headline.textContent==='Game over'){score=0;lives=3;level=1;makeBricks();paddle.x=(W-paddle.w)/2;updateHud();resetBall()}overlay.hidden=true;running=true;last=performance.now();launch();raf=requestAnimationFrame(loop)}
function pointer(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*W;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));if(!launched)resetBall()}canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{pointer(e);if(running&&!launched)launch()});startBtn.addEventListener('click',begin);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.code==='Space'){if(!running)begin();else launch()}if(e.key==='Enter'&&!running)begin()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function hit(rect){const x=Math.max(rect.x,Math.min(ball.x,rect.x+rect.w)),y=Math.max(rect.y,Math.min(ball.y,rect.y+rect.h));return(ball.x-x)**2+(ball.y-y)**2<ball.r**2}function update(dt){const step=Math.min(dt/16.67,2.2);if(keys.arrowleft||keys.a)paddle.x-=paddle.speed*step;if(keys.arrowright||keys.d)paddle.x+=paddle.speed*step;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(!launched){resetBall();return}ball.x+=ball.vx*step;ball.y+=ball.vy*step;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&hit(paddle)){ball.y=paddle.y-ball.r;const offset=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=offset*6.2;ball.vy=-Math.sqrt(Math.max(17,ball.vx*ball.vx+36))}for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(hit(b)){if(ball.x<b.x||ball.x>b.x+b.w)ball.vx*=-1;else ball.vy*=-1;b.hp--;score+=b.hp===0?10:5;if(!b.hp)bricks.splice(i,1);break}}if(ball.y-ball.r>H){lives--;updateHud();if(lives<=0){show('Game over',`Final score: ${score}. Ready for another round?`,'Play again','OUT OF LIVES');return}resetBall();show('Ball lost','You have '+lives+' '+(lives===1?'life':'lives')+' left.','Continue','LIFE LOST');return}if(!bricks.length){if(level===1){level=2;makeBricks();updateHud();resetBall();show('Level 1 clear!','Level 2 brings a tougher wall. Keep going!','Level 2','NICE WORK');return}show('You win!',`You cleared both levels with ${score} points.`,'Play again','ALL CLEAR');return}updateHud()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1b33');g.addColorStop(1,'#071224');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#95caff0b';for(let x=20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=20;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}bricks.forEach(b=>{ctx.shadowColor=b.color;ctx.shadowBlur=10;ctx.fillStyle=b.color;rr(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff55';rr(b.x+3,b.y+3,b.w-6,4,2);ctx.fill();if(b.hp>1){ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('2',b.x+b.w/2,b.y+b.h-5)}});const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);pg.addColorStop(0,'#a9ffed');pg.addColorStop(1,'#32caff');ctx.shadowColor='#53e6ff';ctx.shadowBlur=16;ctx.fillStyle=pg;rr(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#9affea';ctx.shadowBlur=18;ctx.fill();ctx.shadowBlur=0;if(!launched&&overlay.hidden){ctx.fillStyle='#9ab3c9';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('PRESS SPACE OR CLICK TO LAUNCH',W/2,470)}}function loop(t){if(!running)return;update(t-last);last=t;draw();raf=requestAnimationFrame(loop)}function newGame(){score=0;lives=3;level=1;paddle.x=(W-paddle.w)/2;makeBricks();resetBall();updateHud();draw()}newGame();show('Break the wall.','Use your paddle to bounce the ball and clear both levels. You have three lives.','Start game')
})();
</script>
</body>
</html>
